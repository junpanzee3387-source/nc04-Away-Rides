    </div>`;
  }
  const d = reconcileDraft(state.draft); // 初期設定で家族・スタッフが追加/変更された場合、入力中の下書きにも即時反映する
  const familySectionOpen = d.familySectionOpen !== false;
  const familyRegistrationCompleted = !!d.familyRegistrationCompleted;
  const familyEditingFromCompleted = !!d.familyEditingFromCompleted;
  const staffSectionOpen = d.staffSectionOpen !== false;
  const staffRegistrationCompleted = !!d.staffRegistrationCompleted;
  const staffEditingFromCompleted = !!d.staffEditingFromCompleted;
  const carCountSectionOpen = d.carCountSectionOpen !== false;
  const carCountCompleted = !!d.carCountCompleted;
  const carCountEditingFromCompleted = !!d.carCountEditingFromCompleted;
  const extraCarSectionOpen = d.extraCarSectionOpen !== false;
  const extraCarEditingFromCompleted = !!d.extraCarEditingFromCompleted;
  const prefSectionOpen = d.prefSectionOpen !== false;

  const historyCountsForRegister = computeHistoryCounts();
  const dispatchFamilyRows = state.families.filter(f=>{
    const a=attendanceFor(d.attendance, f);
    return a && a.canDispatch && a.driver && !a.localArrival && !a.absentAll;
  }).map(f=>({surname:f.surname, count:historyCountsForRegister[f.surname]||0, capacity:f.capacity||0}));
  let familyRidePeople = 0;
  state.families.forEach(f=>{
    const a=attendanceFor(d.attendance, f);
    if (!a || a.localArrival || a.absentAll) return;
    if (f.father && a.father) familyRidePeople++;
    if (f.mother && a.mother) familyRidePeople++;
    (f.players||[]).forEach((pp,i)=>{ if(a.players && a.players['p'+i]) familyRidePeople++; });
    (f.others||[]).forEach((oo,i)=>{ if(a.others && a.others['o'+i]) familyRidePeople++; });
  });
  let staffRidePeople = 0;
  state.staff.forEach(st=>{
    const a=d.staffAttendance[st.name];
    if (!a || !a.attend) return;
    if (a.localArrival) return; // 現地集合・解散＝車に乗らないため、必要台数には含めない
    // 家庭の父母と同一人物として紐付け済みなら二重計上しない
    if (st.linkedSurname && st.linkedRole){
      const fa=d.attendance[st.linkedSurname];
      if (fa && !fa.localArrival && !fa.absentAll && fa[st.linkedRole]) return;
    }
    staffRidePeople++;
  });
  const totalRidePeople = familyRidePeople + staffRidePeople;
  const estimatedNeededCars = totalRidePeople ? Math.ceil(totalRidePeople / 4) : 0;
  const familyDispatchSummaryHtml = dispatchFamilyRows.length
    ? dispatchFamilyRows.map(r=>`<span class="counter-pill">${escapeHtml(r.surname)}家：過去${r.count}回</span>`).join(' ')
    : '<span class="small-muted">配車可能な家庭はまだ登録されていません。</span>';

  const officerFamilies = state.families.filter(f=>f.vehicleRoles.officer);
  const equipFamilies = state.families.filter(f=>f.vehicleRoles.equipment);

  const famBlocks = state.families.map(f=>{
    const a = attendanceFor(d.attendance, f);
    const playersHtml = (f.players||[]).map((p,i)=>{
      const k = 'p'+i;
      return `<label class="chk"><input type="checkbox" data-action="att-player" data-family-id="${escapeHtml(f.id)}" data-pk="${k}" ${a.players[k]?'checked':''}> ${escapeHtml(p.number)}${p.name?(' '+escapeHtml(p.name)):''}選手</label>`;
    }).join('');
    const othersHtml = (f.others||[]).map((o,i)=>{
      const k = 'o'+i;
      const checked = !!(a.others && a.others[k]);
      return `<label class="chk"><input type="checkbox" data-action="att-other" data-family-id="${escapeHtml(f.id)}" data-ok="${k}" ${checked?'checked':''}> ${escapeHtml(o.name)}${o.relation?('（'+escapeHtml(o.relation)+'）'):''}<span class="small-muted">・兄弟姉妹</span></label>`;
    }).join('');

    const canDispatchPossible = (f.father && a.father) || (f.mother && a.mother);
    const driverOptions = `
      ${f.father && a.father ? `<option value="father" ${a.driver==='father'?'selected':''}>父：${escapeHtml(f.father.name)}</option>`:''}
      ${f.mother && a.mother ? `<option value="mother" ${a.driver==='mother'?'selected':''}>母：${escapeHtml(f.mother.name)}</option>`:''}
    `;
    const isAbsentAll = !!a.absentAll;
    const isOpen = state.famOpen[familyIdentity(f)] === true;

    // 折り畳み時に一目で状況がわかるよう、参加・配車状況を短いテキストにまとめる
    let summary;
    if (isAbsentAll){
      summary = '全員欠席';
    } else {
      const parentBits = [];
      if (f.father) parentBits.push(a.father ? '父' : null);
      if (f.mother) parentBits.push(a.mother ? '母' : null);
      const parentText = parentBits.filter(Boolean);
      const totalPlayers = (f.players||[]).length;
      const presentPlayers = (f.players||[]).filter((p,i)=>a.players['p'+i]).length;
      const totalOthers = (f.others||[]).length;
      const presentOthers = (f.others||[]).filter((o,i)=>a.others && a.others['o'+i]).length;
      const parts = [];
      if (parentText.length) parts.push(parentText.join('・'));
      if (totalPlayers) parts.push(`選手${presentPlayers}/${totalPlayers}名`);
      if (totalOthers) parts.push(`兄弟姉妹${presentOthers}/${totalOthers}名`);
      summary = parts.length ? parts.join('　') : '参加者なし';
      if (a.localArrival) summary += '　現地集合';
      else if (a.pickupByOther) summary += '　他家族の送迎';
      else if (a.canDispatch) summary += `　配車可（${a.driver==='father'?'父':a.driver==='mother'?'母':'運転手未選択'}）`;
    }

    return `
    <div class="fam-block">
      <button type="button" class="list-row" data-action="toggle-fam-block" data-family-id="${escapeHtml(f.id)}">
        <span class="list-row-main">
          <span class="list-row-name">${escapeHtml(f.surname)}家</span>
          <span class="list-row-meta">${escapeHtml(summary)}</span>
          ${(f.vehicleRoles.officer || f.vehicleRoles.equipment) ? `<span class="list-row-pills">
            ${f.vehicleRoles.officer?'<span class="pill gold">役員車対象</span>':''}
            ${f.vehicleRoles.equipment?'<span class="pill green">用具車対象</span>':''}
          </span>` : ''}
        </span>
        <span class="list-row-arrow" style="transform:rotate(${isOpen?90:0}deg);">›</span>
      </button>
      ${!isOpen ? '' : `
      <div class="fam-block-body">
      <div class="attend-row" style="margin-bottom:8px;">
        <label class="chk" style="font-weight:700;color:var(--red);"><input type="checkbox" data-action="att-absent-all" data-family-id="${escapeHtml(f.id)}" ${isAbsentAll?'checked':''}> 今回は家族全員欠席（保護者・選手とも）</label>
        ${!isAbsentAll ? `<label class="chk"><input type="checkbox" data-action="att-local" data-family-id="${escapeHtml(f.id)}" ${a.localArrival?'checked':''}> 現地集合・解散（配車不要）</label>` : ''}
      </div>
      ${isAbsentAll ? `
      <p class="small-muted" style="margin:0;">家族全員が欠席として登録されています。参加する場合はチェックを外してください。</p>
      ` : `
      <div class="attend-row">
        <span class="small-muted">参加：</span>
        ${f.father?`<label class="chk"><input type="checkbox" data-action="att-parent" data-family-id="${escapeHtml(f.id)}" data-role="father" ${a.father?'checked':''}> 父（${escapeHtml(f.father.name)}）</label>`:''}
        ${f.mother?`<label class="chk"><input type="checkbox" data-action="att-parent" data-family-id="${escapeHtml(f.id)}" data-role="mother" ${a.mother?'checked':''}> 母（${escapeHtml(f.mother.name)}）</label>`:''}
        ${playersHtml}
        ${othersHtml}
      </div>
      ${othersHtml ? `<p class="small-muted" style="margin:2px 0 0;">※兄弟姉妹は、必ず父または母のどちらかと同じ車に同乗します（保護者のみ・兄弟姉妹のみでの乗車はできません）。</p>` : ''}
      ${!a.localArrival ? `
      <div class="attend-row">
        <label class="chk"><input type="checkbox" data-action="att-pickup" data-family-id="${escapeHtml(f.id)}" ${a.pickupByOther?'checked':''}> 集合場所まで、他のご家族に送迎してもらう（この家庭の車は留め置き不要）</label>
      </div>
      ${!a.pickupByOther ? `
      <div class="dispatch-row">
        <label class="chk"><input type="checkbox" data-action="att-dispatch" data-family-id="${escapeHtml(f.id)}" ${a.canDispatch?'checked':''} ${canDispatchPossible?'':'disabled'}> 配車（車出し）可能</label>
        ${a.canDispatch ? `
          <span class="small-muted">運転手：</span>
          <select data-action="att-driver" data-family-id="${escapeHtml(f.id)}" style="width:auto;">
            <option value="">選択してください</option>
            ${driverOptions}
          </select>
          <span class="small-muted">定員 ${f.capacity}名</span>
        ` : ''}
      </div>` : ''}
      ` : ''}
      `}
      </div>
      `}
    </div>`;
  }).join('');

  const regularStaff = state.staff.filter(s=>!isSupportCoach(s));
  const supportStaff = state.staff.filter(s=>isSupportCoach(s));

  // 指導者・コーチは「不参加／チーム車（役員・指導者車）に乗車／現地集合・解散」の
  // 3択で入力する。ここで決めた結果が、そのあとの家族の配車計算と
  // 役員・指導者車の要否判定にそのまま反映される。
  const STAFF_MODES = [
    {mode:'none',    label:'不参加'},
    {mode:'officer', label:'チーム車に乗車'},
    {mode:'local',   label:'現地集合・解散'},
  ];
  const staffModeOf = (a)=>{
    if (!a || !a.attend) return 'none';
    return a.localArrival ? 'local' : 'officer';
  };
  const staffBlocks = regularStaff.map(s=>{
    const a = d.staffAttendance[s.name] || {attend:false, rideOfficerCar:true, localArrival:false, pickupByOther:false};
    const mode = staffModeOf(a);
    const nm = escapeHtml(s.name);
    // 「チーム車に乗車」の場合のみ、この方の自家用車を集合場所に留め置くかどうかの論点が発生する。
    // 保護者の車などで送迎してもらえば、この方の車自体が集合場所に来ないため留め置き不要となる。
    const pickupRowHtml = mode==='officer' ? `
      <div class="staff-attend-pickup">
        <label class="chk"><input type="checkbox" data-action="att-staff-pickup" data-name="${nm}" ${a.pickupByOther?'checked':''}> 集合場所まで、保護者の車などで送迎してもらう（この方の車は留め置き不要）</label>
      </div>` : '';
    return `
    <div class="staff-attend-block">
      <div class="staff-attend-name">${nm}<span class="small-muted">（${escapeHtml(s.role)}）</span></div>
      <div class="staff-attend-modes">
        ${STAFF_MODES.map(m=>`<label class="chk"><input type="radio" name="staffmode-${nm}" data-action="att-staff-mode" data-name="${nm}" data-mode="${m.mode}" ${mode===m.mode?'checked':''}> ${m.label}</label>`).join('')}
      </div>
      ${pickupRowHtml}
    </div>`;
  }).join('');

  const supportStaffRows = supportStaff.map(s=>{
    const a = d.staffAttendance[s.name] || {attend:false, rideOfficerCar:false, pickupByOther:false};
    const checked = !!(a.attend && a.rideOfficerCar);
    const nm = escapeHtml(s.name);
    const supportPickupHtml = checked ? `
      <label class="chk" style="margin-left:18px;"><input type="checkbox" data-action="att-staff-pickup" data-name="${nm}" ${a.pickupByOther?'checked':''}> 送迎してもらう（車は留め置き不要）</label>` : '';
    return `<div class="staff-attend-block" style="padding:4px 0;border-bottom:none;"><label class="chk"><input type="checkbox" data-action="att-staff-ride" data-name="${nm}" ${checked?'checked':''}> ${nm}</label>${supportPickupHtml}</div>`;
  }).join('');

  const attendingRegularCount = regularStaff.filter(s=>d.staffAttendance[s.name] && d.staffAttendance[s.name].attend).length;
  const officerRideCount = regularStaff.filter(s=>{
    const a = d.staffAttendance[s.name];
    return a && a.attend && a.rideOfficerCar && !a.localArrival;
  }).length;
  const localStaffCount = regularStaff.filter(s=>{
    const a = d.staffAttendance[s.name];
    return a && a.attend && a.localArrival;
  }).length;
  const ridingSupportCount = supportStaff.filter(s=>{
    const a = d.staffAttendance[s.name];
    return a && a.attend && a.rideOfficerCar;
  }).length;
  const staffSectionSummary = `チーム車に乗車 ${officerRideCount}名　／　現地集合・解散 ${localStaffCount}名　／　不参加 ${regularStaff.length - attendingRegularCount}名`
    + (supportStaff.length ? `　／　同乗サポートコーチ ${ridingSupportCount}名` : '');

  // 今回、役員・指導者車として実際に使用するかどうか（①初期設定の車両属性は変更しない）
  const officerCarActiveNow = isOfficerCarActive(state.staff, d.staffAttendance);
  const officerDesignatedFamilies = [...new Set(d.extraCars.filter(ec=>ec.type==='officer').map(ec=>{
    const fam = ec.familyId ? familyById(ec.familyId) : (ec.familySurname ? familyBySurname(ec.familySurname) : null);
    return fam ? fam.surname : null;
  }).filter(Boolean))];
  // 初期設定で役員・指導者車（総務車両）に指定されている家庭は、今回の担当指定が
  // 未選択（自動選択）でも「今回どちらの用途で使われるか」が分かるように一覧へ出す。
  const officerRoleFamilies = [...new Set([
    ...officerDesignatedFamilies,
    ...state.families.filter(f=>f.vehicleRoles && f.vehicleRoles.officer).map(f=>f.surname),
  ])];
  // 例：辻号【役員・指導者車】／辻号【選手・保護者号】
  const officerVehicleUseHtml = officerRoleFamilies.length ? `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
      ${officerRoleFamilies.map(sn=>`<span class="pill ${officerCarActiveNow?'gold':''}">${escapeHtml(sn)}号【${officerCarActiveNow?'役員・指導者車':'選手・保護者号'}】</span>`).join('')}
    </div>` : '';
  const officerCarStatusHtml = d.extraCars.some(ec=>ec.type==='officer') ? (officerCarActiveNow ? `
    <div class="small-muted" style="margin-top:6px;">今回は<b>役員・指導者車として使用</b>します（チーム車に乗車する指導者・コーチがいるため）。総務担当者の乗車条件が適用されます。</div>
    ${officerVehicleUseHtml}
  ` : `
    <div class="small-muted" style="margin-top:6px;color:#8A5A00;">今回は<b>役員・指導者車として使用する必要がありません</b>（チーム車に乗車する指導者・コーチがいないため）。${officerDesignatedFamilies.length?`${officerDesignatedFamilies.map(sn=>escapeHtml(sn)+'号').join('・')}は`:'指定された車両は'}この回だけ<b>選手・保護者号（一般車）</b>として配車し、前川母・本多母などの総務担当者の乗車必須条件も解除されます。①初期設定の車両区分は変更されません。</div>
    ${officerVehicleUseHtml}
  `) : officerVehicleUseHtml;

  // STEP 1の結果をSTEP 2の冒頭にも示し、家族の配車を考えやすくする
  const staffPlanForFamilyHtml = `
    <div class="small-muted" style="margin-top:6px;">STEP 1の結果：チーム車に乗車 <b>${officerRideCount}名</b>　／　現地集合・解散 <b>${localStaffCount}名</b>　／　不参加 <b>${regularStaff.length - attendingRegularCount}名</b></div>
    ${officerCarActiveNow
      ? `<div class="small-muted" style="margin-top:2px;">役員・指導者車を使用するため、対象車両には一般の選手・保護者は乗せません。</div>`
      : `<div class="small-muted" style="margin-top:2px;color:#8A5A00;">役員・指導者車は不要のため、対象車両は<b>選手・保護者号</b>として通常どおり配車に使えます。</div>`}
    ${officerVehicleUseHtml}`;

  const extraCarRows = d.extraCars.map((ec,i)=>{
    const opts = (ec.type==='officer'?officerFamilies:equipFamilies).map(f=>`<option value="${escapeHtml(f.id)}" ${ec.familyId===f.id || (!ec.familyId && ec.familySurname===f.surname)?'selected':''}>${escapeHtml(f.surname)}号</option>`).join('');
    return `
    <div class="row-extracar">
      <div><span class="pill ${ec.type==='officer'?'gold':'green'}">${ec.type==='officer'?'役員・指導者車':'用具車'}</span>${(ec.type==='officer')?`<br><span class="small-muted">今回【${officerCarActiveNow?'役員・指導者車':'選手・保護者号'}】</span>`:''}</div>
      <div class="stack"><span class="field-label">担当家庭</span>
        <select data-action="ex-family" data-i="${i}">
          <option value="">自動選択（履歴の少ない家庭を優先）</option>
          ${opts}
        </select>
      </div>
      <div class="stack"><span class="field-label">運転手</span>
        <select data-action="ex-driver" data-i="${i}">
          <option value="">（担当家庭の設定に従う）</option>
          <option value="father" ${ec.driver==='father'?'selected':''}>父</option>
          <option value="mother" ${ec.driver==='mother'?'selected':''}>母</option>
        </select>
      </div>
      <div><button class="btn danger small" data-action="remove-extra-car" data-i="${i}" type="button">削除</button></div>
    </div>`;
  }).join('');

  const currentDispatchCount = computeCurrentCarTotal(d); // 役員・指導者車／用具車の重複計上を除いた実際の台数
  const target = parseInt(d.targetCarCount,10);
  const candidateShortfall = (target && target>0) ? Math.max(0, target - currentDispatchCount) : 0;
  let targetCounterHtml = '';
  if (target && target>0){
    if (currentDispatchCount === target){
      targetCounterHtml = `<span class="counter-pill ok">候補 ${currentDispatchCount}台 ／ 上限 ${target}台 ✓</span>`;
    } else if (currentDispatchCount < target){
      // 「あと◯台」＝上限台数を増やしただけでは満たされない。STEP 2で家庭を
      // 「配車（車出し）可能」にチェックし、運転手を選ぶまで候補は増えない。
      targetCounterHtml = `<span class="counter-pill">候補 ${currentDispatchCount}台 ／ 上限 ${target}台 （候補があと${candidateShortfall}台足りません）</span>`;
    } else {
      targetCounterHtml = `<span class="counter-pill over">候補 ${currentDispatchCount}台 ／ 上限 ${target}台 （候補が${currentDispatchCount-target}台多い・輪番選択）</span>`;
    }
  } else {
    targetCounterHtml = `<span class="counter-pill">車出し候補：${currentDispatchCount}台</span>`;
  }
  const candidateShortfallNoteHtml = candidateShortfall>0 ? `
    <p class="small-muted" style="margin-top:6px;color:#8A5A00;">
      ※<b>使用上限台数を増やすだけでは車は増えません。</b>実際に使える車は、STEP 2「家族ごとの参加・配車」で
      「配車（車出し）可能」にチェックし運転手を選んだ家庭の数までです。台数を増やしたい場合は、
      STEP 2で対象の家庭を追加でチェックしてください（現在 ${currentDispatchCount}台 ／ 上限 ${target}台）。
    </p>` : '';

  const PREF_KEYS = ['couple','parentChild','avoidMixedGender','motherOnlyOk'];
  const PREF_KEYS_WITH_PRIORITY = ['couple','parentChild','avoidMixedGender']; // motherOnlyOkは順位を使わない単純なON/OFF設定
  const prefItemsHtml = `
    ${PREF_KEYS.map(k=>{
      const it = d.preferences.items[k];
      const usesPriority = PREF_KEYS_WITH_PRIORITY.includes(k);
      return `
      <div class="pref-item">
        <label class="chk" style="flex:0 0 auto;"><input type="checkbox" data-action="pref-check" data-key="${k}" ${it.checked?'checked':''}></label>
        <span class="lbl">${escapeHtml(it.label)}</span>
        ${usesPriority ? `
        <select data-action="pref-priority" data-key="${k}" ${it.checked?'':'disabled'}>
          <option value="">優先度なし</option>
          <option value="1" ${it.priority==1?'selected':''}>1位</option>
          <option value="2" ${it.priority==2?'selected':''}>2位</option>
          <option value="3" ${it.priority==3?'selected':''}>3位</option>
        </select>` : ''}
      </div>`;
    }).join('')}
  `;

  return `
  <div class="card" style="margin-top:12px;">
    <h2>遠征情報</h2>
    <div class="stack" style="margin-bottom:10px;"><span class="field-label">日付</span><div class="date-input-wrap"><input type="date" data-action="draft-field" data-field="date" value="${d.date}"></div></div>
    <div class="form-grid">
      <div class="stack"><span class="field-label">行先・対戦相手</span><input type="text" data-action="draft-field" data-field="destination" value="${escapeHtml(d.destination)}" placeholder="例：vs 名古屋中央ボーイズ"></div>
      <div class="stack"><span class="field-label">場所</span><input type="text" data-action="draft-field" data-field="location" value="${escapeHtml(d.location)}" placeholder="例：木場南グラウンドB面"></div>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <div class="card-head-row">
      <h2><span class="step-no">STEP 1</span>指導者・コーチの参加・乗車方法 <span class="tag">${staffRegistrationCompleted?'登録完了':'入力中'}</span></h2>
      <button class="btn ghost small toggle-btn" data-action="${staffSectionOpen ? (staffEditingFromCompleted ? 'cancel-staff-edit' : 'toggle-staff-section') : (staffRegistrationCompleted ? 'edit-staff-registration' : 'toggle-staff-section')}" type="button">${staffSectionOpen ? '閉じる' : (staffRegistrationCompleted ? '修正' : '開く')}</button>
    </div>
    <div class="small-muted" style="margin:-2px 0 ${staffSectionOpen?'8px':'0'};">${escapeHtml(staffSectionSummary)}</div>
    ${!staffSectionOpen ? '' : `
    ${(staffRegistrationCompleted && !staffEditingFromCompleted) ? `
      <div class="row-actions" style="margin-top:10px;">
        <button class="btn ghost small" data-action="edit-staff-registration" type="button">修正する</button>
      </div>
    ` : `
      <p class="desc" style="margin:4px 0 8px;">最初に、今回の遠征で<b>指導者・コーチがどうやって現地へ行くか</b>を決めてください。ここで決めた内容が、STEP 2の家族の配車計算と、役員・指導者車の要否判定にそのまま反映されます。</p>
      <div class="attend-row" style="display:block;">${staffBlocks || '<span class="small-muted">未登録です（①初期設定で追加できます）</span>'}</div>
      <p class="small-muted" style="margin:8px 0 0;">「不参加」「現地集合・解散」はどちらも配車対象外です。現地集合・解散の方は一般の保護者車にも乗せません。</p>
      ${supportStaff.length ? `
      <hr class="rule">
      <span class="field-label">今回役員・指導者車に同乗させるサポートコーチを選択してください</span>
      <div class="attend-row" style="margin-top:6px;">${supportStaffRows}</div>

function openFamilyEditor(idx){
  state.familyEditor = idx;
  const f = idx==='new' ? null : state.families[idx];
  state.tempFamily = {
    surname: f?f.surname:'', capacity: f?f.capacity:5,
    fatherGivenName: f&&f.father?parentGivenName(f.father.name, f.surname):'', fatherOfficer: !!(f&&f.father&&f.father.isOfficer),
    motherGivenName: f&&f.mother?parentGivenName(f.mother.name, f.surname):'', motherOfficer: !!(f&&f.mother&&f.mother.isOfficer),
    roleOfficer: !!(f&&f.vehicleRoles.officer), roleEquipment: !!(f&&f.vehicleRoles.equipment),
    equipmentCapacity: (f&&f.equipmentCapacity) ? f.equipmentCapacity : '', equipmentOnly: !!(f&&f.vehicleRoles.equipmentOnly),
  };
  state.tempPlayers = (f&&f.players&&f.players.length) ? f.players.map(p=>({...p})) : [{number:'',name:''}];
  state.tempOthers = (f&&f.others&&f.others.length) ? f.others.map(o=>({...o})) : [];
}
function closeFamilyEditor(){
  state.familyEditor = null; state.tempFamily = null; state.tempPlayers = null; state.tempOthers = null;
}
function openStaffEditor(idx){
  state.staffEditor = idx;
  const s = idx==='new' ? null : state.staff[idx];
  state.tempStaff = {
    name: s?s.name:'', role: s?s.role:'コーチ',
    linkedSurname: (s&&s.linkedSurname) ? s.linkedSurname : '',
    linkedRole: (s&&s.linkedRole) ? s.linkedRole : 'father',
  };
}
function closeStaffEditor(){
  state.staffEditor = null; state.tempStaff = null;
}

function handleClick(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action==='switch-tab'){ state.activeTab = el.dataset.tab; render(); return; }
  if (action==='toggle-family-setup-section'){
    state.familySetupSectionOpen = state.familySetupSectionOpen !== true;
    render();
    return;
  }
  if (action==='toggle-staff-setup-section'){
    state.staffSetupSectionOpen = state.staffSetupSectionOpen !== true;
    render();
    return;
  }
  if (action==='toggle-register-section'){
    if (state.draft) state.draft.registerSectionOpen = state.draft.registerSectionOpen === false;
    else state.registerSectionOpen = !state.registerSectionOpen;
    render();
    return;
  }
  if (action==='toggle-family-section'){
    if (!state.draft) return;
    state.draft.familySectionOpen = state.draft.familySectionOpen === false;
    render();
    return;
  }
  if (action==='complete-family-registration'){
    if (!state.draft) return;
    const d = state.draft;
    // 配車（車出し）可能にチェックが入っているのに運転手が未選択の家庭があれば、
    // 完了させずに注意を表示する
    const missingDriverFamilies = state.families.filter(f=>{
      const a = attendanceFor(d.attendance, f);
      return a && a.canDispatch && !a.driver;
    }).map(f=>f.surname);
    if (missingDriverFamilies.length){
      alert(`運転手が選択されていない家庭があります。運転手を選択してから完了してください。\n（${missingDriverFamilies.map(sn=>sn+'家').join('、')}）`);
      return;
    }
    d.familyRegistrationCompleted = true;
    d.familySectionOpen = false;
    d.familyEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='edit-family-registration'){
    if (!state.draft) return;
    state.draft.familySectionOpen = true;
    state.draft.familyEditingFromCompleted = true;
    render();
    return;
  }
  if (action==='cancel-family-edit'){
    // 「戻る」：修正のために開いた家族セクションを、登録完了の状態のまま閉じる。
    // （入力中に戻さない。既に加えた変更があれば、そのまま保持される）
    if (!state.draft) return;
    state.draft.familySectionOpen = false;
    state.draft.familyEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='complete-staff-registration'){
    if (!state.draft) return;
    state.draft.staffRegistrationCompleted = true;
    state.draft.staffSectionOpen = false;
    state.draft.staffEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='edit-staff-registration'){
    if (!state.draft) return;
    state.draft.staffSectionOpen = true;
    state.draft.staffEditingFromCompleted = true;
    render();
    return;
  }
  if (action==='cancel-staff-edit'){
    // 「戻る」：修正のために開いた指導者・コーチセクションを、登録完了の状態のまま閉じる。
    if (!state.draft) return;
    state.draft.staffSectionOpen = false;
    state.draft.staffEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='complete-car-count'){
    if (!state.draft) return;
    state.draft.carCountCompleted = true;
    state.draft.carCountSectionOpen = false;
    state.draft.carCountEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='edit-car-count'){
    if (!state.draft) return;
    state.draft.carCountSectionOpen = true;
    state.draft.carCountEditingFromCompleted = true;
    render();
    return;
  }
  if (action==='cancel-car-count-edit'){
    // 「戻る」：修正のために開いた車だし台数セクションを、登録完了の状態のまま閉じる。
    if (!state.draft) return;
    state.draft.carCountSectionOpen = false;
    state.draft.carCountEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='toggle-car-count-section'){
    if (!state.draft) return;
    state.draft.carCountSectionOpen = state.draft.carCountSectionOpen === false;
    render();
    return;
  }
  if (action==='toggle-extra-car-section'){
    if (!state.draft) return;
    state.draft.extraCarSectionOpen = state.draft.extraCarSectionOpen === false;
    render();
    return;
  }
  if (action==='toggle-pref-section'){
    if (!state.draft) return;
    state.draft.prefSectionOpen = state.draft.prefSectionOpen === false;
    render();
    return;
  }
  if (action==='complete-extra-cars'){
    if (!state.draft) return;
    state.draft.extraCarCompleted = true;
    state.draft.extraCarSectionOpen = false;
    state.draft.extraCarEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='edit-extra-cars'){
    if (!state.draft) return;
    state.draft.extraCarSectionOpen = true;
    state.draft.extraCarEditingFromCompleted = true;
    render();
    return;
  }
  if (action==='cancel-extra-car-edit'){
    // 「戻る」：修正のために開いた役員・指導者車／用具車セクションを、登録完了の状態のまま閉じる。
    if (!state.draft) return;
    state.draft.extraCarSectionOpen = false;
    state.draft.extraCarEditingFromCompleted = false;
    render();
    return;
  }
  if (action==='toggle-fam-block'){
    const familyId = el.dataset.familyId;
    state.famOpen[familyId] = !state.famOpen[familyId];
    render();
    return;
  }
  if (action==='toggle-staff-section'){
    if (!state.draft) return;
    state.draft.staffSectionOpen = state.draft.staffSectionOpen === false;
    render();
    return;
  }
  if (action==='confirm-ok'){
    const c = state.confirm;
    state.confirm = null;
    if (c && c.onYes) c.onYes();
    else render();
    return;
  }
  if (action==='confirm-cancel'){
    const c = state.confirm;
    state.confirm = null;
    if (c && c.onNo) c.onNo();
    else render();
    return;
  }
  if (action==='set-theme'){
    const theme = el.dataset.theme === 'night' ? 'night' : 'day';
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    storageSetSafe(STORAGE_THEME_KEY, theme).catch(()=>{});
    render();
    return;
  }

  if (action==='undo-delete'){
    const u = state.undo;
    if (u){
      u.array.splice(u.index, 0, u.item);
      state.undo = null;
      if (u.kind==='roster') saveRoster();
      else if (u.kind==='events'){
        saveEvents();
        // トーストからすぐに元に戻した場合は、ごみ箱に残っている同じ項目を取り除く
        const ti = state.eventsTrash.findIndex(t=>t.id===u.item.id);
        if (ti !== -1){ state.eventsTrash.splice(ti,1); saveEventsTrash(); }
      }
      render();
    }
    return;
  }
  if (action==='dismiss-undo'){
    state.undo = null;
    render();
    return;
  }
  if (action==='new-family'){ openFamilyEditor('new'); render(); return; }
  if (action==='edit-family'){ openFamilyEditor(parseInt(el.dataset.idx,10)); render(); return; }
  if (action==='delete-family'){
    const idx = parseInt(el.dataset.idx,10);
    const f = state.families[idx];
    askConfirm(`【削除の確認】\n${f.surname}家を削除します。この操作は取り消せません。よろしいですか？`, ()=>{
      state.families.splice(idx,1);
      pushUndo(state.families, idx, f, `${f.surname}家`, 'roster');
      closeFamilyEditor();
      saveRoster();
      render();
    });
    return;
  }
  if (action==='close-modal'){ closeFamilyEditor(); closeStaffEditor(); render(); return; }
  if (action==='add-player-row'){
    state.tempPlayers.push({number:'',name:''});
    render(); return;
  }
  if (action==='remove-player-row'){
    const pi = parseInt(el.dataset.pi,10);
    const p = state.tempPlayers[pi];
    const label = (p && (p.number || p.name)) ? `${p.number||''} ${p.name||''}`.trim() : 'この選手欄';
    askConfirm(`【削除の確認】\n${label}を削除します。よろしいですか？`, ()=>{
      if (state.tempPlayers.length>1){
        state.tempPlayers.splice(pi,1);
        pushUndo(state.tempPlayers, pi, p, label, 'none');
      } else {
        state.tempPlayers = [{number:'',name:''}];
      }
      render();
    });
    return;
  }
  if (action==='add-other-row'){
    state.tempOthers = state.tempOthers || [];
    state.tempOthers.push({name:'', relation:''});
    render(); return;
  }
  if (action==='remove-other-row'){
    const oi = parseInt(el.dataset.oi,10);
    const o = state.tempOthers[oi];
    const label = (o && (o.name || o.relation)) ? `${o.name||''} ${o.relation||''}`.trim() : 'この家族欄';
    askConfirm(`【削除の確認】\n${label}を削除します。よろしいですか？`, ()=>{
      state.tempOthers.splice(oi,1);
      pushUndo(state.tempOthers, oi, o, label, 'none');
      render();
    });
    return;
  }
  if (action==='save-family'){
    const tf = state.tempFamily;
    if (!tf.surname || !tf.surname.trim()){ alert('苗字を入力してください'); return; }
    const idxRaw = el.dataset.idx;
    const idx = idxRaw==='' ? null : parseInt(idxRaw,10);
    const normalizedSurname = tf.surname.trim();
    const oldFam = idx===null ? null : state.families[idx];
    const fam = {
      id: oldFam && oldFam.id ? oldFam.id : uid('fam'),
      surname: normalizedSurname,
      capacity: Math.max(1, parseInt(tf.capacity,10) || 5),
      equipmentCapacity: tf.equipmentCapacity ? Math.max(1, parseInt(tf.equipmentCapacity,10)||null) : null,
      father: tf.fatherGivenName.trim() ? {name:formatParentName(normalizedSurname, tf.fatherGivenName), isOfficer: !!tf.fatherOfficer} : null,
      mother: tf.motherGivenName.trim() ? {name:formatParentName(normalizedSurname, tf.motherGivenName), isOfficer: !!tf.motherOfficer} : null,

          const parts = key.split('|');
          const sn = parts[0], role = parts[1];
          const pf = familyBySurname(sn);
          if (!pf) return;
          const nm = role==='father' ? (pf.father?pf.father.name:'') : (pf.mother?pf.mother.name:'');
          seats.push({key:`${sn}-${role}`, label:`${nm}`, kind:'parent', surname:sn, gender:role, personName:nm});
        });
        (c.passengerPlayers||[]).filter(Boolean).forEach(key=>{
          const parts = key.split('|');
          const sn = parts[0];
          const idx = parseInt(parts[2],10);
          const pf = familyBySurname(sn);
          if (!pf) return;
          const pl = pf.players && pf.players[idx];
          seats.push({key:`${sn}-player-${idx}`, label:`${pl?pl.number:''} ${sn} ${pl&&pl.name?pl.name:''}`.replace(/\s+/g,' ').trim(), kind:'player', surname:sn, playerIdx:idx, number:(pl&&pl.number)||''});
        });
        (c.passengerStaff||[]).filter(Boolean).forEach(key=>{
          const parts = key.split('|');
          const name = parts[1];
          const st = state.staff.find(s=>s.name===name);
          if (!st) return;
          seats.push({key:'staff-'+st.name, label:`${st.name}`, kind:'staff', surname:null, personName:st.name});
        });
        cars.push({id:uid('car'), familyId:fam.id, type:c.carType||'general', familySurname:fam.surname, driverRole:c.driverRole, capacity:fam.capacity, seats});
      });
      if (!cars.length){ alert('少なくとも1台は運転手を設定してください。'); return; }
      cars.forEach(sortCarSeats); // 選手を背番号順に並べ替えてから保存
      const result = {cars, unassigned:[], warnings:[...buildWarnings, ...findDuplicatePeople(cars)]};
      const ev = {
        id: uid('ev'),
        date: dh.date, destination: dh.destination, location: dh.location,
        result,
        createdAt: new Date().toISOString(),
        isDetailEntry: true,
      };
      state.events.push(ev);
      saveEvents();
      state.detailHistoryDraft = null;
      state.detailHistoryOpen = false;
      render();
    };
    if (!dh.date){ askConfirm('日付が未入力です。このまま保存しますか？', proceed); return; }
    proceed();
    return;
  }

  if (action==='save-history'){
    const d = state.draft;
    if (!d.result){
      alert('配車表がありません。②配車登録から自動配車を作成してください。');
      return;
    }
    const hardErrors = d.result.hardErrors || [];
    const hasHardErrors = d.result.valid===false || hardErrors.length>0;
    const doSave = (overwrite)=>{
      if (d.result && d.result.cars) d.result.cars.forEach(sortCarSeats); // 選手を背番号順に並べ替えてから保存
      const ev = {
        id: overwrite ? (d.editingEventId || uid('ev')) : uid('ev'),
        date: d.date, destination: d.destination, location: d.location,
        result: d.result,
        createdAt: new Date().toISOString(),
        // 絶対条件を満たさないまま保存した場合の記録（履歴一覧に注意表示を出すため）
        savedWithHardErrors: hasHardErrors,
        // この配車表を作成した時点の②配車登録の条件一式を記録しておく。
        // これにより、後で履歴から②に戻って台数や配慮設定を変えた再検証ができる。
        registrationSnapshot: {
          targetCarCount: d.targetCarCount,
          relaxedRules: d.relaxedRules || {},
          attendance: d.attendance || {},
          staffAttendance: d.staffAttendance || {},
          extraCars: d.extraCars || [],
          preferences: d.preferences || null,
        },
      };
      const existingIdx = overwrite ? state.events.findIndex(x=>x.id===ev.id) : -1;
      if (existingIdx>=0) state.events[existingIdx] = ev;
      else state.events.push(ev);
      saveEvents();
      state.draft = null;
      state.activeTab = 'history';
      render();
    };
    const proceed = ()=>{
      if (d.editingEventId){
        // 既存の履歴を編集している場合は、上書きするか新規保存するかを確認する
        state.saveChoice = {
          onOverwrite: ()=>doSave(true),
          onNew: ()=>doSave(false),
        };
        render();
      } else {
        doSave(false);
      }
    };
    const proceedWithDateCheck = ()=>{
      if (!d.date){ askConfirm('日付が未入力です。このまま保存しますか？', proceed); return; }
      proceed();
    };
    if (hasHardErrors){
      // 絶対条件を満たしていない場合でも保存できるようにする。ただし、保存する前に
      // 何が満たされていないかを示したうえで、本当に保存してよいか必ず確認する。
      const errText = hardErrors.length ? hardErrors.map(e=>'・'+e).join('\n') : '・絶対条件を満たしていません。';
      askConfirm(
        `【絶対条件が満たされていません】\n${errText}\n\nこの内容のまま履歴に保存しますか？\n（保存後も、②配車登録に戻って修正することができます）`,
        proceedWithDateCheck
      );
      return;
    }
    proceedWithDateCheck();
    return;
  }
  if (action==='save-choice-overwrite'){
    const c = state.saveChoice;
    state.saveChoice = null;
    if (c && c.onOverwrite) c.onOverwrite();
    return;
  }
  if (action==='save-choice-new'){
    const c = state.saveChoice;
    state.saveChoice = null;
    if (c && c.onNew) c.onNew();
    return;
  }
  if (action==='save-choice-cancel'){
    state.saveChoice = null;
    render();
    return;
  }
  if (action==='edit-history-event'){
    const ev = state.events.find(x=>x.id===el.dataset.id);
    if (!ev) return;
    const base = makeDefaultDraft();
    const result = JSON.parse(JSON.stringify(ev.result));
    if (result && result.cars) result.cars.forEach(sortCarSeats); // 過去データも背番号順に並べ替えて表示
    let draft = base;
    const hasSnapshot = !!ev.registrationSnapshot;
    if (hasSnapshot){
      // ②配車登録の条件が記録されている履歴：その条件を復元し、②に戻って
      // 台数・配慮設定などを変更した再検証もできるようにする。保存後に
      // 家族・指導者コーチの構成が変わっている可能性があるため、
      // reconcileDraft() で現在の登録内容との差分（新規追加分など）を補う。
      const snap = ev.registrationSnapshot;
      draft = reconcileDraft(Object.assign(base, {
        targetCarCount: snap.targetCarCount || '',
        relaxedRules: JSON.parse(JSON.stringify(snap.relaxedRules || {})),
        attendance: JSON.parse(JSON.stringify(snap.attendance || {})),
        staffAttendance: JSON.parse(JSON.stringify(snap.staffAttendance || {})),
        extraCars: JSON.parse(JSON.stringify(snap.extraCars || [])),
        preferences: snap.preferences ? JSON.parse(JSON.stringify(snap.preferences)) : base.preferences,
        familyRegistrationCompleted: true,
        staffRegistrationCompleted: true,
        extraCarCompleted: true,
        carCountCompleted: true,
      }));
    }
    state.draft = Object.assign(draft, {
      date: ev.date, destination: ev.destination, location: ev.location,
      result,
      editingEventId: ev.id,
      hasRegistrationSnapshot: hasSnapshot,
    });
    // この配車表を開いた時点をアンドゥの起点とする。ここでリセットしないと、
    // 別の（以前の）配車表を操作したときのアンドゥ履歴が残ってしまい、
    // 開いた直後なのに「アンドゥ（1つ前に戻す）」が押せる状態に見えてしまう。
    state.assignmentUndo = [];
    state.assignmentRedo = [];
    state.activeTab = 'assignment';
    render();
    return;
  }
  if (action==='delete-history-event'){
    const id = el.dataset.id;
    askConfirm('【削除の確認】\nこの配車履歴を削除します。\n削除後30日間は「ごみ箱」から元に戻せます。よろしいですか？', ()=>{
      const idx = state.events.findIndex(x=>x.id===id);
      if (idx !== -1){
        const ev = state.events[idx];
        state.events.splice(idx,1);
        pushUndo(state.events, idx, ev, `${ev.date||''} ${ev.destination||''}`.trim() || 'この配車履歴', 'events');
        // 直後の「元に戻す」トースト（1件だけ）とは別に、30日間はごみ箱からも復元できるようにする
        state.eventsTrash.push({id: ev.id, event: ev, deletedAt: new Date().toISOString()});
        saveEvents();
        saveEventsTrash();
        render();
      }
    });
    return;
  }
  if (action==='restore-from-trash'){
    const id = el.dataset.id;
    const idx = state.eventsTrash.findIndex(t=>t.id===id);
    if (idx === -1) return;
    const item = state.eventsTrash[idx];
    state.eventsTrash.splice(idx,1);
    if (item.event && !state.events.some(ev=>ev.id===item.event.id)){
      state.events.push(item.event);
    }
    // 直近の削除トーストがまだ同じ項目を指していれば、二重に復元されないよう消しておく
    if (state.undo && state.undo.kind==='events' && state.undo.item && state.undo.item.id===id){
      state.undo = null;
    }
    saveEvents();
    saveEventsTrash();
    render();
    return;
  }
  if (action==='purge-trash-item'){
    const id = el.dataset.id;
    askConfirm('【完全に削除】\nこの配車履歴をごみ箱から完全に削除します。この操作は取り消せません。よろしいですか？', ()=>{
      const idx = state.eventsTrash.findIndex(t=>t.id===id);
      if (idx !== -1){
        state.eventsTrash.splice(idx,1);
        saveEventsTrash();
        render();
      }
    });
    return;
  }
  if (action==='toggle-history-trash'){
    state.historyTrashOpen = !state.historyTrashOpen;
    render();
    return;
  }
  if (action==='open-trash-modal'){
    if (purgeExpiredTrash()) saveEventsTrash().catch(()=>{});
    state.trashModalOpen = true;
    render();
    return;
  }
  if (action==='close-trash-modal'){
    state.trashModalOpen = false;
    render();
    return;
  }
}

function handleChange(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const d = state.draft;
  const markFamilyEditing = ()=>{ if(d) d.familyRegistrationCompleted = false; };

  if (action==='tf-check'){
    state.tempFamily[el.dataset.field] = el.checked;
    return;
  }
  if (action==='car-swap-select-out'){
    if (!state.tempCarSwap) state.tempCarSwap = {outId:'', inId:''};
    state.tempCarSwap.outId = el.value;
    return;
  }
  if (action==='car-swap-select-in'){
    if (!state.tempCarSwap) state.tempCarSwap = {outId:'', inId:''};
    state.tempCarSwap.inId = el.value;
    return;
  }
  if (action==='att-parent'){
    // PCで保護者の参加チェックを入れると、render()によるDOM全体の差し替えで
    // ページ先頭へスクロールが戻ってしまうことがある。現在位置を保存してから
    // 再描画し、次のフレームで同じ位置へ戻す。
    const savedScrollY = window.scrollY || window.pageYOffset || 0;
    markFamilyEditing();
    d.attendance[el.dataset.familyId][el.dataset.role] = el.checked;
    if (!el.checked && d.attendance[el.dataset.familyId].driver===el.dataset.role){
      d.attendance[el.dataset.familyId].driver = null;
    }
    render();
    requestAnimationFrame(()=>{
      window.scrollTo(0, savedScrollY);
      setTimeout(()=>window.scrollTo(0, savedScrollY), 0);
    });
    return;
  }
  if (action==='att-player'){
    markFamilyEditing();
    d.attendance[el.dataset.familyId].players[el.dataset.pk] = el.checked;
    return;
  }
  if (action==='att-other'){
    // 選手以外の家族（兄弟姉妹）の乗車選択。兄弟姉妹は必ず保護者と同乗する
    // 必要があるため、実際の座席割り当ておよび絶対条件チェックは
    // assignCars／hardRuleViolations 側で行う。
    markFamilyEditing();
    const a = d.attendance[el.dataset.familyId];
    if (!a.others) a.others = {};
    a.others[el.dataset.ok] = el.checked;
    return;
  }
  if (action==='att-absent-all'){
    markFamilyEditing();
    const familyId = el.dataset.familyId;
    const fam = familyById(familyId);
    const surname = fam ? fam.surname : '';
    const a = d.attendance[familyId];
    if (el.checked){
      // 個別の参加状況を退避してから、家族全員を欠席扱いにする
      a.absentSnapshot = { father: a.father, mother: a.mother, players: Object.assign({}, a.players), others: Object.assign({}, a.others||{}) };
      a.father = false;
      a.mother = false;
      Object.keys(a.players).forEach(k=>{ a.players[k] = false; });
      if (a.others) Object.keys(a.others).forEach(k=>{ a.others[k] = false; });
      a.canDispatch = false;
      a.driver = null;
      a.localArrival = false;
      a.pickupByOther = false;
      a.absentAll = true;
    } else {
      a.absentAll = false;
      if (a.absentSnapshot){
        a.father = a.absentSnapshot.father;
        a.mother = a.absentSnapshot.mother;
        a.players = a.absentSnapshot.players;
        a.others = a.absentSnapshot.others || a.others || {};
        a.absentSnapshot = null;
      }
    }
    render(); return;
  }
  if (action==='att-local'){
    markFamilyEditing();
    const familyId = el.dataset.familyId;
    const fam = familyById(familyId);
    const surname = fam ? fam.surname : '';
    d.attendance[familyId].localArrival = el.checked;
    if (el.checked){
      // 現地集合・解散＝配車メンバーには入らないため、配車可否・運転手の指定を自動で外す
      d.attendance[familyId].canDispatch = false;
      d.attendance[familyId].driver = null;
      d.attendance[familyId].pickupByOther = false;
      // 役員・指導者車／用具車の担当家庭として指定済みだった場合も、その指定を解除する
      d.extraCars.forEach(ec=>{
        if (ec.familyId === familyId || (!ec.familyId && ec.familySurname === surname)){ ec.familyId = null; ec.familySurname = null; ec.driver = null; }
      });
    }
    render(); return;
  }
  if (action==='att-pickup'){
    markFamilyEditing();
    const familyId = el.dataset.familyId;
    const fam = familyById(familyId);
    const surname = fam ? fam.surname : '';
    d.attendance[familyId].pickupByOther = el.checked;
    if (el.checked){
      // 他のご家族が集合場所まで送迎してくれるため、この家庭の車は今回使わない
      d.attendance[familyId].canDispatch = false;
      d.attendance[familyId].driver = null;
      d.extraCars.forEach(ec=>{
        if (ec.familyId === familyId || (!ec.familyId && ec.familySurname === surname)){ ec.familyId = null; ec.familySurname = null; ec.driver = null; }
      });
    }
    render(); return;
  }
  if (action==='att-dispatch'){
    markFamilyEditing();
    d.attendance[el.dataset.familyId].canDispatch = el.checked;
    if (!el.checked) d.attendance[el.dataset.familyId].driver = null;
    render(); return;
  }
  if (action==='att-driver'){
    markFamilyEditing();
    const familyId = el.dataset.familyId;
    const fam = familyById(familyId);
    const surname = fam ? fam.surname : '';
    const newValue = el.value || null;
    // 車出し可能家庭は「候補」として上限台数を超えても登録する。
    // 実際に使う車は配車作成時に絶対条件と輪番を見て選ぶ。
    d.attendance[familyId].driver = newValue;
    deferredRender();
    return;
  }
  if (action==='att-staff-mode'){
    // 指導者・コーチの乗車方法を3択で設定する。
    // ・none    ＝不参加　　　　　　　　→ 配車対象外（従来どおり）
    // ・officer ＝チーム車に乗車　　　　→ 役員・指導者車の乗車対象
    // ・local   ＝現地集合・解散　　　　→ 車に乗らない。配車対象外で、
    //                                     一般の保護者車にも乗せず、
    //                                     役員・指導者車の必要人数にも含めない
    const name = el.dataset.name;
    const mode = el.dataset.mode;
    if (mode==='local')        d.staffAttendance[name] = {attend:true,  rideOfficerCar:false, localArrival:true,  pickupByOther:false};
    else if (mode==='officer') d.staffAttendance[name] = {attend:true,  rideOfficerCar:true,  localArrival:false, pickupByOther:false};
    else                       d.staffAttendance[name] = {attend:false, rideOfficerCar:true,  localArrival:false, pickupByOther:false};
    // 乗車方法を変えると役員・指導者車の要否が変わるため、STEP2以降の表示を更新する
    render(); return;
  }
  if (action==='att-staff-ride'){
    // サポートコーチ用：役員・指導者車に同乗させるかどうかの1つのチェックで、
    // 参加(attend)・役員車同乗(rideOfficerCar)の両方をまとめて設定する
    // （サポートコーチは家庭側＝②の家族欄でも参加登録するため、現地集合・解散は
    //   家族欄の「現地集合・解散（配車不要）」で設定する。ここでは常にfalse）
    d.staffAttendance[el.dataset.name] = {attend: el.checked, rideOfficerCar: el.checked, localArrival:false, pickupByOther:false};
    render(); return;
  }
  if (action==='att-staff-pickup'){
    // 指導者・コーチが集合場所まで保護者の車などで送迎してもらう場合、
    // その方の自家用車を集合場所に留め置く必要がなくなる。
    const name = el.dataset.name;
    const sa = d.staffAttendance[name] || {attend:false, rideOfficerCar:true, localArrival:false, pickupByOther:false};
    sa.pickupByOther = el.checked;
    d.staffAttendance[name] = sa;
    render(); return;
  }
  if (action==='ex-family'){
    d.extraCars[parseInt(el.dataset.i,10)].familyId = el.value || null;
    d.extraCars[parseInt(el.dataset.i,10)].familySurname = null;
    return;
  }
  if (action==='ex-driver'){
    d.extraCars[parseInt(el.dataset.i,10)].driver = el.value || null;
    return;
  }
  if (action==='ts-field'){
    state.tempStaff[el.dataset.field] = el.value;
    render(); return;
  }
  if (action==='pref-check'){
    d.preferences.items[el.dataset.key].checked = el.checked;
    if (!el.checked) d.preferences.items[el.dataset.key].priority = null;
    render(); return;
  }
  if (action==='pref-priority'){
    const key = el.dataset.key;
    const val = el.value ? parseInt(el.value,10) : null;
    if (val){
      // 同じ順位（1位・2位・3位）が複数の項目に重複しないよう、
      // 既にその順位を使っている項目があれば解除する
      Object.keys(d.preferences.items).forEach(k=>{
        if (k!==key && d.preferences.items[k].priority===val) d.preferences.items[k].priority = null;
      });
    }
    d.preferences.items[key].priority = val;
    deferredRender(); // 他の項目の順位表示（解除分）を画面に反映するため
    return;
  }
  if (action==='dh-driver'){
    const i = parseInt(el.dataset.i,10);
    const car = state.detailHistoryDraft.cars[i];
    const val = el.value;
    if (!val){ car.familySurname = null; car.driverRole = null; deferredRender(); return; }
    const parts = val.split('|');
    car.familySurname = parts[0];
    car.driverRole = parts[1];
    deferredRender(); return;
  }
  if (action==='dh-cartype'){
    const i = parseInt(el.dataset.i,10);
    state.detailHistoryDraft.cars[i].carType = el.value;
    render(); return; // 役員・指導者車を選んだ時に同乗者欄が表示されるよう再描画する
  }
  if (action==='dh-passenger-parent'){
    const i = parseInt(el.dataset.i,10);
    const slot = parseInt(el.dataset.slot,10);
    state.detailHistoryDraft.cars[i].passengerParents[slot] = el.value || null;
    deferredRender(); return;
  }
  if (action==='dh-passenger-player'){
    const i = parseInt(el.dataset.i,10);
    const slot = parseInt(el.dataset.slot,10);
    state.detailHistoryDraft.cars[i].passengerPlayers[slot] = el.value || null;
    deferredRender(); return;
  }
  if (action==='dh-passenger-staff'){
    const i = parseInt(el.dataset.i,10);
    const slot = parseInt(el.dataset.slot,10);
    const car = state.detailHistoryDraft.cars[i];
    car.passengerStaff = car.passengerStaff || [];
    car.passengerStaff[slot] = el.value || null;
    deferredRender(); return;
  }
  if (action==='move-seat'){
    const targetId = el.value;
    if (!targetId) return;
    const r = d.result;
    const fromId = el.dataset.from;
    const seatKey = el.dataset.seatkey;
    let seat = null;
    let sourceCar = null;
    if (fromId==='__unassigned__'){
      seat = r.unassigned.find(s=>s.key===seatKey) || null;
    } else {
      sourceCar = r.cars.find(c=>c.id===fromId);
      seat = sourceCar ? sourceCar.seats.find(s=>s.key===seatKey) : null;
    }
    if (!seat) return;

    // 兄弟姉妹本人を移動させる場合：移動先の車に、自分の家庭の保護者
    // （運転手含む）が同乗していない限り移動できない（未配置に戻すのは可）。
    if (seat.kind==='sibling' && targetId!=='__unassigned__'){
      const target = r.cars.find(c=>c.id===targetId);
      if (target){
        const hasFamilyParent = target.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===seat.surname);
        if (!hasFamilyParent){
          alert('兄弟姉妹は、必ず父または母のどちらかが同乗している車にのみ移動できます。'); deferredRender(); return;
        }
      }
    }
    // 保護者（運転手含む）を、兄弟姉妹が同乗している車から移動させる場合：
    // 移動後にその車で同じ家庭の保護者が0名になり、兄弟姉妹だけが残ってしまう
    // ことのないようにする。
    if ((seat.kind==='driver' || seat.kind==='parent') && sourceCar && targetId!==fromId){
      const siblingLeftBehind = sourceCar.seats.some(s=>s.kind==='sibling' && s.surname===seat.surname);
      if (siblingLeftBehind){
        const otherParentRemains = sourceCar.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===seat.surname && s!==seat);
        if (!otherParentRemains){
          alert('この保護者を移動すると、同乗中の兄弟姉妹が保護者なしで残ってしまうため移動できません。先に兄弟姉妹を移動してください。'); deferredRender(); return;
        }
      }
    }

    // 手動移動もアンドゥ対象にする。検証で弾かれた操作は履歴に残さない。
    if (targetId!==fromId){
      pushAssignmentUndo('手動で乗車先を変更');
      // ②配車登録に戻って内容を変更し、再度「自動配車を作成する」を押した際に、
      // この手動修正が確認なしで失われてしまわないようにするための印。
      d.manualAssignmentEditsPending = true;
    }

    if (targetId!=='__unassigned__'){
      const target = r.cars.find(c=>c.id===targetId);
      if (!target) return;
      const capLimit = target.capacity + (isCapacityOverAllowed(target, d.relaxedRules||{}) ? 1 : 0);
      if (target.seats.length >= capLimit){ alert('移動先の車両は定員に達しています。'); deferredRender(); return; }
      if (target.type==='officer'){
        // 運転手1人だけの車から移動する運転手本人も、一般の保護者と同様に
        // 役員・指導者車には（総務担当・監督・会長・コーチ・サポートコーチとして
        // 明示されていない限り）乗車できないようにする。
        if (seat.kind==='player' || ((seat.kind==='parent'||seat.kind==='driver') && !seat.isOfficerParent)){
          alert('役員車には、総務担当・監督・会長・コーチ・サポートコーチ以外は乗車できません。'); deferredRender(); return;
        }
        if (target.seats.length>=4){ alert('役員車は最大4名です。'); deferredRender(); return; }
      }
    }

    // 検証後に元の場所から外す
    if (fromId==='__unassigned__'){
      const i=r.unassigned.findIndex(s=>s.key===seatKey); if(i>=0) r.unassigned.splice(i,1);
    } else if (sourceCar){
      const i=sourceCar.seats.findIndex(s=>s.key===seatKey); if(i>=0) sourceCar.seats.splice(i,1);
    }
    if (targetId==='__unassigned__'){
      r.unassigned.push(seat);
    } else {
      const target = r.cars.find(c=>c.id===targetId);
      // 運転手本人が（運転手1人だけの車から）別の車へ移動する場合、その車では
      // 既にその車自身の運転手がいるため、移動後は同乗の保護者として扱う。
      if (seat.kind==='driver' && fromId!==targetId) seat.kind = 'parent';
      target.seats.push(seat);
      sortCarSeats(target);
    }
    recomputeWarnings(r, state.families, d.relaxedRules||{});
    deferredRender();
    return;
  }
}

function handleInput(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action==='draft-field'){
    state.draft[el.dataset.field] = el.value;
    return;
  }
  if (action==='target-count-field'){
    // 入力のたびに再描画すると、input要素が作り直されてカーソル位置が先頭に戻る。
    // その結果「12」と入力すると「21」になるため、この項目では入力中の再描画をしない。
    state.draft.targetCarCount = el.value;
    return;
  }
  if (action==='tf-field'){
    state.tempFamily[el.dataset.field] = el.value;
    return;
  }
  if (action==='tp-field'){
    const pi = parseInt(el.dataset.pi,10);
    state.tempPlayers[pi][el.dataset.field] = el.value;
    return;
  }
  if (action==='to-field'){
    const oi = parseInt(el.dataset.oi,10);
    state.tempOthers[oi][el.dataset.field] = el.value;
    return;
  }
  if (action==='ts-field'){
    state.tempStaff[el.dataset.field] = el.value;
    return;
  }
  if (action==='dh-field'){
    state.detailHistoryDraft[el.dataset.field] = el.value;
    return;
  }
}

async function init(){
  document.addEventListener('keydown', e=>{
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='z' && state.activeTab==='assignment'){
      const ae = document.activeElement;
      const tag = ae && ae.tagName;
      // 入力欄・select編集中のブラウザ標準Undoを邪魔しない
      if (tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
      e.preventDefault();
      undoAssignment();
    }
  });
  document.addEventListener('click', e=>{ handleClick(e); scheduleDraftAutoSave(); });
  document.addEventListener('change', e=>{
    if (e.target && e.target.id === 'import-file-input'){
      const file = e.target.files && e.target.files[0];
      if (file){
        const reader = new FileReader();
        reader.onload = () => importAppDataFromText(String(reader.result||''));
        reader.onerror = () => alert('ファイルの読み込みに失敗しました。');
        reader.readAsText(file);
      }
      e.target.value = '';
      return;
    }
    // スマートフォン（特にAndroid）では、選択直後にDOMを再描画すると
    // ネイティブのドロップダウン（選択肢一覧）がすぐに閉じず、
    // 画面をスクロールする等の別操作をしないと消えないことがある。
    // 選択された瞬間に明示的にフォーカスを外すことで、再描画のタイミングに
    // 関わらずドロップダウンをすぐ閉じさせる。
    if (e.target && e.target.tagName === 'SELECT'){
      e.target.blur();
    }
    handleChange(e); scheduleDraftAutoSave();
  });
  document.addEventListener('input', e=>{ handleInput(e); scheduleDraftAutoSave(); });
  await loadAll();
  render();
}
init();

</script>
