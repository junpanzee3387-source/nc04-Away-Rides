<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC04 Away Rides ～配車メーカー～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --ink:#152A3D;
    --ink-soft:#33506A;
    --field:#2C6B4A;
    --field-dark:#1E4C35;
    --paper:#F1ECDA;
    --paper-line:#D9CFAE;
    --chalk:#FBF9F2;
    --surface:#ffffff;
    --zebra:#FBF9F2;
    --gold:#D9A441;
    --red:#B4483C;
    --white:#ffffff;
    --shadow: 0 2px 0 rgba(21,42,61,0.08);
    --noise: rgba(21,42,61,0.035);
    /* マストヘッド・タブ・見出しバーは昼夜どちらでも同じ濃紺で固定 */
    --bar:#152A3D;
    --bar-dark:#0F1E2C;
    --on-bar:#FBF9F2;
  }
  :root[data-theme="night"]{
    --ink:#E8EEF3;
    --ink-soft:#A9BAC8;
    --paper:#0E1720;
    --paper-line:#2A3C4C;
    --chalk:#17232E;
    --surface:#121C25;
    --zebra:#1C2935;
    --shadow: 0 2px 0 rgba(0,0,0,0.4);
    --noise: rgba(255,255,255,0.03);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{
    font-family:'Noto Sans JP', sans-serif;
    background:
      repeating-linear-gradient(0deg, var(--noise) 0px, var(--noise) 1px, transparent 1px, transparent 34px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    transition:background-color .2s ease, color .2s ease;
  }
  .app{max-width:1080px;margin:0 auto;padding:0 0 60px;overflow-x:hidden;}
  input[type=text], input[type=number], input[type=date], select, .stack, .form-grid > *{min-width:0;}
  .masthead{
    background:linear-gradient(180deg,var(--bar) 0%, var(--bar-dark) 100%);
    color:var(--on-bar);
    padding:22px 24px 18px;
    border-bottom:6px solid var(--gold);
  }
  .masthead-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .masthead h1{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    letter-spacing:.04em;
    margin:0 0 2px;
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .masthead h1 .ttl-main{font-size:30px;}
  .masthead h1 .ttl-sub{font-size:15px;font-weight:700;color:#B9C7D3;letter-spacing:.06em;}
  .masthead .sub{
    font-size:12.5px;
    color:#B9C7D3;
    letter-spacing:.08em;
  }
  .theme-switch{
    display:flex;gap:2px;background:rgba(255,255,255,0.08);
    border-radius:20px;padding:2px;flex:0 0 auto;
  }
  .theme-switch button{
    appearance:none;border:none;cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;font-size:11.5px;
    padding:6px 12px;border-radius:16px;
    background:transparent;color:#9FB2C2;white-space:nowrap;
  }
  .theme-switch button.active{background:var(--gold);color:#152A3D;}
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--bar);
    padding:0 10px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    appearance:none;border:none;cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;font-size:14.5px;
    color:#9FB2C2;
    background:var(--bar-dark);
    padding:10px 4px 9px;
    border-radius:6px 6px 0 0;
    letter-spacing:0;
    white-space:normal;
    text-align:center;
    line-height:1.3;
    flex:1 1 0;
    min-width:0;
  }
  nav.tabs button:first-child{ flex:0.55 1 0; }
  nav.tabs button.active{
    background:var(--paper);
    color:var(--ink);
  }
  main{padding:22px 24px 10px;}
  .card{
    background:var(--chalk);
    border:1px solid var(--paper-line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:18px 20px;
    margin-bottom:18px;
  }
  .card h2{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:17px;font-weight:900;
    margin:0 0 4px;
    color:var(--ink);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .card h2 .tag{
    font-size:11px;font-weight:700;color:var(--field-dark);
    background:#E4EEE6;border:1px solid #BFDAC6;
    padding:2px 8px;border-radius:20px;
    white-space:normal;line-height:1.4;
  }
  .card .desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
  .grid-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .grid-table th{
    background:var(--bar);color:var(--on-bar);
    font-weight:700;font-size:12px;
    padding:8px 8px;text-align:left;
    border:1px solid var(--bar);
  }
  .grid-table td{
    border:1px solid var(--paper-line);
    padding:7px 8px;vertical-align:middle;
    background:var(--surface);
  }
  .grid-table tr:nth-child(even) td{background:var(--zebra);}
  input[type=text], input[type=number], input[type=date], select{
    font-family:'Noto Sans JP', sans-serif;
    border:1px solid #C7BE9E;border-radius:3px;
    padding:6px 7px;font-size:13.5px;line-height:1.5;background:var(--surface);color:var(--ink);
    width:100%;max-width:100%;min-height:34px;
  }
  /* 日付入力（type=date）は端末によって内部のカレンダー部品の幅がCSS指定より
     わずかに広く描画され、他の入力欄と右端が揃わないことがあるため、
     枠線・背景をラッパー側に持たせ、はみ出す分をラッパーでクリップして揃える。
     また、スマートフォン（特にAndroid Chrome）ではtype=date内部の表示部品の
     行の高さがCSSのpaddingだけでは他の入力欄と揃わず、極端に低く表示される
     ことがあるため、ラッパー・input双方に高さ・行間・中央寄せを明示して揃える */
  .date-input-wrap{
    border:1px solid #C7BE9E;border-radius:3px;background:var(--surface);
    padding:0;overflow:hidden;width:100%;max-width:100%;min-height:34px;
    display:flex;align-items:stretch;
  }
  .date-input-wrap input[type=date]{
    display:flex;align-items:center;width:100%;max-width:100%;min-height:34px;
    border:none;border-radius:0;background:transparent;padding:6px 7px;line-height:1.5;
    -webkit-appearance:none;appearance:none;
  }
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--field);flex:0 0 auto;}
  label.chk{display:flex;align-items:flex-start;gap:5px;font-size:12.5px;white-space:normal;max-width:100%;}
  label.chk input[type=checkbox]{margin-top:2px;}
  input[type=radio]{width:16px;height:16px;accent-color:var(--field);flex:0 0 auto;margin-top:2px;}
  /* ②配車登録：入力の順番（STEP 1→2→3）を示すバッジ */
  .step-no{
    font-size:10.5px;font-weight:900;letter-spacing:.04em;
    color:#fff;background:var(--field);
    padding:2px 7px;border-radius:3px;flex:0 0 auto;
  }
  /* ②配車登録：指導者・コーチの「参加する／役員・指導者車に乗車／現地集合・解散」入力 */
  .staff-attend-block{padding:7px 8px;border-bottom:1px solid var(--paper-line);}
  .staff-attend-block:last-child{border-bottom:none;}
  .staff-attend-name{font-size:12.5px;font-weight:700;margin-bottom:4px;}
  .staff-attend-modes{display:flex;flex-wrap:wrap;gap:6px 16px;}
  .staff-attend-modes label.chk{font-size:12px;}
  /* ②配車登録：指導者・コーチが「チーム車に乗車」の場合の送迎（留め置き要否）入力 */
  .staff-attend-pickup{margin-top:6px;padding-top:6px;border-top:1px dashed var(--paper-line);}
  .staff-attend-pickup label.chk{font-size:12px;}
  @media (max-width:480px){
    .staff-attend-modes{gap:5px 12px;}
    .staff-attend-modes label.chk{font-size:11.5px;}
  }
  .btn{
    appearance:none;border:none;cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:13px;
    padding:8px 16px;border-radius:3px;letter-spacing:.02em;
    background:var(--field);color:#fff;
    box-shadow:0 2px 0 var(--field-dark);
  }
  .btn:active{transform:translateY(1px);box-shadow:none;}
  .btn.secondary{background:var(--bar);box-shadow:0 2px 0 #0A1620;}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid #C7BE9E;}
  .btn.danger{background:var(--red);box-shadow:0 2px 0 #7d3128;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .row-actions{display:flex;gap:6px;}
  .empty{
    text-align:center;color:var(--ink-soft);font-size:13px;padding:26px 10px;
    border:1px dashed #C7BE9E;border-radius:4px;background:var(--surface);
  }
  .undo-toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:300;max-width:calc(100% - 24px);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--ink);color:#fff;
    padding:10px 12px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.28);
    font-size:13px;
  }
  .undo-toast .btn{box-shadow:none;}
  .undo-toast .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff;padding:4px 9px;}

  /* ---------- 画像出力専用レイアウト（画面には表示されない） ---------- */
  .export-sheet{
    width:820px;background:#ffffff;padding:20px 24px;
    font-family:'Noto Sans JP', sans-serif;color:#1c1c1c;
  }
  .export-sheet h1{font-family:'Zen Kaku Gothic New', sans-serif;font-size:22px;margin:0 0 4px;color:var(--ink);}
  .export-sheet .meta{font-size:13px;color:#555;margin-bottom:12px;}
  /* 車両カードは車の台数に応じて2～3列に並べ、画像が極端な縦長にならないようにする */
  .export-cars-columns{column-gap:12px;}
  .export-cars-columns .export-car{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;}
  .export-car{border:1px solid #C7BE9E;border-radius:6px;margin-bottom:10px;overflow:hidden;}
  .export-car-head{
    background:var(--ink);color:#fff;padding:6px 12px;
    display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;
  }
  .export-car-head .type{font-weight:400;font-size:12px;color:#C9D6E0;margin-left:8px;}
  .export-seat{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;border-bottom:1px solid #EEE6CE;font-size:13.5px;}
  .export-seat:last-child{border-bottom:none;}
  .export-seat .role{font-size:11px;color:#7A6A3A;background:#F3ECD3;border-radius:10px;padding:2px 9px;}
  .export-empty-car{padding:10px 12px;color:#888;font-size:13px;}
  .export-section-title{font-weight:700;font-size:13.5px;margin:10px 0 4px;color:var(--ink);}
  .export-note{font-size:12.5px;color:#444;background:#F6F1DE;border:1px solid #E1D8B8;border-radius:6px;padding:6px 10px;}
  /* 参加人数集計表（配車で行く／現地集合解散／合計の確認用） */
  .export-summary-table{width:100%;border-collapse:collapse;margin:14px 0 0;font-size:13px;}
  .export-summary-table th, .export-summary-table td{border:1px solid #C7BE9E;padding:4px 10px;text-align:center;}
  .export-summary-table th{background:var(--ink);color:#fff;font-weight:700;font-size:12px;}
  .export-summary-table td:first-child{text-align:left;font-weight:700;background:#F6F1DE;}
  .export-summary-table tr.total-row td{background:#FBEFCF;font-weight:900;}
  .export-summary-table tr.total-row td:first-child{background:#F0DCA0;}
  .pill{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:#EFE3C4;color:#7A5A15;border:1px solid #D9C186;
    white-space:nowrap;
  }
  .pill.green{background:#E1EFE3;color:var(--field-dark);border-color:#BFDAC6;}
  .pill.gold{background:#FBEBC7;color:#8A5B00;border-color:var(--gold);}
  .warn-box{
    background:#FBECE9;border:1px solid #E3B6AC;color:#8A2E22;
    padding:10px 12px;border-radius:4px;font-size:12.5px;margin-bottom:14px;line-height:1.7;
  }
  .warn-box b{display:block;font-size:12.5px;margin-bottom:4px;}
  .car-card{
    border:1px solid var(--paper-line);border-radius:4px;background:var(--surface);margin-bottom:12px;overflow:hidden;
  }
  .car-card .car-head{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bar);color:var(--on-bar);padding:8px 12px;
  }
  .car-card .car-head .name{font-weight:700;font-size:14px;}
  .car-card .car-body{padding:8px 12px;}
  .seat-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:6px 2px;border-bottom:1px dotted #E1D8B8;font-size:13px;gap:8px;
  }
  .seat-row:last-child{border-bottom:none;}
  .seat-row .kindtag{font-size:10.5px;color:var(--ink-soft);}
  .cap-note{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:720px){.two-col{grid-template-columns:1fr;}}
  .field-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;display:block;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:10px;}
  .dh-slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px;}
  .stack{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .row-target{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px;align-items:end;}
  .row-extracar{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:10px;align-items:end;}
  .row-player{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:4px;align-items:center;}
  @media (max-width:520px){
    .row-target{grid-template-columns:1fr;}
    .row-extracar{grid-template-columns:1fr 1fr;}
    .row-extracar > div:first-child{grid-column:1 / -1;}
  }
  @media (max-width:400px){
    .row-extracar{grid-template-columns:1fr;}
    .row-player{grid-template-columns:1fr;}
    .row-player button{justify-self:flex-start;}
  }
  /* .form-grid はスマートフォンでは auto-fit(minmax(190px,1fr)) により
     幅が足りない場合は自動的に1列になるため、ここで無理に2列/1列へ
     固定しない（固定すると日付など幅を取る入力欄同士が重なる原因になっていた） */
  hr.rule{border:none;border-top:1px solid var(--paper-line);margin:14px 0;}
  .list-box{border:1px solid var(--paper-line);border-radius:4px;overflow:hidden;background:var(--surface);}
  .list-row{
    appearance:none;border:none;width:100%;background:var(--surface);cursor:pointer;
    display:flex;align-items:center;gap:8px;text-align:left;
    padding:11px 12px;border-bottom:1px solid var(--paper-line);
    font-family:'Noto Sans JP', sans-serif;color:var(--ink);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row:active{background:var(--zebra);}
  .list-row-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .list-row-name{font-weight:700;font-size:14px;}
  .list-row-meta{font-size:12px;color:var(--ink-soft);white-space:normal;}
  .list-row-pills{display:flex;gap:4px;flex-wrap:wrap;}
  .list-row-arrow{flex:0 0 auto;font-size:20px;color:var(--paper-line);color:#B9AE86;}
  .fam-block{background:var(--surface);}
  .fam-block + .fam-block{border-top:1px solid var(--paper-line);}
  .fam-block-body{padding:0 12px 14px;}
  .fam-block .attend-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px;}
  .fam-block .dispatch-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--zebra);padding:8px;border-radius:4px;}
  .small-muted{font-size:11.5px;color:var(--ink-soft);}
  table.hist{width:100%;border-collapse:collapse;font-size:13px;}
  table.hist th,table.hist td{border:1px solid var(--paper-line);padding:6px 8px;}
  table.hist th{background:var(--bar);color:var(--on-bar);}
  .rank-bar{height:6px;border-radius:3px;background:#E4DDBF;overflow:hidden;}
  .rank-bar span{display:block;height:100%;background:var(--field);}


  /* ---------- 配車表プレビュー（画像出力の確認用オーバーレイ） ---------- */
  .preview-overlay{
    position:fixed;inset:0;z-index:400;background:rgba(10,22,32,0.85);
    display:flex;flex-direction:column;
  }
  .preview-bar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
    padding:10px 12px;background:var(--bar);color:var(--on-bar);
  }
  .preview-title{font-weight:700;font-size:14px;}
  .preview-actions{display:flex;gap:8px;}
  .preview-actions .btn.ghost{color:var(--on-bar);border-color:rgba(255,255,255,.5);}
  .preview-body{flex:1 1 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;text-align:center;}
  .preview-body img{max-width:100%;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);}

  .modal-overlay{
    position:fixed;inset:0;z-index:200;
    background:rgba(10,22,32,0.6);
    display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 14px;overflow-y:auto;
  }
  .modal-overlay .card{max-width:640px;width:100%;margin:0;}
  .confirm-overlay{z-index:320;align-items:center;}
  .table-wrap{overflow-x:auto;border-radius:3px;-webkit-overflow-scrolling:touch;}
  .table-wrap .grid-table{min-width:760px;}
  .grid-table td, .grid-table th{white-space:nowrap;}
  .card-head-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .card-head-row h2{margin:0;flex:1 1 auto;min-width:0;}
  .card-head-row h3.setup-section-title{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:17px;font-weight:900;
    margin:0;flex:1 1 auto;min-width:0;
    color:var(--ink);
  }
  .toggle-btn{margin-left:auto;flex:0 0 auto;min-width:64px;text-align:center;}
  .counter-pill{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    padding:5px 12px;border-radius:20px;background:#EFE3C4;color:#7A5A15;border:1px solid #D9C186;
    white-space:nowrap;
  }
  .counter-pill.ok{background:#E1EFE3;color:var(--field-dark);border-color:#BFDAC6;}
  .counter-pill.over{background:#FBECE9;color:#8A2E22;border-color:#E3B6AC;}
  .pref-item{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 10px;border:1px solid var(--paper-line);border-radius:4px;background:var(--surface);margin-bottom:6px;
  }
  .pref-item .lbl{flex:1 1 260px;font-size:13px;}
  .pref-item select{width:auto;min-width:90px;}
  .subtle-toggle{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px;font-weight:700;}
  .help-block{margin-bottom:0;}
  .help-block + .help-block{border-top:1px solid var(--paper-line);}
  .help-block h3{font-family:'Zen Kaku Gothic New', sans-serif;font-size:14.5px;margin:0 0 6px;color:var(--ink);}
  .help-block p, .help-block li{font-size:13px;color:var(--ink-soft);line-height:1.8;}
  .help-block ol, .help-block ul{margin:4px 0 0;padding-left:20px;}
  .help-block-body{padding:2px 14px 14px;}
  .help-toggle-row .list-row-arrow{transition:transform .15s ease;}
  .help-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
  .help-step > div{font-size:13px;color:var(--ink-soft);line-height:1.8;}
  .help-step .num{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--field);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;
  }

  /* ---------- スマートフォン向けレイアウト調整 ---------- */
  @media (max-width:700px){
    .table-wrap{overflow-x:visible;}
    .table-wrap .grid-table{min-width:0;width:100%;}
    .responsive-table thead{display:none;}
    .responsive-table tbody tr{

<body>
<div class="app" id="app"></div>
<script>
/* =========================================================
   NC04 配車表メーカー
   ========================================================= */

const STORAGE_ROSTER_KEY = 'nc04-roster-v2';
const STORAGE_EVENTS_KEY = 'nc04-events-v1';
const STORAGE_EVENTS_TRASH_KEY = 'nc04-events-trash-v1';
const STORAGE_DRAFT_KEY = 'nc04-draft-v1';
const STORAGE_THEME_KEY = 'nc04-theme-v1';
const TRASH_RETENTION_DAYS = 30; // 削除した配車履歴を「ごみ箱」に保持する日数（超過分は自動的に完全削除）
const STAFF_SEED_VERSION = 3; // 役員・指導者・コーチの初期設定を更新した際にインクリメント
const STAFF_ATTEND_DEFAULT_VERSION = 1; // 指導者・コーチの「参加」初期値の仕様を変えた際にインクリメント（既存の下書きにも一度だけ反映するため）
const FAMILY_FIX_VERSION = 1; // 家族データの個別修正（定員など）を行った際にインクリメント

/* =========================================================
   保存先の抽象化
   ・Claude.ai上でアーティファクトとして開いている場合は window.storage を使用
   ・スマートフォンのホーム画面に追加する等、単体のアプリとして開いている場合は
     window.storage が使えないため、ブラウザのlocalStorageに自動でフォールバックする
   　（これにより、どちらの開き方でも「アプリを開くたびに再登録」が不要になる）
   ========================================================= */
const HAS_NATIVE_STORAGE = (typeof window!=='undefined') && !!window.storage && typeof window.storage.get==='function';
async function storageGetSafe(key){
  if (HAS_NATIVE_STORAGE){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ /* 未対応環境や未保存キー → localStorageへ */ }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetSafe(key, value){
  if (HAS_NATIVE_STORAGE){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ /* フォールバックへ */ }
  }
  try{ window.localStorage.setItem(key, value); return true; }
  catch(e){ console.error('保存に失敗しました', e); return false; }
}

let state = {
  families: [],
  staff: [],
  events: [],       // finalized (saved to history)
  draft: null,      // current in-progress event (registration -> assignment)
  activeTab: 'help',
  loaded: false,
  familyEditor: null,  // null | 'new' | index
  staffEditor: null,   // null | 'new' | index
  tempFamily: null,
  tempPlayers: null,
  tempOthers: null,
  tempStaff: null,
  tempCarSwap: null, // ③配車表「車両の入れ替え」：選択中の入替え元／入替え先（一時的な選択状態）
  detailHistoryOpen: false,
  detailHistoryDraft: null,
  historyRankOpen: false,
  historyEventsOpen: false,
  eventsTrash: [], // 削除済みの配車履歴（{id, event, deletedAt}）。30日以内なら復元できる「ごみ箱」
  historyTrashOpen: false,
  trashModalOpen: false, // ごみ箱を別ウィンドウ（モーダル）で表示するかどうか
  helpOpenSections: {},
  theme: 'day', // 'day' | 'night'
  undo: null, // 直前の削除を元に戻すための情報（{array, index, item, label, kind}）
  assignmentUndo: [], // ③配車表専用：配車状態の履歴（最大30段階）
  assignmentRedo: [], // ③配車表専用：アンドゥで戻した内容を「進む」で戻せるようにする履歴（最大30段階）
  confirm: null, // {message, onYes, onNo} 独自の確認ダイアログ（ネイティブconfirm()が一部端末で反応しないため）
  saveChoice: null, // {onOverwrite, onNew} 履歴保存時に上書き／新規保存を選ばせるダイアログ
  famOpen: {}, // ②配車登録：家族ごとの折り畳み表示の開閉状態（surname→bool）
  staffSectionOpen: false, // ②配車登録：指導者・コーチの参加セクションの開閉状態
  registerSectionOpen: false, // ②配車登録全体の開閉状態
  familySetupSectionOpen: false,
  staffSetupSectionOpen: false, // ①初期設定全体の開閉状態
};

/* ---------- seed data (reconstructed from the uploaded 配車表/履歴 sheets + ご指定の乗車定員) ---------- */
function seedFamilies(){
  const mk = (surname, fatherName, motherName, playerNumber, opts) => {
    opts = opts || {};
    return {
      id: `fam_${uid('seed')}`,
      surname,
      capacity: opts.capacity || 5,
      equipmentCapacity: opts.equipmentCapacity || null, // 用具車として使う場合の定員（未指定なら通常定員と同じ）
      father: fatherName ? {name:fatherName, isOfficer: !!opts.fatherOfficer} : null,
      mother: motherName ? {name:motherName, isOfficer: !!opts.motherOfficer} : null,
      players: playerNumber ? [{number:playerNumber, name:''}] : [],
      vehicleRoles: {
        officer: !!opts.officer,
        equipment: !!opts.equipment,
        equipmentOnly: !!opts.equipmentOnly, // trueの場合、用具車としてのみ使用（一般の配車には使わない）
      },
    };
  };
  return [
    mk('内田','内田 恭平','内田 典子','18', {capacity:5}),
    mk('加田','加田 貴丸','加田 玲菜','01', {capacity:4}),
    mk('菊岡','菊岡 耕平','菊岡 鮎子','05', {capacity:5}),
    mk('菊地','菊地 裕','菊地 紗奈美','02', {capacity:5}),
    mk('杉村','杉村 温','杉村 えり','03', {capacity:4}),
    mk('辻','辻 潤一','辻 由美','04', {capacity:4, fatherOfficer:true, officer:true}),
    mk('仲野','仲野 顕','仲野 友紀子','10', {capacity:5}),
    mk('中山','中山 茂久','中山 弘子','07', {capacity:6, fatherOfficer:true, officer:true}),
    mk('西脇','西脇 佑','西脇 文絵','24', {capacity:5, equipment:true, equipmentCapacity:3}),
    mk('本多','本多 雄一','本多 由梨','08', {capacity:5, motherOfficer:true}),
    mk('古田','古田 貴久','古田 佳保理','55', {capacity:5}),
    mk('前川','前川 聖次','前川 雪絵','51', {capacity:2, equipment:true, equipmentCapacity:2, equipmentOnly:true, motherOfficer:true}),
    mk('森','森 圭太郎','森 美貴','22', {capacity:6}),
    mk('鷲尾','鷲尾 光博','鷲尾 のぞみ','20', {capacity:4}),
  ];
}
function seedStaff(){
  return [
    {name:'酒井監督', role:'監督'},
    {name:'今井会長', role:'会長'},
    {name:'中村コーチ', role:'コーチ'},
    {name:'伊東コーチ', role:'コーチ'},
    {name:'西尾コーチ', role:'コーチ'},
    {name:'阿部(と)コーチ', role:'コーチ'},
    {name:'阿部(し)コーチ', role:'コーチ'},
    {name:'杉村 温', role:'サポートコーチ', linkedSurname:'杉村', linkedRole:'father'},
    {name:'菊岡 耕平', role:'サポートコーチ', linkedSurname:'菊岡', linkedRole:'father'},
    {name:'本多 雄一', role:'サポートコーチ', linkedSurname:'本多', linkedRole:'father'},
  ];
}
function isSupportCoach(s){ return s && s.role === 'サポートコーチ'; }

/* ---------- storage helpers ---------- */
async function loadAll(){
  try{
    const rv = await storageGetSafe(STORAGE_ROSTER_KEY);
    if (rv){
      const parsed = JSON.parse(rv);
      state.families = parsed.families || [];
      ensureFamilyIds();
      state.staff = parsed.staff || [];
      state.families.forEach(f=>{
        if (f.equipmentCapacity === undefined) f.equipmentCapacity = null;
        if (!f.vehicleRoles) f.vehicleRoles = {officer:false, equipment:false, equipmentOnly:false};
        if (f.vehicleRoles.equipmentOnly === undefined) f.vehicleRoles.equipmentOnly = false;
        if (!f.others) f.others = []; // 選手以外の家族（兄弟姉妹など・登録のみ）
      });
      state.staff.forEach(s=>{
        if (s.linkedSurname === undefined) s.linkedSurname = null;
        if (s.linkedRole === undefined) s.linkedRole = null;
      });
      const seedVer = parsed.staffSeedVersion || 1;
      if (seedVer < STAFF_SEED_VERSION){
        // 役員・指導者・コーチの初期設定を最新の既定リストに更新
        state.staff = seedStaff();
        await saveRoster();
      }
      const famFixVer = parsed.familyFixVersion || 0;
      if (famFixVer < FAMILY_FIX_VERSION){
        // 家族データの個別修正（定員の誤りなど）を反映
        const kikuoka = state.families.find(f=>f.surname==='菊岡');
        if (kikuoka) kikuoka.capacity = 5;
        await saveRoster();
      }
    } else {
      state.families = seedFamilies();
      ensureFamilyIds();
      state.staff = seedStaff();
      await saveRoster();
    }
  }catch(e){
    state.families = seedFamilies();
    ensureFamilyIds();
    state.staff = seedStaff();
    try{ await saveRoster(); }catch(e2){}
  }
  try{
    const ev = await storageGetSafe(STORAGE_EVENTS_KEY);
    state.events = ev ? JSON.parse(ev) : [];
  }catch(e){
    state.events = [];
  }
  try{
    const tv = await storageGetSafe(STORAGE_EVENTS_TRASH_KEY);
    state.eventsTrash = tv ? JSON.parse(tv) : [];
  }catch(e){
    state.eventsTrash = [];
  }
  // 起動時に、ごみ箱の保持期限（30日）を過ぎた項目を自動的に完全削除する
  if (purgeExpiredTrash()){
    try{ await saveEventsTrash(); }catch(e){}
  }
  try{
    const dv = await storageGetSafe(STORAGE_DRAFT_KEY);
    if (dv){
      const parsedDraft = JSON.parse(dv);
      if (parsedDraft && parsedDraft.attendance){
        state.draft = reconcileDraft(parsedDraft);
        // アプリ起動時は②配車登録の各入力枠を毎回閉じた状態から開始する（入力内容自体は保持）
        state.draft.registerSectionOpen = false;
        state.familySetupSectionOpen = false;
        state.staffSetupSectionOpen = false;
        state.draft.familySectionOpen = false;
        state.draft.extraCarSectionOpen = false;
        state.draft.carCountSectionOpen = false;
        state.draft.prefSectionOpen = false;
        state.draft.staffSectionOpen = false;
        state.famOpen = {};
      }
    }
  }catch(e){ /* 下書きが壊れている場合は無視して新規から始める */ }
  try{
    const tv = await storageGetSafe(STORAGE_THEME_KEY);
    state.theme = (tv === 'night') ? 'night' : 'day';
  }catch(e){ state.theme = 'day'; }
  document.documentElement.setAttribute('data-theme', state.theme);
  state.loaded = true;
}
async function saveRoster(){
  await storageSetSafe(STORAGE_ROSTER_KEY, JSON.stringify({families:state.families, staff:state.staff, staffSeedVersion:STAFF_SEED_VERSION, familyFixVersion:FAMILY_FIX_VERSION}));
}
async function saveEvents(){
  await storageSetSafe(STORAGE_EVENTS_KEY, JSON.stringify(state.events));
}
async function saveEventsTrash(){
  await storageSetSafe(STORAGE_EVENTS_TRASH_KEY, JSON.stringify(state.eventsTrash));
}
/* ごみ箱の中から、削除から30日を超えた項目を取り除く（自動的に完全削除）。
   何か取り除いた場合はtrueを返す（呼び出し側で保存が必要かどうかの判断に使う）。 */
function purgeExpiredTrash(){
  const cutoffMs = Date.now() - TRASH_RETENTION_DAYS * 24 * 60 * 60 * 1000;
  const before = state.eventsTrash.length;
  state.eventsTrash = state.eventsTrash.filter(t=>{
    const t0 = Date.parse(t.deletedAt);
    return !isNaN(t0) && t0 >= cutoffMs;
  });
  return state.eventsTrash.length !== before;
}
/* ごみ箱の項目が、あと何日で自動削除されるか（表示用）。0なら「まもなく削除」扱い。 */
function trashDaysRemaining(deletedAt){
  const t0 = Date.parse(deletedAt);
  if (isNaN(t0)) return 0;
  const elapsedDays = (Date.now() - t0) / (24 * 60 * 60 * 1000);
  return Math.max(0, Math.ceil(TRASH_RETENTION_DAYS - elapsedDays));
}

/* =========================================================
   データの書き出し／取り込み（他端末での利用のため）
   ========================================================= */
function exportAppData(){
  const payload = {
    app: 'NC04-配車表メーカー',
    exportedAt: new Date().toISOString(),
    dataVersion: 1,
    families: state.families,
    staff: state.staff,
    events: state.events,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `nc04-配車データ_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function importAppDataFromText(text){
  let parsed;
  try{
    parsed = JSON.parse(text);
  }catch(e){
    alert('ファイルの読み込みに失敗しました。書き出したJSONファイルを選択してください。');
    return;
  }
  if (!parsed || (!Array.isArray(parsed.families) && !Array.isArray(parsed.events))){
    alert('このファイルはNC04配車表メーカーのデータではないようです。');
    return;
  }
  const famCount = Array.isArray(parsed.families) ? parsed.families.length : 0;
  const staffCount = Array.isArray(parsed.staff) ? parsed.staff.length : 0;
  const eventCount = Array.isArray(parsed.events) ? parsed.events.length : 0;
  askConfirm(
    `【取り込みの確認】\n` +
    `このファイルには 家族${famCount}件／指導者${staffCount}件／配車履歴${eventCount}件 のデータが含まれています。\n\n` +
    `取り込むと、この端末に現在保存されている家族・指導者の名簿と配車履歴は、このファイルの内容に上書きされます。この操作は取り消せません。\n\n` +
    `よろしいですか？`,
    ()=>{
      if (Array.isArray(parsed.families)) { state.families = parsed.families; ensureFamilyIds(); }
      if (Array.isArray(parsed.staff)) state.staff = parsed.staff;
      if (Array.isArray(parsed.events)) state.events = parsed.events;
      state.families.forEach(f=>{
        if (f.equipmentCapacity === undefined) f.equipmentCapacity = null;
        if (!f.vehicleRoles) f.vehicleRoles = {officer:false, equipment:false, equipmentOnly:false};
        if (f.vehicleRoles.equipmentOnly === undefined) f.vehicleRoles.equipmentOnly = false;
        if (!f.others) f.others = []; // 選手以外の家族（兄弟姉妹など・登録のみ）
      });
      state.staff.forEach(s=>{
        if (s.linkedSurname === undefined) s.linkedSurname = null;
        if (s.linkedRole === undefined) s.linkedRole = null;
      });
      Promise.all([saveRoster(), saveEvents()]).then(()=>{
        // 取り込み後も①初期設定の各欄は閉じた状態のままにする
        state.familySetupSectionOpen = false;
        state.staffSetupSectionOpen = false;
        alert('データを取り込みました。');
        render();
      });
    }
  );
}

/* 入力途中の配車登録（下書き）を自動保存する。連続入力中に何度も保存しないよう、
   少し間を置いてからまとめて保存する（デバウンス）。これにより、アプリを閉じてしまっても
   途中まで入力した内容が失われず、再登録の手間を減らせる */
let autoSaveTimer = null;
/* 一部のスマートフォン（特にiOS/Androidの number入力・select選択）では、
   change/input イベントの処理中に画面全体を同期的に再描画（DOM差し替え）すると、
   ・数値入力で同じ文字が二重に入力されてしまう（例：7 → 77）
   ・select（運転手選択など）のドロップダウンを閉じるのに2回タップが必要になる
   といった不具合が発生することがある。これは、キーボードやネイティブの選択UIが
   閉じる処理を終える前に、その入力欄自体がDOMごと作り直されてしまうことが原因。
   これを避けるため、こうした操作の直後の再描画は setTimeout で1テック遅らせる。 */
function deferredRender(){
  setTimeout(render, 0);
}

/* ---------- ③配車表のアンドゥ ----------
   自動配車のやり直し・条件緩和による再作成・手動の乗車先変更で、
   直前の配車状態を最大30段階保存する。下書きそのものを破棄せず、
   配車表だけを安全に1つ前へ戻せるようにする。 */
function cloneAssignmentState(result, relaxedRules, targetCarCount, manualEditsPending, carSwaps){
  return {
    result: result ? JSON.parse(JSON.stringify(result)) : null,
    relaxedRules: JSON.parse(JSON.stringify(relaxedRules || {})),
    // 車両統合（運転手1人だけの車の統合）でtargetCarCountも変化するため、
    // アンドゥで完全に元へ戻せるよう台数のスナップショットも保持する。
    targetCarCount: targetCarCount,
    // ③での手動修正の有無（②から再作成する際の確認表示の判定に使う）も、
    // アンドゥで一緒に元へ戻せるようスナップショットに含める。
    manualEditsPending: !!manualEditsPending,
    // 「車両の入れ替え」設定も、絶対条件の緩和と同様にアンドゥ／リドゥで一緒に戻せるようにする。
    carSwaps: JSON.parse(JSON.stringify(carSwaps || [])),
  };
}
function pushAssignmentUndo(label){
  const d = state.draft;
  if (!d || !d.result) return;
  state.assignmentUndo = state.assignmentUndo || [];
  state.assignmentUndo.push({label: label || '配車変更', ...cloneAssignmentState(d.result, d.relaxedRules, d.targetCarCount, d.manualAssignmentEditsPending, d.carSwaps)});
  if (state.assignmentUndo.length > 30) state.assignmentUndo.shift();
  // 新しい変更を加えるので、それより前に「進む」で戻せた未来の履歴は無効になる。
  state.assignmentRedo = [];
}
function undoAssignment(){
  const d = state.draft;
  const stack = state.assignmentUndo || [];
  if (!d || !stack.length){
    alert('戻せる配車変更がありません。');
    return;
  }
  // 今の状態を「進む」用に保存してから、1つ前の状態に戻す。
  state.assignmentRedo = state.assignmentRedo || [];
  state.assignmentRedo.push({label: '配車変更', ...cloneAssignmentState(d.result, d.relaxedRules, d.targetCarCount, d.manualAssignmentEditsPending, d.carSwaps)});
  if (state.assignmentRedo.length > 30) state.assignmentRedo.shift();
  const prev = stack.pop();
  d.result = prev.result ? JSON.parse(JSON.stringify(prev.result)) : null;
  d.relaxedRules = JSON.parse(JSON.stringify(prev.relaxedRules || {}));
  if (prev.targetCarCount !== undefined) d.targetCarCount = prev.targetCarCount;
  d.manualAssignmentEditsPending = !!prev.manualEditsPending;
  d.carSwaps = JSON.parse(JSON.stringify(prev.carSwaps || []));
  if (d.result){
    d.result.relaxedRules = {...d.relaxedRules};
    d.result.relaxOptions = getRelaxOptions();
    recomputeWarnings(d.result, state.families, d.relaxedRules);
  }
  scheduleDraftAutoSave();
  render();
}
function redoAssignment(){
  const d = state.draft;
  const stack = state.assignmentRedo || [];
  if (!d || !stack.length){
    alert('進める配車変更がありません。');
    return;
  }
  // 今の状態を「戻す」用に保存してから、アンドゥで戻す前の状態へ進む。
  state.assignmentUndo = state.assignmentUndo || [];
  state.assignmentUndo.push({label: '配車変更', ...cloneAssignmentState(d.result, d.relaxedRules, d.targetCarCount, d.manualAssignmentEditsPending, d.carSwaps)});
  if (state.assignmentUndo.length > 30) state.assignmentUndo.shift();
  const next = stack.pop();
  d.result = next.result ? JSON.parse(JSON.stringify(next.result)) : null;
  d.relaxedRules = JSON.parse(JSON.stringify(next.relaxedRules || {}));
  if (next.targetCarCount !== undefined) d.targetCarCount = next.targetCarCount;
  d.manualAssignmentEditsPending = !!next.manualEditsPending;
  d.carSwaps = JSON.parse(JSON.stringify(next.carSwaps || []));
  if (d.result){
    d.result.relaxedRules = {...d.relaxedRules};
    d.result.relaxOptions = getRelaxOptions();
    recomputeWarnings(d.result, state.families, d.relaxedRules);
  }
  scheduleDraftAutoSave();
  render();
}

function scheduleDraftAutoSave(){
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=>{
    autoSaveTimer = null;
    storageSetSafe(STORAGE_DRAFT_KEY, state.draft ? JSON.stringify(state.draft) : '').catch(()=>{});
  }, 500);
}
/* 家族・スタッフ名簿が編集された後に下書きを復元した場合でも画面が壊れないよう、
   最新の名簿に合わせて不足分を補う */
function reconcileDraft(d){
  if (!d) return d;
  ensureFamilyIds();
  d.attendance = d.attendance || {};
  state.families.forEach(f=>{
    const fid = familyIdentity(f);
    if (!d.attendance[fid] && d.attendance[fid]) d.attendance[fid] = d.attendance[fid];
    if (!d.attendance[fid]){
      const players = {};
      (f.players||[]).forEach((p,i)=>{ players['p'+i] = false; });
      const others = {};
      (f.others||[]).forEach((o,i)=>{ others['o'+i] = false; });
      d.attendance[fid] = {father: false, mother: false, players, others, canDispatch:false, driver:null, localArrival:false, pickupByOther:false, absentAll:false, absentSnapshot:null};
    } else {
      (f.players||[]).forEach((p,i)=>{
        const k = 'p'+i;
        if (d.attendance[fid].players[k] === undefined) d.attendance[fid].players[k] = false;
      });
      if (!d.attendance[fid].others) d.attendance[fid].others = {};
      (f.others||[]).forEach((o,i)=>{
        const k = 'o'+i;
        if (d.attendance[fid].others[k] === undefined) d.attendance[fid].others[k] = false;
      });
      if (d.attendance[fid].absentAll === undefined) d.attendance[fid].absentAll = false;
      if (d.attendance[fid].absentSnapshot === undefined) d.attendance[fid].absentSnapshot = null;
      if (d.attendance[fid].pickupByOther === undefined) d.attendance[fid].pickupByOther = false; // 他家族の送迎（配車不要）
    }
  });
  // 指導者・コーチの参加設定。今回「現地集合・解散（localArrival）」を追加したため、
  // この項目を持たない古い下書きを読み込んでもエラーにならないよう既定値を補完する。
  if (!d.staffAttendance) d.staffAttendance = {};
  state.staff.forEach(s=>{
    if (!d.staffAttendance[s.name]){
      d.staffAttendance[s.name] = {attend:false, rideOfficerCar: !isSupportCoach(s), localArrival:false, pickupByOther:false};
      return;
    }
    const sa = d.staffAttendance[s.name];
    if (sa.rideOfficerCar === undefined) sa.rideOfficerCar = !isSupportCoach(s);
    if (sa.localArrival === undefined) sa.localArrival = false; // 旧データ＝現地集合ではない
    // 「役員・指導者車に乗車」と「現地集合・解散」は排他。万一両方立っていたら乗車側を優先解除する。
    if (sa.localArrival && sa.rideOfficerCar) sa.rideOfficerCar = false;
    if (!sa.attend) sa.localArrival = false;
    // 送迎あり（保護者の車などで集合場所まで送ってもらう＝この方の車の留め置きは不要）。
    // 「チーム車に乗車」の場合にのみ意味を持つ項目なので、それ以外では常に既定値へ戻す。
    if (sa.pickupByOther === undefined) sa.pickupByOther = false;
    if (!(sa.attend && sa.rideOfficerCar && !sa.localArrival)) sa.pickupByOther = false;
  });
  if (!d.extraCars) d.extraCars = [];
  // 過去のバグ（②STEP3「担当家庭」欄の選択値が、本来のfamilyIdではなく
  // familySurnameフィールドに誤って保存されていた）で保存された下書きを、
  // 読み込み時に自動修正する。familySurnameの値が実在する家庭のIDと一致する
  // 場合は、本来のfamilyId側へ移し替える。
  d.extraCars.forEach(ec=>{
    if (!ec.familyId && ec.familySurname){
      const fam = state.families.find(f=>f.id===ec.familySurname);
      if (fam){ ec.familyId = fam.id; ec.familySurname = null; }
    }
  });
  if (!d.preferences) d.preferences = makeDefaultDraft().preferences;
  // 「この配慮設定を使う」チェックボックスを廃止し、開閉ボタンだけで表示を切り替える方式に統一
  d.preferences.enabled = true;
  if (d.registerSectionOpen === undefined) d.registerSectionOpen = true;
  if (d.extraCarCompleted === undefined) d.extraCarCompleted = false;
  if (d.staffSectionOpen === undefined) d.staffSectionOpen = false;
  if (d.staffRegistrationCompleted === undefined) d.staffRegistrationCompleted = false;
  if (d.carCountCompleted === undefined) d.carCountCompleted = false;
  if (d.editingEventId === undefined) d.editingEventId = null;
  if (!Array.isArray(d.carSwaps)) d.carSwaps = [];
  if (d.carSwapPanelOpen === undefined) d.carSwapPanelOpen = false;
  if (d.staffAttendDefaultVersion !== STAFF_ATTEND_DEFAULT_VERSION){
    // 「指導者・コーチの参加」初期値をチェック無しに変更したため、既存の下書きにも一度だけ反映する
    // （サポートコーチは元々チェック無しが初期値のため対象外）
    state.staff.forEach(s=>{
      if (!isSupportCoach(s) && d.staffAttendance[s.name]){
        d.staffAttendance[s.name].attend = false;
        // 参加が未チェックに戻るため、乗車区分（現地集合・解散）も既定に戻す
        d.staffAttendance[s.name].localArrival = false;
        d.staffAttendance[s.name].rideOfficerCar = true;
      }
    });
    d.staffAttendDefaultVersion = STAFF_ATTEND_DEFAULT_VERSION;
  }
  return d;
}

/* ---------- 削除のアンドゥ（元に戻す） ----------
   初期設定（家族・指導者コーチ）や履歴などの削除は確認ダイアログを出しているが、
   誤って削除してしまった場合に備えて、直前の1件だけ元に戻せるようにする。
   kind: 'roster'（家族・指導者コーチ＝保存が必要）/ 'events'（履歴＝保存が必要）
         / 'none'（配車登録の下書き内など＝クリック後の自動保存に任せてよい） */
function pushUndo(array, index, item, label, kind){
  state.undo = {array, index, item, label, kind: kind || 'none'};
}
/* 一部のスマホのブラウザ（アプリ内ブラウザ等）ではネイティブの confirm() が
   反応しない・即座にキャンセル扱いになることがあるため、画面内に確認ダイアログを
   表示する独自の仕組みに置き換えている。 */
function askConfirm(message, onYes, onNo){
  state.confirm = {message, onYes: onYes||null, onNo: onNo||null};
  render();
}
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function ensureFamilyIds(){
  const seen = new Set();
  state.families.forEach(f=>{
    if (!f.id || seen.has(f.id)) f.id = uid('fam');
    seen.add(f.id);
  });
}
function familyById(id){ return state.families.find(f=>f.id===id); }
function familyBySurname(sn){ return state.families.find(f=>f.id===sn || f.surname===sn); }
function familyIdentity(f){ return f && f.id ? f.id : f.surname; }
function attendanceFor(attendance, f){
  if (!attendance || !f) return null;
  const id = familyIdentity(f);
  if (!attendance[id] && attendance[f.surname]) attendance[id] = attendance[f.surname];
  return attendance[id];
}
/* 過去実績の詳細入力（運転手・同乗者選択）で使う、全員（保護者・選手）のリスト */
function allPeopleList(){
  const list = [];
  state.families.forEach(f=>{
    if (f.father) list.push({key:`${familyIdentity(f)}|father`, label:`${f.surname}（父・${f.father.name}）`, surname:f.surname, kind:'parent', gender:'father'});
    if (f.mother) list.push({key:`${familyIdentity(f)}|mother`, label:`${f.surname}（母・${f.mother.name}）`, surname:f.surname, kind:'parent', gender:'mother'});
    (f.players||[]).forEach((p,idx)=>{
      list.push({key:`${familyIdentity(f)}|player|${idx}`, label:`${p.number||''} ${f.surname}選手${p.name?('（'+p.name+'）'):''}`.replace(/\s+/g,' ').trim(), surname:f.surname, kind:'player', playerIdx:idx});
    });
  });
  return list;
}
/* 座席の表示名：名前だけを表示する（旧バージョンで保存された履歴に残る「（父）／（母）／（コーチ）」等の続柄・役割表記は表示時に取り除く） */
function seatDisplayName(seat){
  if (!seat) return '';
  if (seat.kind==='staff' && seat.personName) return seat.personName;
  return String(seat.label==null?'':seat.label).replace(/（(父|母|監督|会長|指導者|コーチ|サポートコーチ)）\s*$/,'');
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =========================================================
   配車の自動割り振りロジック（簡易版）
   優先順位：
   0.【絶対条件・第一優先】保護者（運転手を含む）が1名だけ、
     または選手が1名だけの車を作らない（0名か2名以上のどちらかにする）。
     役員・指導者車は対象外（総務・指導者・コーチのみが乗る特別枠のため）。
     配慮設定（優先順位1〜3位）よりも常にこちらが優先される。座席の移動だけで
     解消できない場合は、違反した状態のまま配車するのではなく、対象者を
     「未配置」に回す（運転手1名だけになる車は、その車自体を配車から外し、
     同乗予定だった選手・保護者を未配置にする）。
   1. 役員・指導者車＝総務担当の車両のみ／乗車できるのは総務・指導者・コーチのみ
      （ただし、実際に総務担当者がその車に乗ることまでは必須条件ではない。
      　乗せられる人がいなければ運転手だけで配車してよい）
   2. 用具車＝指定家庭の車両のみ
   2.5 用具車は保護者2名（運転手＋もう1名の保護者）での利用を優先し、
       「保護者1名・選手1名」の組み合わせにはできる限りしない
       （空きが用具車にしかない場合を除く）
   3. 夫婦は同乗、選手は自分の親の車を優先（「親子も可能な限り同じ車に」を
      有効にした場合、選手は自分の親（保護者）が既に乗っている車を優先する）
   4. 保護者はできる限り同性でまとまる
   5. 選手はできる限り集約
   ========================================================= */
function computeHistoryCounts(){
  const counts = {};
  state.events.forEach(ev=>{
    (ev.result && ev.result.cars || []).forEach(car=>{
      counts[car.familySurname] = (counts[car.familySurname]||0) + 1;
    });
  });
  return counts;
}

/* 選手の同乗履歴（誰と誰が過去に同じ車に乗ったか）を集計する。
   「過去の実績」に詳細入力（運転手・同乗者まで記録）で保存されたデータ、
   および通常の配車登録から確定した履歴データが対象。
   これを基に、選手が毎回同じ顔ぶれで同乗しないよう自動配車時の参考にする。 */
function playerSeatKey(seat){
  return `${seat.surname}#${seat.playerIdx!=null ? seat.playerIdx : seat.label}`;
}
function computePlayerCoRideCounts(){
  const counts = {};
  function bump(a,b){
    if (!counts[a]) counts[a] = {};
    counts[a][b] = (counts[a][b]||0) + 1;
  }
  state.events.forEach(ev=>{
    (ev.result && ev.result.cars || []).forEach(car=>{
      const players = (car.seats||[]).filter(s=>s.kind==='player' && s.surname);
      for (let i=0;i<players.length;i++){
        for (let j=0;j<players.length;j++){
          if (i===j) continue;
          bump(playerSeatKey(players[i]), playerSeatKey(players[j]));
        }
      }
    });
  });
  return counts;
}

/* =========================================================
   現在の実際の配車台数（＝配車される家庭の数）を数える
   ・「配車可能」にチェック済みの家庭＝1家庭1台
   ・役員・指導者車／用具車で「特定の家庭」を明示的に指定した場合、
     その家庭がまだチェックされていなければ+1台（新たにその家庭が
     使われるため）。すでにチェック済みの家庭を指定した場合は、
     その家庭の車が役員車／用具車として使われるだけなので加算しない
     （＝チェック数と役員・用具車の指定が二重にカウントされないようにする）
   ========================================================= */
function computeCurrentCarTotal(d){
  const checkedSurnames = new Set(state.families.filter(f=>{
    const a = attendanceFor(d.attendance, f);
    return a && a.canDispatch && a.driver;
  }).map(f=>familyIdentity(f)));
  let extraAddition = 0;
  new Set(d.extraCars.map(ec=>{
    const ref = ec.familyId || ec.familySurname;
    if (!ref) return null;
    const fam = familyBySurname(ref);
    return fam ? familyIdentity(fam) : ref;
  }).filter(Boolean)).forEach(sn=>{
    if (!checkedSurnames.has(sn)) extraAddition++;
  });
  return checkedSurnames.size + extraAddition;
}

/* =========================================================
   指定台数に応じた家庭の自動選択（輪番）
   ・履歴（配車回数）が少ない家庭から優先的に選ぶ
   ・すでに手動でチェック済みの家庭、役員・指導者車／用具車として
     明示的に指定済みの家庭には手を加えない（不足分だけを補う）
   ========================================================= */
function autoSelectDispatchHouseholds(d){
  const target = parseInt(d.targetCarCount, 10);
  if (!target || target <= 0) return {applicable:false, filled:0, shortfall:0};

  const historyCounts = computeHistoryCounts();
  const explicitSurnames = new Set(d.extraCars.map(ec=>ec.familyId || ec.familySurname).filter(Boolean));
  const checkedSurnames = new Set(state.families.filter(f=>{
    const a = attendanceFor(d.attendance, f);
    return a && a.canDispatch && a.driver;
  }).map(f=>familyIdentity(f)));

  const needed = target - computeCurrentCarTotal(d);
  if (needed <= 0) return {applicable:true, filled:0, shortfall:0};

  const candidates = state.families.filter(f=>{
    if (checkedSurnames.has(familyIdentity(f))) return false;
    if (explicitSurnames.has(familyIdentity(f))) return false;
    const a = attendanceFor(d.attendance, f);
    if (!a || a.localArrival) return false;
    if (f.vehicleRoles && f.vehicleRoles.equipmentOnly) return false;
    const fatherOk = f.father && a.father;
    const motherOk = f.mother && a.mother;
    return fatherOk || motherOk;
  });
  candidates.sort((x,y)=>{
    const cx = historyCounts[familyIdentity(x)]||0, cy = historyCounts[familyIdentity(y)]||0;
    if (cx!==cy) return cx-cy; // 配車回数が少ない家庭を優先（輪番）
    return x.surname.localeCompare(y.surname, 'ja');
  });

  const picks = candidates.slice(0, needed);
  picks.forEach(f=>{
    const a = attendanceFor(d.attendance, f);
    a.canDispatch = true;
    a.driver = (f.father && a.father) ? 'father' : ((f.mother && a.mother) ? 'mother' : null);
  });

  return {applicable:true, filled:picks.length, shortfall:needed-picks.length};
}


/* =========================================================
   【絶対条件・第一優先】保護者（運転手含む）が1名だけ、選手が1名だけの
   車両が出ないよう、座席の移動だけで可能な限り解消する。
   ・車両（家庭）そのものは動かさない。あくまで「乗る人」を車両間で調整する。
   ・保護者が1名（＝運転手のみ）の車には、他の車から保護者を1名迎え入れる。
   ・選手が1名の車は、他の選手がいる車、または空いている車へ移す。
   ・席が足りない場合は、選手を別の車へ動かして席を空けてから保護者を迎え入れる。
   ・全体の人数バランス上どうしても解消できないケースのみ、呼び出し元で警告を出す。
   ========================================================= */
/* =========================================================
   前川号・西脇号 用具車専用ルール（共通ヘルパー）
   ・前川号：用具車として使う場合、運転手（前川父）1名だけでも正常。選手は絶対に乗せない。
   ・西脇号：用具車として使う場合、通常の絶対条件（保護者2名以上／選手0名 or 2名以上）は
            そのまま維持しつつ、保護者を優先配置し、選手は極力自動配置しない。
   assignCars() の自動配置・repairLoneOccupants() の補正・hardRuleViolations() /
   recomputeWarnings() の絶対条件チェックの各所から共通で参照する。
   ========================================================= */
/* =========================================================
   役員・指導者車を「今回のイベントで実際に役員・指導者車として使うか」の判定
   ---------------------------------------------------------
   ①初期設定の車両属性（辻号・中山号＝役員・指導者車）は一切変更しない。
   あくまで②配車登録の今回の参加状況だけを見て、その回に限り
   「役員・指導者車」として使うのか「選手・保護者号（一般車）」として
   使うのかを自動判定する。

   判定基準：
   ・今回、指導者・コーチ（監督・会長・コーチ・同乗指定のサポートコーチ）のうち
     1名でも「参加する＋役員・指導者車に乗車」になっていれば、役員・指導者車が必要。
   ・全員が「参加しない」または「参加する＋現地集合・解散」であれば、
     役員・指導者車として使う必要はない
     → 辻号・中山号はその回だけ「選手・保護者号（一般車）」として扱う
     → 総務担当者（前川母・本多母など）の乗車必須条件も適用しない
   ・総務担当の保護者（役員フラグ付きの父母）は、それだけでは役員・指導者車の
     必要性を発生させない（乗せる先の車が一般車になったら、通常の保護者として配車する）。
   ========================================================= */
function countOfficerCarRiders(staffList, staffAttendance){
  staffAttendance = staffAttendance || {};
  return (staffList||[]).filter(s=>{
    const sa = staffAttendance[s.name];
    return !!(sa && sa.attend && sa.rideOfficerCar && !sa.localArrival);
  }).length;
}
function isOfficerCarActive(staffList, staffAttendance){
  return countOfficerCarRiders(staffList, staffAttendance) > 0;
}
/* 今回「現地集合・解散」を選んだ指導者・コーチの名前一覧（配車表の表示用） */
function localArrivalStaffNames(staffList, staffAttendance){
  staffAttendance = staffAttendance || {};
  return (staffList||[]).filter(s=>{
    const sa = staffAttendance[s.name];
    return !!(sa && sa.attend && sa.localArrival);
  }).map(s=>s.name);
}
/* その車が「初期設定では役員・指導者車だが、今回は一般車として使用されている」かどうか */
function isDemotedOfficerCar(car){
  return !!car && car.baseType==='officer' && car.type!=='officer';
}

function isMaekawaEquipmentCar(car){
  return !!car && car.type==='equipment' && car.familySurname==='前川';
}
function isNishiwakiEquipmentCar(car){
  return !!car && car.type==='equipment' && car.familySurname==='西脇';
}

function repairLoneOccupants(allSeatCars, relaxedRules={}){
  function seatsLeft(car){ return car.capacity - car.seats.length; }
  function parentSeatsOf(car){ return car.seats.filter(s=>s.kind==='driver'||s.kind==='parent'); }
  function playerSeatsOf(car){ return car.seats.filter(s=>s.kind==='player'); }
  // ▼前川号・西脇号 用具車専用ルール：選手の移動先として選ばれないようにする。
  // 前川号は常に対象外。西脇号は、絶対条件（保護者2名以上／選手0名 or 2名以上）が
  // ユーザーにより明示的に緩和されていない通常状態でのみ対象外とする。
  function isPlayerMoveTarget(car){
    if (isMaekawaEquipmentCar(car)) return false;
    if (isNishiwakiEquipmentCar(car) && !relaxedRules.parentMin2 && !relaxedRules.playerMin2) return false;
    return true;
  }
  // ▲前川号・西脇号 用具車専用ルール

  let changed = true, guard = 0;
  while (changed && guard < 60){
    changed = false; guard++;

    // 選手が1名だけの車 → 他の選手がいる車（無ければ空きのある車）へ移す
    allSeatCars.forEach(car=>{
      const ps = playerSeatsOf(car);
      if (ps.length !== 1) return;
      const seat = ps[0];
      let target = allSeatCars.find(c=>c!==car && playerSeatsOf(c).length>=1 && seatsLeft(c)>0 && isPlayerMoveTarget(c));
      if (!target) target = allSeatCars.find(c=>c!==car && seatsLeft(c)>0 && isPlayerMoveTarget(c));
      if (target){
        car.seats = car.seats.filter(s=>s!==seat);
        target.seats.push(seat);
        changed = true;
      }
    });

    // 保護者（運転手含む）が1名だけの車 → 他の車から保護者を1名迎え入れる
    allSeatCars.forEach(car=>{
      const parents = parentSeatsOf(car);
      if (parents.length !== 1) return;
      // ▼前川号 用具車専用ルール：前川父1名（運転手のみ）は正常な状態なので、
      // 他車から保護者を無理に迎え入れて2名にする補正の対象から除外する。
      if (isMaekawaEquipmentCar(car)) return;
      // ▲前川号 用具車専用ルール

      if (seatsLeft(car) <= 0){
        // 満席の場合、選手を1名他の車へ動かして席を空ける
        const ps = playerSeatsOf(car);
        if (ps.length){
          const moveSeat = ps[ps.length-1];
          const target = allSeatCars.find(c=>c!==car && seatsLeft(c)>0 && isPlayerMoveTarget(c));
          if (target){
            car.seats = car.seats.filter(s=>s!==moveSeat);
            target.seats.push(moveSeat);
            changed = true;
          }
        }
        return;
      }
      // 保護者が3名以上いる車から1名分けてもらう（分けた後も2名以上残る）。
      // ただし、その保護者が「同乗中の兄弟姉妹にとって最後の同じ家庭の保護者」
      // である場合は、引き抜くと兄弟姉妹だけが残ってしまうため対象から外す。
      function seatIsSafeToDonate(donorCar, seat){
        const sameSurnameParents = donorCar.seats.filter(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===seat.surname);
        if (sameSurnameParents.length > 1) return true;
        return !donorCar.seats.some(s=>s.kind==='sibling' && s.surname===seat.surname);
      }
      function findDonor(minParents){
        for (const c of allSeatCars){
          if (c===car) continue;
          if (parentSeatsOf(c).length < minParents) continue;
          const seat = c.seats.filter(s=>s.kind==='parent').find(s=>seatIsSafeToDonate(c, s));
          if (seat) return {donorCar:c, seat};
        }
        return null;
      }
      let found = findDonor(3);
      if (!found){
        // やむを得ず、保護者が2名の車から分けてもらう（次のループで解消を試みる）
        found = findDonor(2);
      }
      if (found){
        found.donorCar.seats = found.donorCar.seats.filter(s=>s!==found.seat);
        car.seats.push(found.seat);
        changed = true;
      }
    });
  }
}


/* =========================================================
   配車ロジック v2
   ・「車出し可能」は候補登録であり、制限台数を超えていても登録状態を保持する
   ・配車作成時にだけ、制限台数以内で今回使用する車両を選ぶ
   ・絶対条件を満たせる組み合わせを探索し、成立しない場合は無理に配車しない
   ========================================================= */
function computeHistoryRotationInfo(){
  const info = {};
  state.families.forEach(f=>{ info[familyIdentity(f)] = {count:0, last:-1}; });
  state.events.forEach((ev,idx)=>{
    (ev.result && ev.result.cars || []).forEach(car=>{
      const fam = familyBySurname(car.familyId || car.familySurname);
      const key = fam ? familyIdentity(fam) : (car.familyId || car.familySurname);
      if (!info[key]) info[key] = {count:0,last:-1};
      info[key].count++;
      info[key].last = idx;
    });
  });
  return info;
}

function hardRuleViolations(result, relaxedRules={}){
  const errors = [];
  (result.cars||[]).forEach(car=>{
    const capLimit = car.capacity + (isCapacityOverAllowed(car, relaxedRules) ? 1 : 0);
    if (car.seats.length > capLimit){
      errors.push(`${car.familySurname}号車が定員（${car.capacity}名）を超えています。`);
    }
    if (car.type==='officer'){
      if (!relaxedRules.officerMax4 && car.seats.length > 4) errors.push(`${car.familySurname}号車（役員車）が4名を超えています。`);
      const bad = car.seats.filter(s=>{
        if (s.kind==='driver') return false; // 役員車対象家庭の運転手＝総務担当として扱う
        if (s.kind==='staff') return false;
        if (s.kind==='parent') return !s.isOfficerParent;
        return true; // 選手など
      });
      if (bad.length) errors.push(`${car.familySurname}号車（役員車）に乗車対象外の方が含まれています。役員車には一般の保護者・選手を乗せることはできません。`);
      return;
    }
    const parentCount = car.seats.filter(s=>s.kind==='driver'||s.kind==='parent').length;
    const playerCount = car.seats.filter(s=>s.kind==='player').length;
    // ▼前川号・西脇号 用具車専用ルール
    // 前川号（用具車）は運転手（前川父）1名だけでも正常な配車として扱い、
    // 「保護者2名以上」の対象外とする。ただし選手が乗っていた場合は
    // 定員超過や重複と同様に、常に不正配置として絶対条件違反にする。
    if (isMaekawaEquipmentCar(car)){
      if (playerCount > 0) errors.push(`${car.familySurname}号車（用具車）に選手が配置されています。前川号には選手を乗せられません。`);
    } else {
      if (!relaxedRules.parentMin2 && parentCount < 2) errors.push(`${car.familySurname}号車は保護者が${parentCount}名です。運転手を含め2名以上必要です。`);
      if (!relaxedRules.playerMin2 && playerCount === 1) errors.push(`${car.familySurname}号車は選手が1名だけです。選手は0名または2名以上必要です。`);
    }
    // ▲前川号・西脇号 用具車専用ルール（西脇号は上記の通常判定をそのまま適用）
    // 兄弟姉妹は必ず、自分の家庭の保護者（運転手含む）と同乗している必要がある
    const siblingSurnamesInCar = new Set(car.seats.filter(s=>s.kind==='sibling').map(s=>s.surname));
    siblingSurnamesInCar.forEach(sn=>{
      const hasFamilyParent = car.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===sn);
      if (!hasFamilyParent) errors.push(`${car.familySurname}号車に${sn}家の兄弟姉妹が、保護者の同乗なしで配置されています。兄弟姉妹は必ず保護者と同乗させてください。`);
    });
  });
  if ((result.unassigned||[]).length){
    errors.push(`未配置者が${result.unassigned.length}名います。`);
  }
  errors.push(...findDuplicatePeople(result.cars||[]));
  return errors;
}

function buildCandidateSurnames(d){
  return state.families.filter(f=>{
    const a=attendanceFor(d.attendance, f);
    return !!(a && !a.localArrival && a.canDispatch && a.driver);
  }).map(f=>familyIdentity(f));
}

function getRelaxOptions(){
  return [
    {key:'parentMin2', label:'一般車・用具車の「保護者2名以上」を今回だけ外す', note:'運転手1名だけの車が発生する可能性があります。'},
    {key:'playerMin2', label:'「選手は0名または2名以上」を今回だけ外す', note:'選手1名だけの車を許可します。'},
    {key:'officerMax4', label:'役員車の「4名以下」を今回だけ外す', note:'ただし、車両本来の定員を超えることは許可しません。'},
    {key:'capacityOver', label:'車両定員を1名までオーバーすることを許可する', note:'チェックすると、対象にする車両を選択するウィンドウが開きます。選択した車両だけ、定員より1名多く乗車させることを今回だけ許可します。'}
  ];
}

function relaxedRuleLabels(){
  return {parentMin2:'保護者2名以上',playerMin2:'選手2名以上',officerMax4:'役員車4名以下',capacityOver:'車両定員厳守（1名まで）'};
}

/* 定員1名オーバーの許可は「今回どの車両を対象にするか」を個別に選べるようにする。
   relaxedRules.capacityOver（許可そのものON/OFF）と
   relaxedRules.capacityOverCars（対象車両＝家庭ID、または家庭名字の配列）の両方が揃って初めて
   その車両の定員を1名だけ超えられるようにする。
   ※capacityOverCarsに保存される値は家庭のID（familyId）であり、苗字そのものではない
   （familyBySurname()はID・苗字どちらでも検索できるため、判定処理自体には影響しない）。 */
function isCapacityOverAllowed(car, relaxedRules){
  if (!relaxedRules || !relaxedRules.capacityOver) return false;
  const list = relaxedRules.capacityOverCars;
  return Array.isArray(list) && list.includes(car.familyId || car.familySurname);
}
/* capacityOverCarsに保存されている値（家庭ID、または古い形式の家庭名字）を、
   画面表示用の苗字に変換する。該当する家庭が見つからない場合（削除済みなど）は、
   保存されている値をそのまま表示する。 */
function capacityOverCarLabel(idOrSurname){
  const fam = familyBySurname(idOrSurname);
  return fam ? fam.surname : idOrSurname;
}
/* 定員オーバー許可の対象車両選択ウィンドウに表示する候補一覧。
   すでに配車結果があればその車両一覧を、まだなければ車出し候補の家庭一覧を使う。 */
function getCapacityOverCandidates(d){
  const r = d && d.result;
  if (r && r.cars && r.cars.length){
    return r.cars.map(c=>({id:c.familyId || c.familySurname, surname:c.familySurname, type:c.type, capacity:c.capacity, seats:c.seats}));
  }
  const surnames = d ? buildCandidateSurnames(d) : [];
  return surnames.map(sn=>{
    const fam = familyBySurname(sn);
    return {id:fam ? fam.id : sn, surname:fam ? fam.surname : sn, type:null, capacity: fam ? fam.capacity : null};
  });
}
function capacityOverPickerHtml(d){
  const cars = getCapacityOverCandidates(d);
  const selected = new Set((d && d.relaxedRules && d.relaxedRules.capacityOverCars) || []);
  return `
  <div class="modal-overlay">
    <div class="card" style="max-width:480px;">
      <h3 style="margin:0 0 8px;">定員オーバーを許可する車両を選択</h3>
      <p class="desc" style="margin:0 0 12px;">チェックした車両だけ、定員より1名多く乗車させることを許可します。チェックしなかった車両は、これまでどおり定員を厳守します。</p>
      ${cars.length ? cars.map(c=>`
        <label style="display:block;margin:8px 0;cursor:pointer;">
          <input type="checkbox" data-action="toggle-capacity-over-car" data-family-id="${escapeHtml(c.id || c.surname)}" ${selected.has(c.id || c.surname)?'checked':''}>
          <b>${escapeHtml(c.surname)}号車</b>${c.type?`　${escapeHtml(carTypeLabel(c.type, c))}`:''}${c.capacity?`　定員${c.capacity}名`:''}
        </label>`).join('') : `<div class="small-muted">対象にできる車両がまだありません。先に「①初期設定」で車出し可能・運転手設定を行うか、②で自動配車を作成してください。</div>`}
      ${(!selected.size) ? `<div class="small-muted" style="margin-top:8px;color:#8A5A00;">※車両を1台以上選択しないと、定員オーバーは適用されません。</div>` : ''}
      <div class="row-actions" style="justify-content:flex-end;gap:8px;margin-top:14px;">
        <button class="btn small" data-action="close-capacity-over-picker" type="button">閉じる</button>
      </div>
    </div>
  </div>`;
}

function chooseDispatchPlan(d, historyCounts, coRideCounts, relaxedRules={}){

  const limit = parseInt(d.targetCarCount,10);
  const candidateSurnames = buildCandidateSurnames(d);
  const candidateSet = new Set(candidateSurnames);
  const explicit = [...new Set((d.extraCars||[]).map(x=>x.familyId || x.familySurname).filter(Boolean))];
  const errors = [];

  // 車両の入れ替え設定（③配車表「絶対条件の緩和」の下の「車両の入れ替え」で設定したもの）：
  // 入替え元の家庭は今回の候補から除外し、入替え先の家庭は必ず使用する。
  const carSwaps = (d.carSwaps||[]).filter(s=>s && s.outId && s.inId);
  const swapOutSet = new Set(carSwaps.map(s=>s.outId));
  const swapInList = [...new Set(carSwaps.map(s=>s.inId))];

  if (!limit || limit<=0){
    errors.push('「使用上限台数」を入力してください。');
    return {ok:false, errors, candidateSurnames, selectedSurnames:[]};
  }
  explicit.forEach(sn=>{
    if (candidateSet.has(sn)) return; // ②STEP2で既に「配車可能」候補として登録済み
    // 役員・指導者車／用具車としてSTEP3で明示的に指定された家庭は、①初期設定で
    // 既に車両（運転手になれる保護者）が登録されているため、②STEP2の
    // 「配車（車出し）可能」チェックを重ねて入れていなくてもそのまま使用できるようにする。
    // （以前はこのチェックを別途入れないと台数に反映されず、家庭によって
    // 　挙動が安定しないように見える原因になっていた）
    const fam = familyBySurname(sn);
    if (!fam || !(fam.father || fam.mother)){
      errors.push(`${sn}家は役員車／用具車に指定されていますが、運転手となる保護者が登録されていません。`);
    }
  });
  swapInList.forEach(sn=>{
    if (candidateSet.has(sn)) return; // 通常どおり「配車可能」候補として登録済み
    const fam = familyBySurname(sn);
    errors.push(`${fam?fam.surname:sn}家は入替え先の車両に指定されていますが、現在は配車（車出し）可能な候補ではありません。②STEP 2の設定をご確認のうえ、入替え設定をやり直してください。`);
  });
  // 入替え元が、(1)役員・指導者車／用具車としてSTEP3で指定されている家庭、または
  // (2)別の入替えの「入替え先」として指定されている家庭、のいずれかと重複している場合、
  // そちらの指定が優先されて入替えが反映されないため、はっきりエラーとして知らせる。
  const explicitSet = new Set(explicit);
  const swapInSet = new Set(swapInList);
  [...swapOutSet].forEach(id=>{
    const fam = familyBySurname(id);
    const label = fam ? fam.surname : id;
    if (explicitSet.has(id)){
      errors.push(`${label}号車は役員・指導者車／用具車に指定されているため、入替え元にはできません。「車両の入れ替え」の設定を見直してください。`);
    } else if (swapInSet.has(id)){
      errors.push(`${label}号車は、別の入替えの「入替え先」にも指定されています。1つの入替えの入替え先を、別の入替えの入替え元にすることはできません。「車両の入れ替え」の設定を見直してください。`);
    }
  });
  const mandatoryCount = new Set([...explicit, ...swapInList]).size;
  if (mandatoryCount > limit){
    errors.push(`指定済みの役員車・用具車・入替え先の車両だけで${mandatoryCount}台あり、使用上限${limit}台を超えています。`);
  }
  if (errors.length) return {ok:false, errors, candidateSurnames, selectedSurnames:[]};

  const rotation = computeHistoryRotationInfo();
  const mandatory = new Set([...explicit, ...swapInList]);
  const optional = candidateSurnames.filter(sn=>!mandatory.has(sn) && !swapOutSet.has(sn));
  optional.sort((a,b)=>{
    const ia=rotation[a]||{count:0,last:-1}, ib=rotation[b]||{count:0,last:-1};
    if (ia.count!==ib.count) return ia.count-ib.count;
    if (ia.last!==ib.last) return ia.last-ib.last; // 最後に出した時期が古い家庭を優先
    return (familyBySurname(a)?.surname||a).localeCompare(familyBySurname(b)?.surname||b,'ja');
  });

  // 組み合わせ爆発を防ぐため、通常の学年規模では全候補を探索し、
  // 候補が非常に多い場合は輪番上位から最大18家庭に絞る。
  const pool = optional.slice(0, Math.max(0,18-mandatory.size));
  let best = null;
  // 完全成立しない場合でも、最後まで作った「一番ましな配車」を保持する。
  // これを画面から消して全員未配置に戻してしまうと、条件緩和を追加して
  // 再試行するたびに現在の配車が失われるため、再試行可能な状態を維持する。
  let bestFallback = null;
  let bestFallbackScore = Infinity;
  let attempts = 0;
  const mandatoryArr=[...mandatory];

  function combo(arr,k,start=0,prefix=[],out=[]){
    if (out.length>=12000) return out;
    if (k===0){ out.push(prefix.slice()); return out; }
    for(let i=start;i<=arr.length-k;i++){
      prefix.push(arr[i]); combo(arr,k-1,i+1,prefix,out); prefix.pop();
      if (out.length>=12000) break;
    }
    return out;
  }

  // 上限以内で成立する最少台数から試す。無駄な車出しを増やさず、
  // 同じ台数なら輪番（過去回数が少ない・直近使用が古い）を優先する。
  const minCars = Math.max(1, mandatoryArr.length, (d.extraCars||[]).length);
  for(let carCount=minCars; carCount<=limit; carCount++){
    const need=carCount-mandatoryArr.length;
    if (need<0 || need>pool.length) continue;
    const combos = combo(pool,need);
    for(const add of combos){
      attempts++;
      const selected=[...mandatoryArr,...add];
      const trial=assignCars({
        families:state.families, staff:state.staff,
        attendance:d.attendance, staffAttendance:d.staffAttendance,
        extraCars:d.extraCars, historyCounts, preferences:d.preferences, coRideCounts,
        selectedSurnames:selected, trialMode:true, relaxedRules,
      });
      const hard=hardRuleViolations(trial, relaxedRules);
      // 必須（役員車・用具車・車両の入れ替えの「入替え先」）に指定した家庭が、
      // 同乗できる保護者が確保できないなどの理由で、この試行の結果からまるごと
      // 除外されてしまっていないか確認する。hardRuleViolations() は既に配車表
      // から取り除かれた後の car しか見ないため、この除外自体は検出できない。
      // 検出せずに放置すると、「絶対条件は満たしている（違反0件）」ように見える
      // 試行が誤って高評価され、指定した家庭が入っていない配車表が
      // 正常な結果として選ばれてしまう（＝入替え先の車両が入らないまま
      // 総台数だけ減って見える不具合の原因）。
      const resultFamilyIds = new Set(trial.cars.map(c=>c.familyId || c.familySurname));
      const droppedMandatory = mandatoryArr.filter(id=>!resultFamilyIds.has(id));
      if (droppedMandatory.length){
        droppedMandatory.forEach(id=>{
          const fam = familyBySurname(id);
          hard.push(`${fam?fam.surname:id}号車は、同乗できる保護者が確保できず、この配車から除外されました。`);
        });
      }
      // 成立しなかった試行も「部分配車」として保存する候補にする。
      // 評価は「違反数 → 未配置人数 → 未配置の重さ」の順。完全成立した場合は
      // 従来どおり best に入るので、この評価は失敗時だけ使用される。
      const fallbackScore = hard.length * 100000 + (trial.unassigned||[]).length * 1000
        + (trial.warnings||[]).length * 10 + Math.max(0, limit - (trial.cars||[]).length);
      if (!bestFallback || fallbackScore < bestFallbackScore){
        bestFallback = {selectedSurnames:selected.slice(), result:trial, carCount:trial.cars.length, rotationPenalty:fallbackScore, droppedMandatory};
        bestFallbackScore = fallbackScore;
      }
      // 今回のイベントで役員・指導者車を実際に使用しない場合、役員車として指定された
      // 車両は「選手・保護者号（一般車）」として作られるため、officer の期待台数は0になる。
      const officerActiveNow = isOfficerCarActive(state.staff, d.staffAttendance);
      const officerNeed = officerActiveNow ? (d.extraCars||[]).filter(x=>x.type==='officer').length : 0;
      const equipmentNeed=(d.extraCars||[]).filter(x=>x.type==='equipment').length;
      const structuralOk = trial.cars.length===selected.length
        && trial.cars.filter(c=>c.type==='officer').length===officerNeed
        && trial.cars.filter(c=>c.type==='equipment').length===equipmentNeed;
      if (hard.length || !structuralOk) continue;
      const rotationPenalty=selected.reduce((sum,sn)=>{
        const i=rotation[sn]||{count:0,last:-1};
        return sum + i.count*1000 + (i.last+1);
      },0);
      const pv = trial.prefViolations || 0;
      if (!best || carCount<best.carCount || (carCount===best.carCount && (pv<best.pv || (pv===best.pv && rotationPenalty<best.rotationPenalty)))){
        best={selectedSurnames:selected, result:trial, carCount, rotationPenalty, pv};
      }
    }
    if (best) break;
  }

  if (!best){
    const totalCandidates=candidateSurnames.length;
    // 車両の入れ替え「入替え先」や、役員・指導者車／用具車として指定した家庭が
    // 保護者不足で除外されてしまっている場合は、原因がわかるよう具体的に伝える。
    // これを出さないと、指定した家庭が入らないまま「台数が減っただけ」に見え、
    // 入替えが機能していないように誤解されてしまう。
    if (bestFallback && bestFallback.droppedMandatory && bestFallback.droppedMandatory.length){
      bestFallback.droppedMandatory.forEach(id=>{
        const fam = familyBySurname(id);
        const label = fam ? fam.surname : id;
        errors.push(`${label}号車は、車両の入れ替え（入替え先）または役員・指導者車／用具車の指定により必ず使用しますが、運転手以外に同乗できる保護者を確保できず、配車から除外されました。「絶対条件の緩和」で保護者2名以上を今回だけ外すか、入替え先の家庭を見直してください。`);
      });
    }
    errors.push(`使用上限${limit}台の範囲では、絶対条件をすべて満たす配車を作成できません。`);
    if (totalCandidates<limit) errors.push(`車出し可能な候補は${totalCandidates}台です。運転手設定を含めて車出し候補を確認してください。`);
    errors.push('保護者2名以上／選手0名または2名以上／役員車の乗車制限／役員車4名以下／未配置ゼロのいずれかが成立していません。');
    // 失敗しても配車表を空にしない。部分配車を残したまま条件緩和を追加して
    // 何度でも再作成できるようにする。
    const fallbackResult = bestFallback ? bestFallback.result : null;
    if (fallbackResult){
      fallbackResult.relaxedRules = {...relaxedRules};
      fallbackResult.relaxOptions = getRelaxOptions();
      fallbackResult.hardErrors = hardRuleViolations(fallbackResult, relaxedRules);
      fallbackResult.valid = false;
      fallbackResult.selectionSummary = `現在の条件では未成立のため、最も配置人数が多い試行結果を保持しています（${bestFallback.carCount}台）`;
    }
    // 失敗するたびに同じ選択画面を再表示する。
    // 既に緩和した条件はチェック済みのまま保持し、残りを追加で選択できる。
    const relaxOptions = getRelaxOptions();
    return {ok:false, errors, candidateSurnames, selectedSurnames:bestFallback ? bestFallback.selectedSurnames : [], attempts, relaxOptions, result:fallbackResult};
  }
  return {ok:true, ...best, candidateSurnames, attempts};
}

function assignCars({families, staff, attendance, staffAttendance, extraCars, historyCounts, preferences, coRideCounts, selectedSurnames, trialMode, relaxedRules={}}){
  const warnings = [];
  const cars = [];
  let carSeq = 1;
  preferences = preferences || {enabled:false, items:{}};
  coRideCounts = coRideCounts || {};

  function prefWeight(key){
    if (!preferences.enabled) return 0;
    const it = preferences.items[key];
    if (!it || !it.checked) return 0;
    // 優先度を選ばずにチェックだけ入れた場合も、設定が無効にならないよう2位相当で扱う
    if (!it.priority) return 20;
    // 1位が2位・3位を合計しても上回るように差をつけ、優先順位の逆転が
    // 起きないようにする（1位＞2位＋3位の合計、を常に満たす重み）
    return {1:100, 2:20, 3:4}[it.priority] || 0;
  }
  // 配慮条件は常に適用する。画面で優先順位を指定した場合はその設定を使い、
  // 未指定の場合は今回の運用ルール（親子→夫婦→夫婦以外の父母組合せ回避）を既定順位とする。
  const wParentChild = preferences.enabled ? prefWeight('parentChild') : 100;
  const wCouple = preferences.enabled ? prefWeight('couple') : 20;
  const wAvoidMixed = preferences.enabled ? prefWeight('avoidMixedGender') : 4;
  const motherOnlyOk = preferences.enabled ? !!(preferences.items.motherOnlyOk && preferences.items.motherOnlyOk.checked) : true;

  function newCar(type, familyRef, driverRole, capacity){
    const fam = familyBySurname(familyRef);
    const familyId = fam ? fam.id : familyRef;
    const familySurname = fam ? fam.surname : familyRef;
    const car = {id: uid('car'), familyId, type, familySurname, driverRole, capacity, seats:[]};
    const driverName = (driverRole==='father') ? (fam && fam.father?fam.father.name:'') : (fam && fam.mother?fam.mother.name:'');
    car.seats.push({key:`${familyId}-${driverRole}`, label:driverName, kind:'driver', surname:familySurname, familyId, gender:driverRole, personName:driverName});
    cars.push(car);
    return car;
  }
  function seatsLeft(car){ return car.capacity + (isCapacityOverAllowed(car, relaxedRules) ? 1 : 0) - car.seats.length; }

  // サポートコーチ等が家庭の父・母と同一人物として紐づけられており、
  // 今回役員・指導者車に同乗する場合、二重計上を避けるためその家庭の
  // 一般配車（選手・父兄車）の対象からは除外する
  const linkedRideExclusions = new Set(); // "surname|role"
  staff.forEach(s=>{
    if (!s.linkedSurname || !s.linkedRole) return;
    const sa = staffAttendance[s.name];
    if (sa && sa.attend && sa.rideOfficerCar && !sa.localArrival){
      const linkedFam = familyBySurname(s.linkedSurname);
      linkedRideExclusions.add(`${linkedFam ? familyIdentity(linkedFam) : s.linkedSurname}|${s.linkedRole}`);
    }
  });

  const selectedSet = selectedSurnames ? new Set(selectedSurnames) : null;
  // 運転手に指定されている方が、指導者・コーチとして役員・指導者車に同乗する設定になっている場合、
  // その家庭の車は今回使わない（＝集合場所への留め置き）ものとして自動的に扱う。
  const dispatchable = families.filter(f => {
    const a = attendanceFor(attendance, f);
    if (!a || !a.canDispatch || !a.driver) return false;
    if (selectedSet && !selectedSet.has(familyIdentity(f))) return false;
    if (linkedRideExclusions.has(`${familyIdentity(f)}|${a.driver}`)) return false;
    return true;
  });
  const usedSurnames = new Set();

  const officerReqs = extraCars.filter(c=>c.type==='officer');
  const equipReqs = extraCars.filter(c=>c.type==='equipment');

  // ▼今回のイベントで役員・指導者車が本当に必要かどうかを判定する。
  // 「参加する＋役員・指導者車に乗車」の指導者・コーチが1名もいない場合、
  // 初期設定で役員・指導者車（辻号・中山号）に指定されている車両であっても、
  // 今回に限り「選手・保護者号（一般車）」として配車に参加させる。
  const officerCarActive = isOfficerCarActive(staff, staffAttendance);
  // ▲

  function pickCandidate(reqSurname, roleFlag){
    if (reqSurname){
      const reqFam = familyBySurname(reqSurname);
      // usedSurnames は家庭の一意なID（familyIdentity）で管理しているため、
      // ここでの重複チェックも同じ形式（IDに解決した上で）で行う必要がある。
      // reqSurname（入力された苗字の文字列）のままだと、既に役員車・用具車で
      // 使用済みのIDと一致せず、同じ家庭が一般車としても重複して作られてしまう。
      const reqIdentity = reqFam ? familyIdentity(reqFam) : reqSurname;
      if (usedSurnames.has(reqIdentity)) return null;
      if (selectedSet && !selectedSet.has(reqSurname)) return null;
      return reqIdentity;
    }
    const candidates = dispatchable.filter(f=>!usedSurnames.has(familyIdentity(f)) && f.vehicleRoles[roleFlag]);
    if (!candidates.length) return null;
    candidates.sort((a,b)=> (historyCounts[a.surname]||0) - (historyCounts[b.surname]||0));
    return familyIdentity(candidates[0]);
  }

  officerReqs.forEach(req=>{
    const surname = pickCandidate(req.familyId || req.familySurname, 'officer');
    if (!surname){ warnings.push('役員・指導者車の担当家庭が見つかりません（総務担当車両の配車可否をご確認ください）'); return; }
    const fam = familyBySurname(surname);
    if (!fam.vehicleRoles.officer){ warnings.push(`${surname}家は役員・指導者車の対象車両として設定されていません`); }
    const famForReq = familyBySurname(surname);
    const a = famForReq ? attendanceFor(attendance, famForReq) : null;
    const driverRole = req.driver || (a && a.driver) || 'father';
    if (officerCarActive){
      newCar('officer', surname, driverRole, relaxedRules.officerMax4 ? fam.capacity : Math.min(fam.capacity, 4));
    } else {
      // 今回は役員・指導者車として使う必要がないため、一般の選手・保護者号として作成する。
      // ・定員は役員車の4名上限ではなく、車両本来の定員を使う
      // ・総務担当者の乗車必須条件は適用しない（officerParentsの抽出自体を行わない）
      // ・保護者2名以上／選手0名or2名以上など、通常の保護者車のルールが適用される
      // 初期設定（役員・指導者車）自体は書き換えず、baseType としてのみ記録する。
      const demoted = newCar('general', surname, driverRole, fam.capacity);
      demoted.baseType = 'officer';
      demoted.roleOverride = 'general';
      demoted.roleOverrideReason = '今回は役員・指導者車に乗車する指導者・コーチがいないため、一般車として使用';
    }
    // usedSurnames は家庭のID（familyIdentity）で管理する。familyBySurname(surname)で
    // 実体が見つかっている場合はそのID、見つからない場合のみ生の文字列を登録する。
    usedSurnames.add(fam ? familyIdentity(fam) : surname);
  });

  equipReqs.forEach(req=>{
    const surname = pickCandidate(req.familyId || req.familySurname, 'equipment');
    if (!surname){ warnings.push('用具車の担当家庭が見つかりません（前川号・西脇号などをご確認ください）'); return; }
    const fam = familyBySurname(surname);
    if (!fam.vehicleRoles.equipment){ warnings.push(`${surname}家は用具車の対象車両として設定されていません`); }
    const famForReq = familyBySurname(surname);
    const a = famForReq ? attendanceFor(attendance, famForReq) : null;
    const driverRole = req.driver || (a && a.driver) || 'father';
    const cap = fam.equipmentCapacity || fam.capacity;
    newCar('equipment', surname, driverRole, cap);
    // 同上：家庭のID（familyIdentity）で登録し、一般車作成側の判定と一致させる。
    usedSurnames.add(fam ? familyIdentity(fam) : surname);
  });

  dispatchable.forEach(f=>{
    if (usedSurnames.has(familyIdentity(f))) return;
    if (f.vehicleRoles.equipmentOnly) return; // 用具車専用の車両は一般配車には使わない
    newCar('general', f.surname, attendanceFor(attendance, f).driver, f.capacity);
    usedSurnames.add(familyIdentity(f));
  });

  const officerCars = cars.filter(c=>c.type==='officer');
  const equipCars = cars.filter(c=>c.type==='equipment');
  const generalCars = cars.filter(c=>c.type==='general');
  const allSeatCars = [...equipCars, ...generalCars];

  const seatedKeys = new Set(cars.flatMap(c=>c.seats.map(s=>s.key)));

  // 「参加する＋役員・指導者車に乗車」の指導者・コーチのみが役員・指導者車の乗車対象。
  // 「参加する＋現地集合・解散」の指導者・コーチは車に乗らないため、
  // 配車対象からも、役員・指導者車の必要人数からも除外する。
  const staffToPlace = staff.filter(s=>{
    const sa = staffAttendance[s.name];
    return !!(sa && sa.attend && sa.rideOfficerCar && !sa.localArrival);
  }).map(s=>({key:'staff-'+s.name, label:`${s.name}`, kind:'staff', surname:null, personName:s.name}));

  // 総務担当の保護者（前川母・本多母など）を「役員・指導者車に乗せる候補」として抽出する。
  // ▼今回の改修：この抽出は「今回のイベントで実際に役員・指導者車を使用する場合」に限る。
  // 役員・指導者車が今回一般車として開放された場合は、総務担当者の乗車条件そのものを
  // 適用せず、通常の保護者として一般の配車ロジックに参加させる。
  const officerParents = [];
  if (officerCars.length && officerCarActive){
    families.forEach(f=>{
      const a = attendanceFor(attendance, f);
      if (!a || a.localArrival) return;
      if (a.father && f.father && f.father.isOfficer && !seatedKeys.has(`${familyIdentity(f)}-father`) && !linkedRideExclusions.has(`${familyIdentity(f)}|father`)){
        officerParents.push({key:`${familyIdentity(f)}-father`, label:`${f.father.name}`, kind:'parent', gender:'father', surname:f.surname, personName:f.father.name, isOfficerParent:true});
      }
      if (a.mother && f.mother && f.mother.isOfficer && !seatedKeys.has(`${familyIdentity(f)}-mother`) && !linkedRideExclusions.has(`${familyIdentity(f)}|mother`)){
        officerParents.push({key:`${familyIdentity(f)}-mother`, label:`${f.mother.name}`, kind:'parent', gender:'mother', surname:f.surname, personName:f.mother.name, isOfficerParent:true});
      }
    });
  }
  // ▲

  // officerParents は「役員・指導者車に乗せる候補」として一度確定した時点で、
  // 実際にその車に座れたかどうかに関わらず、以降の一般配車の候補（家族データの
  // 再走査）からは除外する必要がある。ここで除外しておかないと、役員・指導者車が
  // 満席で乗り切れなかった場合に「家族データの再走査で拾われる分」と「officerPool
  // の余りとして拾われる分」の二重に同じ人が候補に入ってしまい、配車結果に
  // 重複（例：総務家庭の母が2台の車に登録される）が発生する。
  const officerClaimedKeys = new Set(officerParents.map(p=>p.key));

  let officerPool = [...staffToPlace, ...officerParents];
  officerCars.forEach(car=>{
    while (seatsLeft(car) > 0 && officerPool.length){
      const p = officerPool.shift();
      car.seats.push(p);
      seatedKeys.add(p.key);
    }
  });
  if (officerPool.length && officerCars.length){
    warnings.push(`役員・指導者車が満席のため、${officerPool.map(p=>p.label).join('、')} は他の車に配車されます`);
  } else if (officerPool.length && !officerCars.length){
    warnings.push(`役員・指導者車が用意されていないため、${officerPool.map(p=>p.label).join('、')} は他の車に配車されます`);
  }

  const remainingParents = [];
  const remainingPlayers = [];
  families.forEach(f=>{
    const a = attendanceFor(attendance, f);
    if (!a || a.localArrival) return;
    if (a.father && !seatedKeys.has(`${familyIdentity(f)}-father`) && !officerClaimedKeys.has(`${familyIdentity(f)}-father`) && !linkedRideExclusions.has(`${familyIdentity(f)}|father`)){
      remainingParents.push({key:`${familyIdentity(f)}-father`, label:`${f.father?f.father.name:'(父・未登録)'}`, kind:'parent', gender:'father', surname:f.surname, personName:f.father?f.father.name:null});
    }
    if (a.mother && !seatedKeys.has(`${familyIdentity(f)}-mother`) && !officerClaimedKeys.has(`${familyIdentity(f)}-mother`) && !linkedRideExclusions.has(`${familyIdentity(f)}|mother`)){
      remainingParents.push({key:`${familyIdentity(f)}-mother`, label:`${f.mother?f.mother.name:'(母・未登録)'}`, kind:'parent', gender:'mother', surname:f.surname, personName:f.mother?f.mother.name:null});
    }
    (f.players||[]).forEach((pl,idx)=>{
      const k = 'p'+idx;
      if (a.players && a.players[k] && !seatedKeys.has(`${familyIdentity(f)}-player-${idx}`)){
        remainingPlayers.push({key:`${familyIdentity(f)}-player-${idx}`, label:`${pl.number||''} ${f.surname} ${pl.name||''}`.replace(/\s+/g,' ').trim(), kind:'player', surname:f.surname, playerIdx:idx, number:pl.number||''});
      }
    });
  });
  const unassignedStaff = [];
  officerPool.forEach(p=>unassignedStaff.push(p));

  function idxRemove(arr, pred){
    const out=[];
    for (let i=arr.length-1;i>=0;i--){ if (pred(arr[i])){ out.push(arr[i]); arr.splice(i,1);} }
    return out;
  }

  allSeatCars.forEach(car=>{
    const surname = car.familySurname;
    idxRemove(remainingParents, p=>p.surname===surname).forEach(p=>{
      if (seatsLeft(car)>0){ car.seats.push(p); seatedKeys.add(p.key); }
      else remainingParents.push(p);
    });
    idxRemove(remainingPlayers, p=>p.surname===surname).forEach(p=>{
      if (seatsLeft(car)>0){ car.seats.push(p); seatedKeys.add(p.key); }
      else remainingPlayers.push(p);
    });
  });

  function parentCount(car){ return car.seats.filter(s=>s.kind==='driver'||s.kind==='parent').length; }
  function genderCount(car, gender){ return car.seats.filter(s=>(s.kind==='driver'||s.kind==='parent') && s.gender===gender).length; }
  function hasSurname(car, surname){ return car.seats.some(s=>s.surname===surname); }
  function hasSpouse(car, parent){
    const oppGender = parent.gender==='father' ? 'mother' : 'father';
    return car.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===parent.surname && s.gender===oppGender);
  }
  // 用具車は2名（保護者2名）での利用がほとんどのため、「保護者1名・選手1名」に
  // ならないよう、用具車の2席目にはできる限り選手ではなく保護者を優先して充てる。
  // これは配慮設定（preferences）の有無に関わらず常に働く既定のロジックとする。
  const wEquipmentCompanion = 40;
  const wAvoidEquipmentForPlayer = 18;
  function equipmentNeedsCompanion(car){
    return car.type==='equipment' && parentCount(car) < 2 && seatsLeft(car) > 0;
  }

  // 母のみ車（父が1人も乗っていない車）は、「可とする」設定でも配車バランスを崩さないよう
  // 全体で常に最大1台までに抑える（既に1台あれば、新たに2台目を作ることは強く避ける）
  function isMotherOnlyCar(car){
    return parentCount(car) > 0 && genderCount(car,'father')===0 && genderCount(car,'mother')>0;
  }
  function motherOnlyCarsCount(){
    return allSeatCars.filter(isMotherOnlyCar).length;
  }

  // スコアリングによる保護者の配置（絶対条件：保護者2名以上を最優先、次に配慮設定を反映）
  let guard=0;
  while (remainingParents.length && guard<2000){
    guard++;
    const withSpace = allSeatCars.filter(c=>seatsLeft(c)>0);
    if (!withSpace.length) break;
    const p = remainingParents[0];
    const under2 = withSpace.filter(c=>parentCount(c)<2);
    const pool = under2.length ? under2 : withSpace;
    pool.sort((a,b)=>{
      let sa = 0, sb = 0;
      // 用具車は2名（保護者2名）での利用がほとんどのため、運転手1名だけの
      // 用具車には他の車より優先して保護者を1名迎え入れ、できる限り
      // 「保護者1名・選手1名」ではなく「保護者2名」で埋まるようにする
