      if (equipmentNeedsCompanion(a)) sa += wEquipmentCompanion;
      if (equipmentNeedsCompanion(b)) sb += wEquipmentCompanion;
      if (p.surname){
        if (wCouple && hasSpouse(a,p)) sa += wCouple;
        if (wCouple && hasSpouse(b,p)) sb += wCouple;
        if (wParentChild && hasSurname(a,p.surname)) sa += wParentChild;
        if (wParentChild && hasSurname(b,p.surname)) sb += wParentChild;
      }
      if (p.gender && wAvoidMixed){
        const oppGender = p.gender==='father' ? 'mother' : 'father';
        // 異性の保護者（夫婦以外）が既に乗っていれば減点
        const aMixed = a.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.gender===oppGender && s.surname!==p.surname);
        const bMixed = b.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.gender===oppGender && s.surname!==p.surname);
        if (aMixed) sa -= wAvoidMixed;
        if (bMixed) sb -= wAvoidMixed;
      }
      if (!preferences.enabled || (!wCouple && !wParentChild && !wAvoidMixed)){
        // 配慮設定が無い場合は既定の「同性でまとまる」ヒューリスティックを使用
        if (p.gender){
          sa += genderCount(a, p.gender);
          sb += genderCount(b, p.gender);
        }
      }
      if (p.gender==='mother'){
        // すでに乗っている母のみ車に加わるのはOK。父が0人・母も0人＝この車に
        // 入れると「新たな母のみ車」が生まれてしまう場合は、可とする設定でも
        // 既に母のみ車が1台あれば強く避ける（配車バランスのため常に最大1台まで）
        const aWouldCreateNew = genderCount(a,'father')===0 && genderCount(a,'mother')===0;
        const bWouldCreateNew = genderCount(b,'father')===0 && genderCount(b,'mother')===0;
        if (aWouldCreateNew && motherOnlyCarsCount()>=1) sa -= 1000;
        if (bWouldCreateNew && motherOnlyCarsCount()>=1) sb -= 1000;
        if (!motherOnlyOk){
          // 「避ける」設定の場合は、1台目の母のみ車もできる限り避ける（軽い減点）
          if (genderCount(a,'father')===0) sa -= 20;
          if (genderCount(b,'father')===0) sb -= 20;
        }
      }
      if (sa!==sb) return sb-sa;
      return parentCount(a)-parentCount(b);
    });
    remainingParents.shift();
    pool[0].seats.push(p);
    seatedKeys.add(p.key);
  }

  // 選手以外の家族（兄弟姉妹）の乗車リストを、保護者の配置が確定した直後に作る。
  // ここで選手より先に座席を確保することで、以降の選手の自動配置によって
  // 兄弟姉妹の同乗席が埋まってしまう（＝兄弟姉妹が乗れず、他の選手が乗ってしまう）
  // ことを防ぐ。「保護者1名（運転手のみ）」でこの後除外される可能性がある車には、
  // 除外時に座席ごと消えてしまわないよう、この時点ではまだ入れない。
  const pendingSiblings = [];
  families.forEach(f=>{
    const a = attendanceFor(attendance, f);
    if (!a || a.localArrival) return;
    (f.others||[]).forEach((ot,idx)=>{
      const k = 'o'+idx;
      if (a.others && a.others[k]){
        pendingSiblings.push({
          key:`${familyIdentity(f)}-sibling-${idx}`,
          label: (ot.name||'').trim(),
          kind:'sibling', surname:f.surname,
        });
      }
    });
  });
  function siblingCarIsSafe(car){
    if (isMaekawaEquipmentCar(car)) return true;
    return parentCount(car) >= 2 || !!relaxedRules.parentMin2;
  }
  function trySeatPendingSiblings(){
    const queue = pendingSiblings.splice(0, pendingSiblings.length);
    queue.forEach(sib=>{
      const candidateCars = allSeatCars.filter(c=>
        c.type!=='officer' && siblingCarIsSafe(c) &&
        c.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===sib.surname) &&
        seatsLeft(c) > 0
      );
      if (candidateCars.length){
        candidateCars.sort((a,b)=>seatsLeft(b)-seatsLeft(a));
        candidateCars[0].seats.push(sib);
        seatedKeys.add(sib.key);
      } else {
        pendingSiblings.push(sib);
      }
    });
  }
  trySeatPendingSiblings();

  guard=0;
  while (remainingPlayers.length && guard<2000){
    guard++;
    // ▼前川号・西脇号 用具車専用ルール：選手の自動配置候補から確実に除外する。
    // スコアの減点（wAvoidEquipmentForPlayer）だけでは「他に空きがない場合」に
    // 選手が用具車へ入ってしまう可能性があるため、候補一覧そのものから外す。
    // ・前川号：常に除外（選手は絶対に自動配置しない）
    // ・西脇号：通常の絶対条件（保護者2名以上／選手0名 or 2名以上）が有効な間だけ除外し、
    //   ユーザーが明示的にどちらかを緩和した場合は、既存の条件緩和ロジックに従い
    //   通常の候補として扱う（除外しない）。
    const withSpace = allSeatCars.filter(c=>{
      if (seatsLeft(c) <= 0) return false;
      if (isMaekawaEquipmentCar(c)) return false;
      if (isNishiwakiEquipmentCar(c) && !relaxedRules.parentMin2 && !relaxedRules.playerMin2) return false;
      return true;
    });
    // ▲前川号・西脇号 用具車専用ルール
    if (!withSpace.length) break;
    const p = remainingPlayers[0];
    const pKey = playerSeatKey(p);
    withSpace.sort((a,b)=>{
      let sa = 0, sb = 0;
      // 【親子乗車を優先】選手は、自分の親（保護者）が既に乗っている車を
      // 最優先で選ぶ。これがないと「親子も可能な限り同じ車に」を選択しても
      // 選手の配置に反映されなかったため、判定要素として追加する。
      if (wParentChild && p.surname){
        if (hasSurname(a, p.surname)) sa += wParentChild;
        if (hasSurname(b, p.surname)) sb += wParentChild;
      }
      // 用具車は2名（保護者2名）での利用がほとんどのため、他に空きのある車が
      // あれば選手はできる限り用具車を避け、用具車の座席は保護者2名目のために
      // 空けておく（用具車しか空きがない場合はこの限りではない）
      if (a.type==='equipment') sa -= wAvoidEquipmentForPlayer;
      if (b.type==='equipment') sb -= wAvoidEquipmentForPlayer;
      if (sa!==sb) return sb-sa;
      const ap = a.seats.filter(s=>s.kind==='player').length;
      const bp = b.seats.filter(s=>s.kind==='player').length;
      if (ap!==bp) return bp-ap; // 選手はできる限り集約するのを優先
      // 集約の度合いが同じ場合、過去に同乗回数が少ない組み合わせを優先
      // （保護者側の配慮設定＝preferences.itemsとは独立した既定の配慮のため、
      //   配慮設定の有無に関わらず常に軽いタイブレークとしてのみ働く）
      const scoreOf = (car)=>{
        let s = 0;
        car.seats.filter(s2=>s2.kind==='player').forEach(s2=>{
          s += (coRideCounts[pKey] && coRideCounts[pKey][playerSeatKey(s2)]) || 0;
        });
        return s;
      };
      return scoreOf(a) - scoreOf(b);
    });
    remainingPlayers.shift();
    withSpace[0].seats.push(p);
    seatedKeys.add(p.key);
  }


  // 【配慮設定の最終調整】保護者を1人ずつ順番に置く方式では、後から置く人ほど
  // 選択肢が残らず、また repairLoneOccupants() の補正も配慮設定を見ずに保護者を
  // 動かすため、設定どおりにならなかった。全員の配置が終わった後に、車をまたいだ
  // 保護者の入れ替え／移動を試し、配慮設定の違反が減る場合だけ採用する。
  // 各車の保護者人数は変わらない（移動は2名以上残る場合のみ）ので、絶対条件は崩れない。
  function optimizeParentPlacement(){
    const mixedOn = !!(preferences.items.avoidMixedGender && preferences.items.avoidMixedGender.checked);
    const wM = mixedOn ? (wAvoidMixed || 20) : 0;
    const wO = motherOnlyOk ? 0 : 20;
    const wC = wCouple, wPC = wParentChild;
    if (!wM && !wO && !wC && !wPC) return;
    const isP = s=>s.kind==='driver'||s.kind==='parent';
    const cs = allSeatCars.filter(c=>c.type!=='officer');
    function carCost(c){
      const ps = c.seats.filter(isP);
      let cost = 0;
      if (wM){
        ps.filter(s=>s.gender==='father').forEach(f=>ps.filter(s=>s.gender==='mother').forEach(m=>{ if (f.surname!==m.surname) cost += wM; }));
      }
      if (wO && ps.length && !ps.some(s=>s.gender==='father')) cost += wO;
      if (wC){
        new Set(ps.map(s=>s.surname)).forEach(sn=>{
          if (ps.some(s=>s.surname===sn&&s.gender==='father') && ps.some(s=>s.surname===sn&&s.gender==='mother')) cost -= wC;
        });
      }
      if (wPC) c.seats.filter(s=>s.kind==='player').forEach(pl=>{ if (ps.some(s=>s.surname===pl.surname)) cost -= wPC; });
      return cost;
    }
    function carOk(c){ return c.seats.every(s=>s.kind!=='sibling' || c.seats.some(p=>isP(p)&&p.surname===s.surname)); }
    const movable = c=>c.seats.filter(s=>s.kind==='parent' && !s.isOfficerParent);
    function tryImprove(){
      for (const A of cs) for (const B of cs){
        if (A===B) continue;
        for (const sa of movable(A)){
          // 移動（Aに保護者が2名以上残り、Bに空きがある場合のみ）
          if ((parentCount(A)-1>=2 || relaxedRules.parentMin2) && seatsLeft(B)>0){
            const before = carCost(A)+carCost(B);
            A.seats = A.seats.filter(s=>s!==sa); B.seats.push(sa);
            if (carCost(A)+carCost(B) < before && carOk(A) && carOk(B)) return true;
            B.seats.pop(); A.seats.push(sa);
          }
          for (const sb of movable(B)){
            if (sa.surname===sb.surname && sa.gender===sb.gender) continue;
            const before = carCost(A)+carCost(B);
            const ia = A.seats.indexOf(sa), ib = B.seats.indexOf(sb);
            A.seats[ia] = sb; B.seats[ib] = sa;
            if (carCost(A)+carCost(B) < before && carOk(A) && carOk(B)) return true;
            A.seats[ia] = sa; B.seats[ib] = sb;
          }
        }
      }
      return false;
    }
    let g = 0;
    while (g++ < 200 && tryImprove()){}
    // それでも満たせない配慮が残る場合は、理由がわかるよう配車表の注意書きに出す
    cs.forEach(c=>{
      const ps = c.seats.filter(isP);
      if (wM && ps.some(f=>f.gender==='father' && ps.some(m=>m.gender==='mother' && m.surname!==f.surname))){
        warnings.push(`【配慮設定】${c.familySurname}号車に、夫婦以外の異性の保護者が同乗しています（参加者・車の組合せ上、避けられませんでした）。`);
      }
      if (wO && ps.length && !ps.some(s=>s.gender==='father')){
        warnings.push(`【配慮設定】${c.familySurname}号車が母のみの車になっています（参加者・車の組合せ上、避けられませんでした）。`);
      }
    });
  }

  // 【絶対条件・第一優先】保護者（運転手含む）が1名だけ／選手が1名だけの車が
  // 出ないよう、車両をまたいで座席を調整する（車両そのものは動かさない）
  repairLoneOccupants(allSeatCars, relaxedRules);
  optimizeParentPlacement();

  // 上記の調整だけではどうしても解消できない場合、絶対条件に違反した状態のまま
  // 配車表に載せるのではなく、対象者を「未配置」として扱う（＝乗車が足りない
  // 場合は、無理に配車には入れず、手動で確認・調整できるよう未配置に回す）。
  // ・選手が1名だけ残ってしまった車 → その選手を未配置に回す（車自体はそのまま使う）
  // ▼前川号 用具車専用ルール：前川号には選手を絶対に自動配置しないため、
  // 万一（手動データの持ち越し等で）選手が入っていた場合は「1名だけ」に
  // 関わらず必ず未配置へ戻す（通常のplayerMin2緩和とは無関係に常に適用）。
  allSeatCars.forEach(car=>{
    if (!isMaekawaEquipmentCar(car)) return;
    const misplacedPlayers = car.seats.filter(s=>s.kind==='player');
    if (misplacedPlayers.length){
      car.seats = car.seats.filter(s=>s.kind!=='player');
      remainingPlayers.push(...misplacedPlayers);
      warnings.push(`【前川号・用具車専用ルール】${car.familySurname}号車には選手を乗せられないため、選手を未配置にしました。`);
    }
  });
  // ▲前川号 用具車専用ルール
  allSeatCars.forEach(car=>{
    const lonePlayers = car.seats.filter(s=>s.kind==='player');
    if (lonePlayers.length === 1 && !relaxedRules.playerMin2){
      const seat = lonePlayers[0];
      car.seats = car.seats.filter(s=>s!==seat);
      remainingPlayers.push(seat);
      warnings.push(`【絶対条件】${car.familySurname}号車は選手が1名だけになってしまうため、他に組み合わせる乗車がなく、その選手を未配置にしました。`);
    }
  });
  // ・保護者（運転手含む）が1名だけの車 → 運転手1名だけでは絶対条件を満たせず、
  //   かつ運転手自身を「未配置」にはできない（その車を出せるのはその人だけのため）ので、
  //   この車自体を今回の配車から外す（＝その家庭は今回は配車なしとして扱う）。
  //   同乗するはずだった選手・保護者がいた場合は未配置に回す。
  //   ▼前川号 用具車専用ルール：前川号は運転手（前川父）1名だけでも正常な配車のため、
  //   この「保護者1名だけの車を配車から除外する」処理の対象外とする。これにより
  //   前川号1台だけが絶対条件未成立として配車候補から消えることを防ぐ。
  const excludedCarIds = new Set();
  allSeatCars.forEach(car=>{
    if (isMaekawaEquipmentCar(car)) return;
    if (parentCount(car) === 1 && !relaxedRules.parentMin2){
      car.seats.filter(s=>s.kind==='player').forEach(s=> remainingPlayers.push(s));
      // 除外される車に兄弟姉妹が乗っていた場合、座席ごと消してしまわないよう
      // pendingSiblingsへ戻し、後で改めて配置先を探す。
      car.seats.filter(s=>s.kind==='sibling').forEach(s=>{ seatedKeys.delete(s.key); pendingSiblings.push(s); });
      excludedCarIds.add(car.id);
      // usedSurnames は家庭のID（familyIdentity）で管理しているため、
      // ここも car.familySurname ではなく car.familyId で取り消す。
      usedSurnames.delete(car.familyId);
      warnings.push(`【絶対条件】${car.familySurname}号車は保護者が運転手1名だけになり、他に組み合わせる保護者がいなかったため、この車は今回配車せず、同乗予定だった方は未配置にしました。`);
    }
  });
  // ▲前川号 用具車専用ルール
  if (excludedCarIds.size){
    for (let i=cars.length-1;i>=0;i--){
      if (excludedCarIds.has(cars[i].id)) cars.splice(i,1);
    }
    // allSeatCarsは配列参照が別なので、除外された車をここでも取り除いておく
    // （そのままだと兄弟姉妹の再配置先候補として残り続けてしまうため）。
    for (let i=allSeatCars.length-1;i>=0;i--){
      if (excludedCarIds.has(allSeatCars[i].id)) allSeatCars.splice(i,1);
    }
  }

  // 選手の自動配置・各種補正が終わった後、まだ乗車先が決まっていない兄弟姉妹を
  // 改めて配置する（補正によって保護者2名以上になった車を拾えるようにするため）。
  trySeatPendingSiblings();
  const unassignedSiblings = pendingSiblings;
  if (unassignedSiblings.length){
    warnings.push(`保護者と同乗できる車が見つからなかったため、兄弟姉妹${unassignedSiblings.length}名を未配置にしました（兄弟姉妹は必ず保護者と同乗が必要です）。`);
  }

  const unassigned = [...remainingParents, ...remainingPlayers, ...unassignedSiblings, ...unassignedStaff];

  // 選手は背番号の若い順に並べ替えてから確定する（保存・出力にもこの順序を反映するため）
  cars.forEach(sortCarSeats);

  if (unassigned.length){
    warnings.push(`配車しきれなかった参加者が${unassigned.length}名います。車両を追加するか、下の未配置リストから手動で割り当ててください。`);
  }
  warnings.push(...findDuplicatePeople(cars));

  // 現地集合・解散の家庭（配車不要・直接現地に来る車の台数を把握するため）
  const localArrivalFamilies = families.filter(f=>{
    const a = attendanceFor(attendance, f);
    return a && a.localArrival;
  }).map(f=>f.surname);

  // 参加はするが「配車（車出し）」はしない家庭＝自家用車は集合場所に留め置きとなる家庭
  // （保護者が参加しており、その家庭の車を今回の配車には使わない場合）
  // ただし、他のご家族が集合場所まで送迎してくれる場合（pickupByOther）は、
  // そもそもこの家庭の車が集合場所に来ないため「留め置き」には含めない。
  const heldBackFamilies = families.filter(f=>{
    const a = attendanceFor(attendance, f);
    if (!a || a.localArrival || a.pickupByOther) return false;
    if (!(a.father || a.mother)) return false;
    return !usedSurnames.has(familyIdentity(f));
  }).map(f=>f.surname);

  // 集合場所までの送迎（送り迎え）が必要な家庭＝
  // ・保護者は参加せず選手のみが参加する家庭（自家用車での参加ではない）
  // ・または、保護者・選手が参加するが、他のご家族に集合場所まで送迎してもらう場合
  const transportFamilies = families.filter(f=>{
    const a = attendanceFor(attendance, f);
    if (!a || a.localArrival) return false;
    if (a.pickupByOther) return !!((a.father || a.mother) || (a.players && Object.keys(a.players).some(k=>a.players[k])));
    if (a.father || a.mother) return false;
    return !!(a.players && Object.keys(a.players).some(k=>a.players[k]));
  }).map(f=>f.surname);

  // 今回「現地集合・解散」を選んだ指導者・コーチ（配車表の表示用）
  const localArrivalStaff = localArrivalStaffNames(staff, staffAttendance);

  // 「チーム車に乗車」する指導者・コーチのうち、集合場所まで保護者の車などで
  // 送迎してもらう方（＝この方の車は集合場所に来ないため留め置き不要）と、
  // 送迎がなく自分の車で集合場所まで来て、その車を留め置くことになる方の一覧
  // （配車表・画像出力の表示用）
  const staffPickup = (staff||[]).filter(s=>{
    const sa = staffAttendance[s.name];
    return !!(sa && sa.attend && sa.rideOfficerCar && !sa.localArrival && sa.pickupByOther);
  }).map(s=>s.name);
  const staffHeldBack = (staff||[]).filter(s=>{
    const sa = staffAttendance[s.name];
    return !!(sa && sa.attend && sa.rideOfficerCar && !sa.localArrival && !sa.pickupByOther);
  }).map(s=>s.name);

  const prefViolations = warnings.filter(w=>w.indexOf('【配慮設定】')===0).length;
  return {prefViolations, cars, unassigned, warnings, localArrivalFamilies, heldBackFamilies, transportFamilies,
    officerCarActive, localArrivalStaff, staffPickup, staffHeldBack};
}

/* 同じ人が複数の座席（例：自分の家庭の車と役員・指導者車）に重複して入っていないかチェック */
function findDuplicatePeople(cars){
  // seat.personName は保護者・総務同乗スタッフにしか設定されておらず、選手の重複を
  // 見逃してしまうため、どの座席にも必ず設定される一意な seat.key で判定する
  const counts = {};
  const labels = {};
  cars.forEach(car=>{
    car.seats.forEach(seat=>{
      if (!seat.key) return;
      counts[seat.key] = (counts[seat.key]||0) + 1;
      labels[seat.key] = seat.personName || seat.label || seat.key;
    });
  });
  return Object.keys(counts).filter(k=>counts[k]>1)
    .map(k=>`${labels[k]}さんが複数の車に重複して配車されています。サポートコーチの同乗指定や、選手・保護者の重複がないかご確認ください。`);
}

function recomputeWarnings(result, families, relaxedRules={}){
  const warnings = [];
  const allSeatCars = result.cars.filter(c=>c.type!=='officer');
  allSeatCars.forEach(car=>{
    const pc = car.seats.filter(s=>s.kind==='driver'||s.kind==='parent').length;
    const players=car.seats.filter(s=>s.kind==='player').length;
    // ▼前川号 用具車専用ルール：運転手（前川父）1名だけでも正常な配車として扱い、
    // 「保護者2名以上」の警告は出さない。ただし選手が乗っていた場合は
    // 通常のplayerMin2緩和とは無関係に、常に不正配置として警告する。
    if (isMaekawaEquipmentCar(car)){
      if (players > 0){
        warnings.push(`【前川号・用具車専用ルール】${car.familySurname}号車に選手が配置されています。前川号には選手を乗せられません。`);
      }
    } else {
      if (pc < 2 && !relaxedRules.parentMin2){
        warnings.push(`【絶対条件】${car.familySurname}号車は保護者が${pc}名です。運転手を含め2名以上必要です。`);
      }
      if (players===1 && !relaxedRules.playerMin2){
        warnings.push(`【絶対条件】${car.familySurname}号車は選手が1名だけです。選手は0名または2名以上にしてください。`);
      }
    }
    // ▲前川号 用具車専用ルール（西脇号は上記の通常判定をそのまま適用）
    const siblingSurnamesInCar = new Set(car.seats.filter(s=>s.kind==='sibling').map(s=>s.surname));
    siblingSurnamesInCar.forEach(sn=>{
      const hasFamilyParent = car.seats.some(s=>(s.kind==='driver'||s.kind==='parent') && s.surname===sn);
      if (!hasFamilyParent) warnings.push(`【絶対条件】${car.familySurname}号車に${sn}家の兄弟姉妹が、保護者の同乗なしで配置されています。`);
    });
  });
  result.cars.filter(c=>c.type==='officer').forEach(car=>{
    if (car.seats.length>4 && !relaxedRules.officerMax4) warnings.push(`【絶対条件】${car.familySurname}号車（役員車）が4名を超えています。`);
    if (car.seats.some(s=>s.kind==='player' || (s.kind==='parent' && !s.isOfficerParent))){
      warnings.push(`【絶対条件】${car.familySurname}号車（役員車）に乗車対象外の方が配置されています。総務担当・監督・会長・コーチ・サポートコーチ以外は乗車できません。`);
    }
  });
  result.cars.forEach(car=>{
    const capLimit = car.capacity + (isCapacityOverAllowed(car, relaxedRules) ? 1 : 0);
    if (car.seats.length > capLimit){
      warnings.push(`【絶対条件】${car.familySurname}号車が定員（${car.capacity}名）を超えています。`);
    }
  });
  if (result.unassigned.length){
    warnings.push(`【絶対条件】配車しきれなかった参加者が${result.unassigned.length}名います。`);
  }
  warnings.push(...findDuplicatePeople(result.cars));
  result.warnings = warnings;
  result.hardErrors = hardRuleViolations(result, relaxedRules);
  result.valid = result.hardErrors.length===0;
}

/* =========================================================
   ③配車表：運転手1人だけの車の判定
   ・対象は「選手・父兄車（type:'general'）」のみ。
     役員・指導者車（officer）や用具車（equipment＝前川号・西脇号）は、
     運転手1名だけの状態が正常運用（前川号）または車両自体を残す必要が
     あるため、対象には含めない。
   ・運転手1人だけの車を専用の「統合」機能で他車へ自動的にまとめる処理は廃止し、
     運転手本人の乗車先も、他の乗車者と同じ「move-seat」の仕組み（乗車先を
     変更するドロップダウン）で手動移動できるようにする（renderAssignment・
     handleClickのmove-seat処理を参照）。
   ========================================================= */
function isLoneDriverCar(car){
  return !!car && car.type==='general' && car.seats.length===1 && car.seats[0].kind==='driver';
}

/* ---------------- ③ 配車表 ---------------- */
/* 配車表に表示する「何台目か」の番号を、①②③…の丸数字1文字で表す。
   20を超える場合は丸数字が用意されていないため、代わりに(21)のような表記にする。 */
function carOrderNumber(n){
  if (n>=1 && n<=20) return String.fromCodePoint(0x2460 + (n-1));
  return `(${n})`;
}
function carTypeLabel(t, car){
  if (t==='officer') return '役員・指導者車';
  if (t==='equipment') return '用具車';
  // ▼初期設定では役員・指導者車（総務車両）だが、今回は役員・指導者車として使う
  // 必要がないため一般車として開放された車両（例：辻号・中山号）。
  // 「あれ？辻号なのに役員車ではないの？」とならないよう、その回の実際の用途を表示する。
  if (isDemotedOfficerCar(car)) return '選手・保護者号';
  // ▲
  // 選手・父兄車（一般車）のうち、実際に乗車している座席が保護者（運転手含む）
  // だけで選手が1人も乗っていない車は、「父兄車」として表示する。
  // car（座席情報）が渡されない場合（まだ配車前の一覧など）は、
  // これまでどおり「選手・父兄車」と表示する。
  if (car && Array.isArray(car.seats)){
    const hasPlayer = car.seats.some(s=>s.kind==='player');
    return hasPlayer ? '選手・父兄車' : '父兄車';
  }
  return '選手・父兄車';
}
function carSelectOptions(cars, excludeCarId){
  return cars.filter(c=>c.id!==excludeCarId).map(c=>`<option value="${c.id}">${escapeHtml(c.familySurname)}号（${carTypeLabel(c.type, c)}）</option>`).join('');
}
/* 配車表の表示順：運転手 → 同乗の保護者（役員・指導者車のスタッフも同列）→ 選手・兄弟姉妹 */
function seatKindOrder(kind){
  const order = {driver:0, parent:1, staff:1, player:2, sibling:2};
  return (kind in order) ? order[kind] : 3;
}
function orderSeatsForDisplay(seats){
  return seats.map((s,i)=>({s,i})).sort((a,b)=>{
    const oa = seatKindOrder(a.s.kind), ob = seatKindOrder(b.s.kind);
    const ka = (oa===undefined?3:oa), kb = (ob===undefined?3:ob);
    if (ka!==kb) return ka-kb;
    if (a.s.kind==='player' && b.s.kind==='player'){
      // 選手は背番号の若い順に並べる（数値として比較できない場合は末尾へ）
      const na = parseInt(a.s.number,10), nb = parseInt(b.s.number,10);
      const va = isNaN(na) ? Infinity : na, vb = isNaN(nb) ? Infinity : nb;
      if (va!==vb) return va-vb;
      return String(a.s.number||'').localeCompare(String(b.s.number||''), 'ja');
    }
    return a.i-b.i; // 運転手・保護者・スタッフは元の順序を保つ（安定ソート）
  }).map(x=>x.s);
}
/* 車両の座席（seats配列そのもの）を、表示順と同じ基準（運転手→保護者/スタッフ→選手は背番号順）
   で並べ替える。履歴保存・詳細入力・過去データの読み込み時に呼び出し、
   保存されるデータ自体も並び替え後の順序になるようにする。 */
function sortCarSeats(car){
  car.seats = orderSeatsForDisplay(car.seats);
}

function renderAssignment(){
  if (!state.draft || !state.draft.result){
    return `<div class="card"><div class="empty">まだ配車表がありません。②配車登録で入力し「自動配車を作成する」を押してください。</div></div>`;
  }
  const d = state.draft;
  const r = d.result;
  const isValid = r.valid !== false && !(r.hardErrors && r.hardErrors.length);

  const relaxOptions = r.relaxOptions || getRelaxOptions();
  const relaxedNow = d.relaxedRules || {};
  const checkedRelax = relaxOptions.filter(o=>relaxedNow[o.key]);
  const remainingRelax = relaxOptions.filter(o=>!relaxedNow[o.key]);
  // 「絶対条件の緩和」パネルの開閉：ユーザーが一度でも開閉ボタンを押していれば
  // その状態（true/false）を常に優先する。まだ一度も操作していない場合は、
  // 絶対条件が未成立であっても自動では開かず、必ず閉じた状態で表示する。
  const relaxPanelOpen = (typeof d.relaxPanelOpen === 'boolean') ? d.relaxPanelOpen : false;
  const relaxHtml = relaxOptions.length ? `
    <div class="card" style="margin-top:10px;${isValid ? '' : 'border:1px solid #E2B04A;background:#FFF9E8;'}">
      <div class="card-head-row">
        <div style="font-weight:700;">絶対条件の緩和</div>
        <button class="btn ghost small toggle-btn" data-action="toggle-relax-panel" type="button">${relaxPanelOpen?'閉じる':'開く'}</button>
      </div>
      ${isValid ? '' : `<div class="small-muted" style="margin-top:2px;color:#8A5A00;">絶対条件が満たされていません。必要であれば条件を緩和して、もう一度自動配車をお試しください。</div>`}
      <div class="small-muted" style="margin-top:2px;">${checkedRelax.length ? `現在緩和中：${checkedRelax.map(o=>escapeHtml(o.label)).join('、')}` : '現在、緩和している条件はありません。'}</div>
      ${relaxPanelOpen ? `
        <div class="small-muted" style="margin:8px 0;">一度の再作成で成立しなくても問題ありません。<b>現在の緩和条件は保持したまま、さらに条件を追加して何度でも再作成できます。</b>不要になった条件のチェックを外して再作成することもできます。いつでもこの画面から設定を変更できます。</div>
        ${(!isValid && checkedRelax.length) ? `<div style="padding:7px 9px;margin-bottom:8px;background:#F5EBCB;border-radius:4px;font-size:12px;"><b>現在すでに緩和中：</b>${checkedRelax.map(o=>escapeHtml(o.label)).join('、')}</div>` : ''}
        ${relaxOptions.map(o=>{
          const isCapacityOver = o.key==='capacityOver';
          const capacityOverCars = (relaxedNow.capacityOverCars||[]);
          const capacityOverSummary = isCapacityOver && relaxedNow[o.key]
            ? `<div class="small-muted" style="margin-left:22px;margin-top:4px;">対象車両：${capacityOverCars.length ? capacityOverCars.map(sn=>escapeHtml(capacityOverCarLabel(sn))+'号車').join('、') : '（未選択：現時点では効果がありません）'}　<button class="btn ghost small" data-action="open-capacity-over-picker" type="button" style="margin-left:4px;padding:2px 8px;">車両を選ぶ</button></div>`
            : '';
          return `<label style="display:block;margin:8px 0;cursor:pointer;"><input type="checkbox" data-action="toggle-relax-rule" data-rule="${escapeHtml(o.key)}" ${relaxedNow[o.key]?'checked':''}> <b>${escapeHtml(o.label)}</b><br><span class="small-muted" style="margin-left:22px;">${escapeHtml(o.note)}</span></label>${capacityOverSummary}`;
        }).join('')}
        <div class="small-muted" style="margin-top:8px;">チェックを変更したら、下の「自動配車をやり直す」を押すと、選択した条件を反映して再作成されます。</div>
        ${(!isValid && remainingRelax.length===0) ? `<div class="small-muted" style="margin-top:8px;color:#8A5A00;">※緩和可能な条件をすべて選択しています。それでも成立しない場合は、車出し候補・参加者・制限台数・車両定員を見直してください。</div>` : ''}
      ` : ''}
    </div>` : '';

  // 「車両の入れ替え」：配車がうまくいかない場合に、今回使用している一般車を、
  // 他に「配車（車出し）可能」だが今回は使われていない候補車と入れ替えられるようにする。
  // 設定した入替えは絶対条件の緩和と同様に保持され、「自動配車をやり直す」を押すたびに反映される。
  const carSwaps = Array.isArray(d.carSwaps) ? d.carSwaps : [];
  // 役員・指導者車／用具車としてSTEP3で指定されている家庭は、今回たまたま
  // （出席する役員・指導者がいない等の理由で）一般車として扱われている場合でも、
  // 次回の自動配車では常に優先的に確保されるため、入替え元には選べないようにする。
  // これを見落とすと、入替え元に選んでも次の「自動配車をやり直す」で無視され、
  // 「入替えが反映されない車両」に見えてしまう。
  const extraCarFamilyIds = new Set((d.extraCars||[]).map(x=>x.familyId || x.familySurname).filter(Boolean));
  const usedGeneralCars = (r.cars||[])
    .filter(c=>c.type==='general' && c.baseType!=='officer' && c.baseType!=='equipment' && !extraCarFamilyIds.has(c.familyId || c.familySurname))
    .map(c=>({id: c.familyId || c.familySurname, surname: c.familySurname}));
  const swappedOutIds = new Set(carSwaps.map(s=>s.outId));
  const swappedInIds = new Set(carSwaps.map(s=>s.inId));
  const swapOutOptions = usedGeneralCars.filter(c=>!swappedOutIds.has(c.id) && !swappedInIds.has(c.id));
  const swapInOptions = buildCandidateSurnames(d)
    .filter(sn=>!(r.selectedSurnames||[]).includes(sn) && !swappedInIds.has(sn))
    .map(sn=>{ const fam=familyBySurname(sn); return {id:sn, surname: fam?fam.surname:sn}; });
  const carSwapPanelOpen = (typeof d.carSwapPanelOpen === 'boolean') ? d.carSwapPanelOpen : false;
  const tempSwap = state.tempCarSwap || {outId:'', inId:''};
  const carSwapSummaryLabel = (id)=>{ const fam=familyBySurname(id); return escapeHtml(fam?fam.surname:id); };
  const carSwapHtml = `
    <div class="card" style="margin-top:10px;">
      <div class="card-head-row">
        <div style="font-weight:700;">車両の入れ替え</div>
        <button class="btn ghost small toggle-btn" data-action="toggle-car-swap-panel" type="button">${carSwapPanelOpen?'閉じる':'開く'}</button>
      </div>
      <div class="small-muted" style="margin-top:2px;">${carSwaps.length ? `設定中の入替え：${carSwaps.map(s=>`${carSwapSummaryLabel(s.outId)}号車→${carSwapSummaryLabel(s.inId)}号車`).join('、')}` : '現在、入替え設定はありません。'}</div>
      ${carSwapPanelOpen ? `
        <div class="small-muted" style="margin:8px 0;">配車がうまくいかない場合に、今回使用している車両（一般車）を、他に「配車（車出し）可能」な候補車と入れ替えられます。入れ替えたあと、下の「自動配車をやり直す」を押すと反映されます。</div>
        ${carSwaps.length ? carSwaps.map((s,i)=>`
          <div class="row-actions" style="margin:6px 0;align-items:center;">
            <span>${carSwapSummaryLabel(s.outId)}号車　→　${carSwapSummaryLabel(s.inId)}号車</span>
            <button class="btn ghost small" data-action="remove-car-swap" data-index="${i}" type="button">✕ この入替えを取り消す</button>
          </div>`).join('') : ''}
        ${(swapOutOptions.length && swapInOptions.length) ? `
          <div class="row-actions" style="margin-top:10px;flex-wrap:wrap;">
            <select data-action="car-swap-select-out" style="width:auto;">
              <option value="">入替え元（今回使用中の車）を選択</option>
              ${swapOutOptions.map(c=>`<option value="${escapeHtml(c.id)}" ${tempSwap.outId===c.id?'selected':''}>${escapeHtml(c.surname)}号車</option>`).join('')}
            </select>
            <select data-action="car-swap-select-in" style="width:auto;">
              <option value="">入替え先（配車可能な候補車）を選択</option>
              ${swapInOptions.map(c=>`<option value="${escapeHtml(c.id)}" ${tempSwap.inId===c.id?'selected':''}>${escapeHtml(c.surname)}号車</option>`).join('')}
            </select>
            <button class="btn ghost small" data-action="add-car-swap" type="button">＋ この入替えを追加</button>
          </div>
        ` : `<div class="small-muted" style="margin-top:8px;">${!usedGeneralCars.length ? '入替え元にできる車両（一般車）が今回の配車表にありません。' : '入替え先にできる、他の配車可能な候補車がありません（②STEP 2で登録した候補が、すべて今回すでに使用されています）。'}</div>`}
        <p class="desc" style="margin-top:8px;">※役員・指導者車／用具車として指定した車両は、この入替えの対象にはできません。</p>
      ` : ''}
    </div>`;

  const warnBoxHtml = r.warnings.length ? `
    <div class="warn-box"><b>確認してください</b>${r.warnings.map(w=>'・'+escapeHtml(w)).join('<br>')}</div>
  ` : `<div class="warn-box" style="background:#E7F2E9;border-color:#BFDAC6;color:var(--field-dark);"><b>OK</b>絶対条件（保護者2名以上・役員/用具車の対象車両）は満たされています。内容を確認のうえ保存してください。</div>`;
  // 「車出し可能な候補が足りない」ことが未成立の原因になっている場合、原因と対処法が
  // 警告の一覧に埋もれて気づきにくいため、専用の目立つ案内を別枠で表示する。
  // （使用上限台数を増やすだけでは車は増えない、というよくある誤解への対処）
  const shortageWarning = (r.warnings||[]).find(w=>w.includes('車出し可能な候補は'));
  const shortageNoticeHtml = (!isValid && shortageWarning) ? `
    <div class="warn-box" style="background:#FFF3E0;border-color:#E2924A;">
      <b>車出し可能な候補が足りません</b><br>
      ${escapeHtml(shortageWarning)}<br>
      <span class="small-muted">「使用上限台数」を増やすだけでは車は増えません。②STEP 2「家族ごとの参加・配車」で、対象の家庭を「配車（車出し）可能」にチェックし、運転手を選んでください。</span>
      <div class="row-actions" style="margin-top:8px;">
        <button class="btn ghost small" data-action="back-to-register" type="button">②へ戻って車出し候補を追加する</button>
      </div>
    </div>
  ` : '';
  const warnHtml = shortageNoticeHtml + warnBoxHtml + relaxHtml + carSwapHtml;

  const totalCarCount = r.cars.length;
  const carsHtml = r.cars.map((car, carIdx)=>{
    // 運転手1人だけの車は、専用の「統合」機能は使わず、運転手本人の乗車先も
    // 他の乗車者と同じ「乗車先を変更するドロップダウン」（move-seat）で
    // 手動移動できるようにする。
    const loneDriver = isLoneDriverCar(car);
    const seatsHtml = orderSeatsForDisplay(car.seats).map(seat=>{
      const showMoveSelect = seat.kind!=='driver' || loneDriver;
      const moveControl = showMoveSelect ? `
        <select data-action="move-seat" data-from="${car.id}" data-seatkey="${escapeHtml(seat.key)}" style="width:auto;font-size:12px;padding:3px 5px;">
          <option value="">（この車のまま）</option>
          ${carSelectOptions(r.cars, car.id)}
          <option value="__unassigned__">未配置に戻す</option>
        </select>
      ` : `<span class="kindtag">運転手</span>`;
      const kindLabel = {driver:'運転手',parent:'保護者',player:'選手',staff:'スタッフ',sibling:'兄弟姉妹'}[seat.kind]||'';
      return `<div class="seat-row"><span>${escapeHtml(seatDisplayName(seat))} <span class="kindtag">${kindLabel}</span></span>${moveControl}</div>`;
    }).join('');
    // 初期設定では役員・指導者車（総務車両）だが、今回は一般車として使用する車両は
    // その理由が一目で分かるよう、車名の下に短い注記を出す（画面は複雑にしない）。
    const demotedNote = isDemotedOfficerCar(car)
      ? `<div class="small-muted" style="padding:4px 10px 0;">初期設定：総務車両　／　今回：一般車として使用</div>`
      : '';
    return `
    <div class="car-card">
      <div class="car-head">
        <span class="name">${carOrderNumber(carIdx+1)}　${escapeHtml(car.familySurname)}号車　<span class="small-muted" style="color:#C9D6E0;">${carTypeLabel(car.type, car)}</span></span>
        <span class="cap-note" style="color:#C9D6E0;">${car.seats.length} / ${car.capacity}名</span>
      </div>
      ${demotedNote}
      <div class="car-body">${seatsHtml || '<span class="small-muted">乗車者なし</span>'}</div>
    </div>`;
  }).join('');

  const localArrivalList = r.localArrivalFamilies || [];
  const heldBackList = r.heldBackFamilies || [];
  const transportList = r.transportFamilies || [];
  const localStaffList = r.localArrivalStaff || [];
  const staffPickupList = r.staffPickup || [];
  const staffHeldBackList = r.staffHeldBack || [];
  const anyMoreAfter = (...lists)=>lists.some(l=>l.length);
  const localInfoHtml = (localArrivalList.length || heldBackList.length || transportList.length || localStaffList.length || staffPickupList.length || staffHeldBackList.length) ? `
    <hr class="rule">
    ${localStaffList.length ? `
    <div style="margin-bottom:${anyMoreAfter(localArrivalList, heldBackList, transportList, staffPickupList, staffHeldBackList) ? '10px' : '0'};">
      <span class="pill gold">指導者・コーチ　現地集合・解散　${localStaffList.length}名</span>
      <div class="small-muted" style="margin-top:4px;">${localStaffList.map(n=>escapeHtml(n)).join('、')}</div>
    </div>` : ''}
    ${staffPickupList.length ? `
    <div style="margin-bottom:${anyMoreAfter(localArrivalList, heldBackList, transportList, staffHeldBackList) ? '10px' : '0'};">
      <span class="pill">指導者・コーチ　送迎あり（車の留め置き不要）　${staffPickupList.length}名</span>
      <div class="small-muted" style="margin-top:4px;">${staffPickupList.map(n=>escapeHtml(n)).join('、')}</div>
    </div>` : ''}
    ${staffHeldBackList.length ? `
    <div style="margin-bottom:${anyMoreAfter(localArrivalList, heldBackList, transportList) ? '10px' : '0'};">
      <span class="pill">指導者・コーチ　車を留め置き　${staffHeldBackList.length}名</span>
      <div class="small-muted" style="margin-top:4px;">${staffHeldBackList.map(n=>escapeHtml(n)).join('、')}</div>
    </div>` : ''}
    ${localArrivalList.length ? `
    <div style="margin-bottom:${(heldBackList.length || transportList.length) ? '10px' : '0'};">
      <span class="pill gold">現地集合・解散　${localArrivalList.length}台</span>
      <div class="small-muted" style="margin-top:4px;">${localArrivalList.map(sn=>escapeHtml(sn)+'家').join('、')}</div>
    </div>` : ''}
    ${transportList.length ? `
    <div style="margin-bottom:${heldBackList.length ? '10px' : '0'};">
      <span class="pill">集合場所へ送迎（配車なし）　${transportList.length}家庭</span>
      <div class="small-muted" style="margin-top:4px;">${transportList.map(sn=>escapeHtml(sn)+'家').join('、')}</div>
    </div>` : ''}
    ${heldBackList.length ? `
    <div>
      <span class="pill">集合場所へ留め置き（配車なし）　${heldBackList.length}家庭</span>
      <div class="small-muted" style="margin-top:4px;">${heldBackList.map(sn=>escapeHtml(sn)+'家').join('、')}</div>
    </div>` : ''}
  ` : '';

  const unassignedHtml = r.unassigned.map(p=>`
    <div class="seat-row">
      <span>${escapeHtml(seatDisplayName(p))} <span class="kindtag">${p.kind==='player'?'選手':p.kind==='staff'?'役員・指導者':p.kind==='sibling'?'兄弟姉妹':'保護者'}</span></span>
      <select data-action="move-seat" data-from="__unassigned__" data-seatkey="${escapeHtml(p.key)}" style="width:auto;font-size:12px;padding:3px 5px;">
        <option value="">配車先を選択</option>
        ${carSelectOptions(r.cars, null)}
      </select>
    </div>`).join('');

  return `
  <div class="card">
    <h2>${escapeHtml(d.destination||'（行先未入力）')} <span class="tag">${escapeHtml(d.date||'日付未入力')}</span></h2>
    <p class="desc">${escapeHtml(d.location||'')}</p>
    ${r.selectionSummary?`<div class="small-muted" style="margin-bottom:8px;">${escapeHtml(r.selectionSummary)}</div>`:''}
    ${Object.keys(d.relaxedRules||{}).filter(k=>d.relaxedRules[k] && relaxedRuleLabels()[k]).length ? `<div class="warn-box" style="background:#FFF9E8;border-color:#E2B04A;"><b>今回だけ緩和した条件</b><br>${Object.keys(d.relaxedRules).filter(k=>d.relaxedRules[k] && relaxedRuleLabels()[k]).map(k=>{
      const label = relaxedRuleLabels()[k];
      if (k==='capacityOver'){
        const cars = d.relaxedRules.capacityOverCars||[];
        return label + (cars.length ? `（対象：${cars.map(sn=>escapeHtml(capacityOverCarLabel(sn))+'号車').join('、')}）` : '（対象車両未選択）');
      }
      return label;
    }).join('、')}</div>` : ''}
    ${warnHtml}
    <div class="row-actions" style="margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn secondary small" data-action="regenerate">自動配車をやり直す</button>
      <button class="btn ghost small" data-action="undo-assignment" ${state.assignmentUndo && state.assignmentUndo.length ? '' : 'disabled'}>↶ アンドゥ（1つ前に戻す）${state.assignmentUndo && state.assignmentUndo.length ? ` [${state.assignmentUndo.length}]` : ''}</button>
      <button class="btn ghost small" data-action="redo-assignment" ${state.assignmentRedo && state.assignmentRedo.length ? '' : 'disabled'}>↷ 進む（戻す前に戻す）${state.assignmentRedo && state.assignmentRedo.length ? ` [${state.assignmentRedo.length}]` : ''}</button>
      <button class="btn danger small" data-action="clear-assignment" type="button">✕ 配車表をクリア</button>
    </div>
    <p class="small-muted" style="margin:-6px 0 10px;">「配車表をクリア」は③の配車表だけを空にします。②で入力した内容（家族・指導者コーチ・台数など）は消えません。クリア後は「アンドゥ」で元に戻すことはできません。</p>
  </div>

function renderHistory(){
  const counts = {};
  const lastDate = {};
  state.events.forEach(ev=>{
    (ev.result.cars||[]).forEach(car=>{
      counts[car.familySurname] = (counts[car.familySurname]||0)+1;
      if (!lastDate[car.familySurname] || ev.date > lastDate[car.familySurname]) lastDate[car.familySurname] = ev.date;
    });
  });
  const famSummary = state.families.map(f=>({
    surname:f.surname, count: counts[f.surname]||0, last: lastDate[f.surname]||'—'
  })).sort((a,b)=>a.count-b.count);

  const summaryRows = famSummary.map(s=>`
    <tr>
      <td data-label="家族">${escapeHtml(s.surname)}家</td>
      <td data-label="配車回数">${s.count}回</td>
      <td data-label="直近の配車日">${escapeHtml(s.last)}</td>
    </tr>`).join('');

  const eventRows = [...state.events].sort((a,b)=> (b.date||'').localeCompare(a.date||'')).map(ev=>{
    const cars = ev.result.cars.map(c=>`${escapeHtml(c.familySurname)}号`).join('、');
    // 絶対条件を満たさないまま保存された履歴には、一覧上でも分かるように注意表示を出す
    const hardErrTag = ev.savedWithHardErrors ? `<span class="tag" style="background:#F5C6C6;color:#5A1A1A;">絶対条件未達</span>` : '';
    const snapshotTag = ev.registrationSnapshot ? `<span class="tag" title="②配車登録の条件（台数・配慮設定など）が記録されています">②条件あり</span>` : '';
    return `
    <tr>

  }).join('');

  // ごみ箱（削除した履歴）：30日以内なら復元できる。期限切れ分は起動時・表示時に自動で完全削除される。
  if (purgeExpiredTrash()) saveEventsTrash().catch(()=>{});

    ${state.historyEventsOpen ? `

      <thead><tr><th>日付</th><th>行先</th><th>場所</th><th>配車した家庭</th><th>操作</th></tr></thead>

function buildDetailCarsFromHistoryEvent(ev){
  // 「配車履歴」の1件（ev）の車両構成を、「過去の実績を登録」フォームの
  // 入力形式（dh.cars）に変換する。運転手は別項目（familySurname/driverRole）、
  // 同乗の保護者・選手は allPeopleList() と同じ「家庭ID|区分」形式のキー配列、
  // 同乗の役員・指導者（スタッフ）は「staff|氏名」形式のキー配列にする。
  let unresolved = 0;
  const cars = (ev.result && ev.result.cars || []).map(car=>{
    const fam = familyBySurname(car.familyId || car.familySurname);
    if (!fam) unresolved++;
    const passengerParents = [];
    const passengerPlayers = [];
    const passengerStaff = [];
    (car.seats||[]).forEach(seat=>{
      if (seat.kind==='driver') return;
      if (seat.kind==='staff'){
        const name = seat.personName || (seat.key||'').replace(/^staff-/,'');
        const st = state.staff.find(s=>s.name===name);
        if (!st){ unresolved++; return; }
        passengerStaff.push(`staff|${st.name}`);
        return;
      }
      const sf = familyBySurname(seat.familyId || seat.surname);
      if (!sf){ unresolved++; return; }
      if (seat.kind==='parent' && seat.gender){
        passengerParents.push(`${familyIdentity(sf)}|${seat.gender}`);
      } else if (seat.kind==='player' && seat.playerIdx!=null){
        passengerPlayers.push(`${familyIdentity(sf)}|player|${seat.playerIdx}`);
      }
    });
    while (passengerParents.length < 4) passengerParents.push(null);
    while (passengerPlayers.length < 6) passengerPlayers.push(null);
    while (passengerStaff.length < 3) passengerStaff.push(null);
    return {
      id: uid('dhc'),
      familyId: fam ? fam.id : null,
      familySurname: fam ? familyIdentity(fam) : null,
      driverRole: fam ? (car.driverRole || 'father') : null,
      carType: car.type || 'general',
      passengerParents,
      passengerPlayers,
      passengerStaff,
      collapsed: true, // 配車履歴から読み込んだ直後は、一覧性を優先して折りたたんだ状態にする
    };
  });
  return {cars, unresolved};
}

function detailHistoryFormHtml(){
  const dh = state.detailHistoryDraft;
  const people = allPeopleList();
  const parentPeople = people.filter(p=>p.kind==='parent');
  const playerPeople = people.filter(p=>p.kind==='player');
  const staffPeople = state.staff.map(s=>({key:`staff|${s.name}`, label:`${s.name}（${s.role}）`}));
  const CAR_TYPES = [
    {value:'general', label:'選手・父兄車'},
    {value:'officer', label:'役員・指導者車'},
    {value:'equipment', label:'用具車'},
  ];

  const historyOptions = [...state.events].sort((a,b)=> (b.date||'').localeCompare(a.date||'')).map(ev=>
    `<option value="${escapeHtml(ev.id)}">${escapeHtml(ev.date||'日付未設定')}　${escapeHtml(ev.destination||'')}　${escapeHtml(ev.location||'')}</option>`
  ).join('');
  const loadFromHistoryHtml = state.events.length ? `
    <div class="stack" style="margin-bottom:14px;">
      <span class="field-label">配車履歴から読み込む（内容をコピーして、この下で編集・保存できます）</span>
      <div class="row-target">
        <select id="dh-load-select"><option value="">選択してください</option>${historyOptions}</select>
        <div><button class="btn ghost small" data-action="dh-load-from-history" type="button">読み込む</button></div>
      </div>
    </div>` : '';

  // 人数調整（＋／－）ボタン。kind は 'parent' | 'player' | 'staff'。
  function slotAdjustButtons(kind, i){
    return `<span style="display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle;">
      <button class="btn ghost small" style="padding:2px 8px;" data-action="dh-add-slot" data-kind="${kind}" data-i="${i}" type="button" title="人数を増やす">＋</button>
      <button class="btn ghost small" style="padding:2px 8px;" data-action="dh-remove-slot" data-kind="${kind}" data-i="${i}" type="button" title="人数を減らす">－</button>
    </span>`;
  }

  const carsHtml = dh.cars.map((c,i)=>{
    // 過去に作成された（フィールドが未定義の）データも問題なく扱えるよう補完する
    c.passengerParents = c.passengerParents || [];
    c.passengerPlayers = c.passengerPlayers || [];
    c.passengerStaff = c.passengerStaff || [];

    const driverKey = (c.familySurname && c.driverRole) ? `${c.familySurname}|${c.driverRole}` : '';
    const carType = c.carType || 'general';
    const driverOptions = parentPeople.map(p=>`<option value="${escapeHtml(p.key)}" ${driverKey===p.key?'selected':''}>${escapeHtml(p.label)}</option>`).join('');
    const carTypeOptions = CAR_TYPES.map(t=>`<option value="${t.value}" ${carType===t.value?'selected':''}>${t.label}</option>`).join('');

    const parentSlotsHtml = c.passengerParents.map((val,slot)=>{
      const opts = parentPeople.filter(p=>p.key!==driverKey).map(p=>`<option value="${escapeHtml(p.key)}" ${val===p.key?'selected':''}>${escapeHtml(p.label)}</option>`).join('');
      return `<select data-action="dh-passenger-parent" data-i="${i}" data-slot="${slot}"><option value="">（同乗の保護者：未選択）</option>${opts}</select>`;
    }).join('');

    const playerSlotsHtml = c.passengerPlayers.map((val,slot)=>{
      const opts = playerPeople.map(p=>`<option value="${escapeHtml(p.key)}" ${val===p.key?'selected':''}>${escapeHtml(p.label)}</option>`).join('');
      return `<select data-action="dh-passenger-player" data-i="${i}" data-slot="${slot}"><option value="">（同乗の選手：未選択）</option>${opts}</select>`;
    }).join('');

    const staffSlotsHtml = c.passengerStaff.map((val,slot)=>{
      const opts = staffPeople.map(p=>`<option value="${escapeHtml(p.key)}" ${val===p.key?'selected':''}>${escapeHtml(p.label)}</option>`).join('');
      return `<select data-action="dh-passenger-staff" data-i="${i}" data-slot="${slot}"><option value="">（同乗の役員・指導者：未選択）</option>${opts}</select>`;
    }).join('');

    const driverSummary = driverKey ? (parentPeople.find(p=>p.key===driverKey)||{}).label : '運転手：未設定';
    const typeLabel = (CAR_TYPES.find(t=>t.value===carType)||{}).label || carType;
    const isOpen = !c.collapsed;

    const headerHtml = `
      <button type="button" class="list-row" data-action="dh-toggle-car" data-i="${i}">
        <span class="list-row-main">
          <span class="list-row-name">${i+1}台目</span>
          <span class="list-row-meta">${escapeHtml(typeLabel)}・${escapeHtml(driverSummary)}</span>
        </span>
        <span class="list-row-arrow" style="transform:rotate(${isOpen?90:0}deg);">›</span>
      </button>`;

    if (!isOpen){
      return `<div class="fam-block">${headerHtml}</div>`;
    }

    return `
    <div class="fam-block">
      ${headerHtml}
      <div class="fam-block-body">
      <div class="form-grid" style="margin:8px 0;">
        <div class="stack">
          <span class="field-label">車両タイプ</span>
          <select data-action="dh-cartype" data-i="${i}">${carTypeOptions}</select>
        </div>
        <div class="stack">
          <span class="field-label">運転手</span>
          <select data-action="dh-driver" data-i="${i}">
            <option value="">選択してください</option>
            ${driverOptions}
          </select>
        </div>
      </div>
      <span class="field-label">同乗の保護者（必要な人数分だけ選択）${slotAdjustButtons('parent', i)}</span>
      <div class="dh-slot-grid">${parentSlotsHtml}</div>
      <span class="field-label" style="margin-top:8px;display:block;">同乗の選手（必要な人数分だけ選択）${slotAdjustButtons('player', i)}</span>
      <div class="dh-slot-grid">${playerSlotsHtml}</div>
      ${carType==='officer' ? `
      <span class="field-label" style="margin-top:8px;display:block;">同乗の役員・指導者（必要な人数分だけ選択）${slotAdjustButtons('staff', i)}</span>
      <div class="dh-slot-grid">${staffSlotsHtml}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
    <hr class="rule">
    ${loadFromHistoryHtml}
    <div class="stack" style="margin-bottom:10px;"><span class="field-label">日付</span><div class="date-input-wrap"><input type="date" data-action="dh-field" data-field="date" value="${escapeHtml(dh.date)}"></div></div>
    <div class="form-grid">
      <div class="stack"><span class="field-label">行先・対戦相手</span><input type="text" data-action="dh-field" data-field="destination" value="${escapeHtml(dh.destination)}" placeholder="例：vs 名古屋中央ボーイズ"></div>
      <div class="stack"><span class="field-label">場所</span><input type="text" data-action="dh-field" data-field="location" value="${escapeHtml(dh.location)}" placeholder="例：木場南グラウンドB面"></div>
    </div>
    <div class="row-target" style="margin-bottom:12px;">
      <div class="stack"><span class="field-label">配車台数</span><input type="number" min="0" max="20" data-action="dh-field" data-field="carCountInput" value="${escapeHtml(dh.carCountInput)}" placeholder="例：8"></div>
      <div><button class="btn ghost small" data-action="dh-set-count" type="button">台数を設定する</button></div>
    </div>
    ${dh.cars.length ? `<div class="list-box">${carsHtml}</div>` : ''}
    <div class="row-actions" style="margin-top:10px;flex-wrap:wrap;">
      <button class="btn ghost" data-action="toggle-detail-history" type="button">← 入力内容を保持したまま戻る</button>
      <button class="btn ghost" data-action="dh-cancel" type="button">入力内容を破棄する</button>
      ${dh.cars.length ? `<button class="btn" data-action="dh-save">この内容で履歴に保存する</button>` : ''}
    </div>
  `;
}

  const carCount = r.cars.length;

  const carColumns = carCount<=3 ? 1 : (carCount<=8 ? 2 : 3);
  const carsHtml = r.cars.map((car, carIdx)=>{
    const seatsHtml = orderSeatsForDisplay(car.seats).map(seat=>{
      const kindLabel = {driver:'運転手',parent:'保護者',player:'選手',staff:'スタッフ',sibling:'兄弟姉妹'}[seat.kind]||'';
      return `<div class="export-seat"><span>${escapeHtml(seatDisplayName(seat))}</span><span class="role">${kindLabel}</span></div>`;
    }).join('');
    return `
    <div class="export-car">
      <div class="export-car-head">
        <span>${carOrderNumber(carIdx+1)}　${escapeHtml(car.familySurname)}号車<span class="type">${carTypeLabel(car.type, car)}</span></span>
        <span>${car.seats.length} / ${car.capacity}名</span>
      </div>
      ${seatsHtml || '<div class="export-empty-car">乗車者なし</div>'}
    </div>`;
  }).join('');

  const localArrivalList = r.localArrivalFamilies || [];
  const heldBackList = r.heldBackFamilies || [];
  const transportList = r.transportFamilies || [];
  const localStaffList = r.localArrivalStaff || [];
  const staffPickupList = r.staffPickup || [];
  const staffHeldBackList = r.staffHeldBack || [];
  let extraHtml = '';
  if (localStaffList.length){
    extraHtml += `
    <div class="export-section-title">指導者・コーチ　現地集合・解散（${localStaffList.length}名）</div>
    <div class="export-note">${localStaffList.map(n=>escapeHtml(n)).join('、')}</div>`;
  }
  if (staffHeldBackList.length){
    extraHtml += `
    <div class="export-section-title">指導者・コーチ　車を留め置き（${staffHeldBackList.length}名）</div>
    <div class="export-note">${staffHeldBackList.map(n=>escapeHtml(n)).join('、')}</div>`;
  }
  if (localArrivalList.length){
    extraHtml += `
    <div class="export-section-title">現地集合・解散（${localArrivalList.length}家庭）</div>
    <div class="export-note">${localArrivalList.map(sn=>escapeHtml(sn)+'家').join('、')}</div>`;
  }
  if (heldBackList.length){
    extraHtml += `
    <div class="export-section-title">配車なし・集合場所へ留め置き（${heldBackList.length}家庭）</div>
    <div class="export-note">${heldBackList.map(sn=>escapeHtml(sn)+'家').join('、')}</div>`;
  }

  // ---------------- 参加人数集計（配車で行く／現地集合解散／全体の合計チェック用） ----------------
  // 「配車で行く」人数：自動配車の結果（車に乗車済み＋まだ乗車先未定の未配置）を
  // 座席の種別（指導者・コーチ／保護者／選手／その他家族＝兄弟姉妹）ごとに集計する。
  function countSeatsByKind(seatList){
    const c = {staff:0, parent:0, player:0, sibling:0};
    (seatList||[]).forEach(s=>{
      if (s.kind==='staff') c.staff++;
      else if (s.kind==='driver' || s.kind==='parent') c.parent++;
      else if (s.kind==='player') c.player++;
      else if (s.kind==='sibling') c.sibling++;
    });
    return c;
  }
  const carSeatCounts = countSeatsByKind(r.cars.flatMap(c=>c.seats||[]));
  const unassignedCounts = countSeatsByKind(r.unassigned);
  const dispatchCounts = {
    staff: carSeatCounts.staff + unassignedCounts.staff,
    parent: carSeatCounts.parent + unassignedCounts.parent,
    player: carSeatCounts.player + unassignedCounts.player,
    sibling: carSeatCounts.sibling + unassignedCounts.sibling,
  };
  // 「現地集合・解散」人数：指導者・コーチは自動配車結果の一覧から、
  // 家族（保護者・選手・その他家族）は②配車登録の参加設定（localArrival）から集計する。
  let localParentCount = 0, localPlayerCount = 0, localSiblingCount = 0;
  state.families.forEach(f=>{
    const a = attendanceFor(d.attendance, f);
    if (!a || !a.localArrival) return;
    if (f.father && a.father) localParentCount++;
    if (f.mother && a.mother) localParentCount++;
    (f.players||[]).forEach((p,i)=>{ if (a.players && a.players['p'+i]) localPlayerCount++; });
    (f.others||[]).forEach((o,i)=>{ if (a.others && a.others['o'+i]) localSiblingCount++; });
  });
  const localCounts = {staff: localStaffList.length, parent: localParentCount, player: localPlayerCount, sibling: localSiblingCount};
  const totalCounts = {
    staff: dispatchCounts.staff + localCounts.staff,
    parent: dispatchCounts.parent + localCounts.parent,
    player: dispatchCounts.player + localCounts.player,
    sibling: dispatchCounts.sibling + localCounts.sibling,
  };
  const grandDispatch = dispatchCounts.staff + dispatchCounts.parent + dispatchCounts.player + dispatchCounts.sibling;
  const grandLocal = localCounts.staff + localCounts.parent + localCounts.player + localCounts.sibling;
  const grandTotal = grandDispatch + grandLocal;
  const summaryRows = [
    {label:'指導者・コーチ', key:'staff'},
    {label:'保護者', key:'parent'},
    {label:'選手', key:'player'},
    {label:'その他家族', key:'sibling'},
  ];
  const summaryTableHtml = `
  <div class="export-section-title">参加人数集計</div>
  <table class="export-summary-table">
    <thead><tr><th>区分</th><th>配車で行く</th><th>現地集合・解散</th><th>合計</th></tr></thead>
    <tbody>
      ${summaryRows.map(row=>`<tr><td>${row.label}</td><td>${dispatchCounts[row.key]}名</td><td>${localCounts[row.key]}名</td><td>${totalCounts[row.key]}名</td></tr>`).join('')}
      <tr class="total-row"><td>全体合計</td><td>${grandDispatch}名</td><td>${grandLocal}名</td><td>${grandTotal}名</td></tr>
    </tbody>
  </table>`;

  const exportDate = d.date ? (()=>{ const m=String(d.date).match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[1]}.${Number(m[2])}.${Number(m[3])}` : d.date; })() : '';
  return `
  <div class="export-sheet">
    <h1>配車表　<span style="font-size:14px;font-weight:400;color:#555;">合計 ${r.cars.length}台</span></h1>
    <div class="meta">${exportDate ? `日付：${escapeHtml(exportDate)}` : ''}${d.destination ? `　行先・対戦相手：${escapeHtml(d.destination)}` : ''}${d.location ? `　場所：${escapeHtml(d.location)}` : ''}</div>
    <div class="export-cars-columns" style="column-count:${carColumns};">
      ${carsHtml || '<div class="export-empty-car">配車される車がありません</div>'}
    </div>
    ${extraHtml}
    ${summaryTableHtml}
  </div>`;
}
/* 共有時に付けるコメント。例：「【7/26 ○○戦】配車表です」
   日付は配車表の日付（M/D）、○○は「行先・対戦相手」。未入力の項目は省いて組み立てる。 */
function buildShareText(d){
  const m = String((d&&d.date)||'').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  const dateLabel = m ? `${Number(m[2])}/${Number(m[3])}` : '';
  let opp = String((d&&d.destination)||'').trim();
  if (opp && !/戦$/.test(opp)) opp += '戦'; // 「○○戦」と入力済みなら二重にしない
  const inner = [dateLabel, opp].filter(Boolean).join(' ');
  return inner ? `【${inner}】配車表です` : '配車表です';
}

/* 配車表の画像（JPEG）を作成して {blob, filename, url} を返す。共有・プレビューの両方から使う。 */
async function buildAssignmentImage(){
  const d = state.draft;
  if (!d || !d.result){ alert('配車表が見つかりませんでした。'); return null; }
  if (!window.html2canvas){ alert('画像化ライブラリの読み込みに失敗しました。通信環境を確認して再度お試しください。'); return null; }

  // 画面には表示しない位置に、出力専用のレイアウトを一時的に生成する
  const holder = document.createElement('div');
  holder.style.position = 'fixed';
  holder.style.top = '0';
  holder.style.left = '-9999px';
  holder.style.zIndex = '-1';
  holder.innerHTML = buildExportHtml(d, d.result);
  document.body.appendChild(holder);
  const target = holder.firstElementChild;

  let canvas;
  try{
    canvas = await window.html2canvas(target, {backgroundColor:'#ffffff', scale:2, useCORS:true});
  }catch(e){
    document.body.removeChild(holder);
    alert('画像の作成に失敗しました。'); console.error(e); return null;
  }
  document.body.removeChild(holder);

  // LINEなどで共有した際に画像が極端な縦長にならないよう、
  // 出来上がった配車表をA4サイズ（210mm×297mm）の縦横比の中に収める。
  // 内容がA4の比率より縦長な場合だけ縮小し、左右に白い余白を入れる。
  // 内容がA4の比率より短い場合はそのままの大きさで、下側に白い余白が入る。
  const A4_RATIO = 297 / 210;
  const srcW = canvas.width, srcH = canvas.height;
  const targetW = srcW;
  const targetH = Math.round(targetW * A4_RATIO);
  const fitScale = Math.min(1, targetH / srcH);
  const drawW = Math.round(srcW * fitScale);
  const drawH = Math.round(srcH * fitScale);
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = targetW;
  finalCanvas.height = targetH;
  const ctx = finalCanvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, targetW, targetH);
  ctx.drawImage(canvas, 0, 0, srcW, srcH, Math.round((targetW - drawW) / 2), 0, drawW, drawH);

  const blob = await new Promise(resolve=>finalCanvas.toBlob(resolve, 'image/jpeg', 0.92));
  if (!blob){ alert('画像の作成に失敗しました。'); return null; }
  return {blob, shareText:buildShareText(d), width:targetW, height:targetH, baseName:`配車表_${(d&&d.date)||'未定'}`, filename:`配車表_${(d&&d.date)||'未定'}.jpg`};
}

/* JPEG画像を、A4 1ページ分のPDFに変換する（外部ライブラリ不要・通信なしで作成）。
   画像はすでにA4の縦横比なので、ページいっぱいに配置する。 */
async function jpegBlobToPdfBlob(jpegBlob, imgW, imgH){
  const jpeg = new Uint8Array(await jpegBlob.arrayBuffer());
  const enc = new TextEncoder();
  const PAGE_W = 595.28, PAGE_H = 841.89; // A4（pt）
  const chunks = []; const offsets = []; let pos = 0;
  const push = (u8)=>{ chunks.push(u8); pos += u8.length; };
  const pushText = (t)=>push(enc.encode(t));
  const beginObj = (n)=>{ offsets[n] = pos; pushText(`${n} 0 obj\n`); };
  pushText('%PDF-1.4\n');
  beginObj(1); pushText('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  beginObj(2); pushText('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  beginObj(3); pushText(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PAGE_W} ${PAGE_H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  beginObj(4);
  pushText(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg); pushText('\nendstream\nendobj\n');
  const content = `q ${PAGE_W} 0 0 ${PAGE_H} 0 0 cm /Im0 Do Q`;
  beginObj(5); pushText(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xrefPos = pos;
  let xref = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i=1;i<=5;i++) xref += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  pushText(xref + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);
  return new Blob(chunks, {type:'application/pdf'});
}

/* 作成済みの画像を、選んだ形式（'jpeg'／'pdf'）で共有する。
   共有できない環境では、ファイルをダウンロードして代替する */
async function shareImageResult(img, format){
  let blob = img.blob, filename = img.filename, mime = 'image/jpeg';
  if (format==='pdf'){
    try{
      blob = await jpegBlobToPdfBlob(img.blob, img.width, img.height);
    }catch(e){
      alert('PDFの作成に失敗しました。'); console.error(e); return;
    }
    filename = img.baseName + '.pdf'; mime = 'application/pdf';
  }
  const file = (typeof File!=='undefined') ? new File([blob], filename, {type:mime}) : null;
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:img.shareText, text:img.shareText});
      return;
    }catch(e){
      if (e && e.name==='AbortError') return; // 共有シートを閉じただけ（キャンセル）
      /* 未対応などの失敗 → ダウンロードにフォールバック */
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}

/* 「共有」を押したときの形式選択（画像JPEG／PDF）。選んだ形式 'jpeg'／'pdf'、キャンセルなら null を返す。
   render()の再描画の影響を受けないよう、画面の最前面に独立したダイアログとして表示する。 */
function chooseShareFormat(){
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.className = 'modal-overlay confirm-overlay share-format-overlay';
    ov.innerHTML = `
      <div class="card">
        <h2>共有する形式を選んでください</h2>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:6px;">
          <button class="btn" type="button" data-format="jpeg">画像（JPEG）</button>
          <button class="btn" type="button" data-format="pdf">PDF（A4・1ページ）</button>
          <button class="btn ghost" type="button" data-format="">キャンセル</button>
        </div>
      </div>`;
    const done = (v)=>{ ov.remove(); resolve(v); };
    ov.addEventListener('click', (ev)=>{
      const b = ev.target.closest('[data-format]');
      if (b){ done(b.dataset.format || null); return; }
      if (ev.target===ov) done(null); // 余白タップはキャンセル
    });
    document.body.appendChild(ov);
  });
}

let exportBusy = false;
async function exportAssignmentImage(){ // 「共有」ボタン
  if (exportBusy) return;
  exportBusy = true;
  try{
    const format = await chooseShareFormat();
    if (!format) return;
    const img = await buildAssignmentImage();
    if (img) await shareImageResult(img, format);
  } finally { exportBusy = false; }
}

/* 「プレビュー」ボタン：保存・共有をせずに、出力される画像の内容を画面上で確認できる。
   render()の再描画の影響を受けないよう、画面の最前面に独立したオーバーレイとして表示する。 */
function closeAssignmentPreview(){
  const ov = document.getElementById('assignment-preview-overlay');
  if (ov){
    const im = ov.querySelector('img');
    if (im && im.src) URL.revokeObjectURL(im.src);
    ov.remove();
  }
}
async function previewAssignmentImage(){
  if (exportBusy) return;
  exportBusy = true;
  try{
    const img = await buildAssignmentImage();
    if (!img) return;
    closeAssignmentPreview();
    const url = URL.createObjectURL(img.blob);
    const ov = document.createElement('div');
    ov.id = 'assignment-preview-overlay';
    ov.className = 'preview-overlay';
    ov.innerHTML = `
      <div class="preview-bar">
        <span class="preview-title">プレビュー（出力される画像）</span>
        <span class="preview-actions">
          <button class="btn small" type="button" data-preview="share">共有</button>
          <button class="btn small ghost" type="button" data-preview="close">閉じる</button>
        </span>
      </div>
      <div class="preview-body"><img alt="配車表のプレビュー" src="${url}"></div>`;
    ov.addEventListener('click', async (ev)=>{
      const b = ev.target.closest('[data-preview]');
      if (b){
        if (b.dataset.preview==='close') closeAssignmentPreview();
        else if (b.dataset.preview==='share'){
          const format = await chooseShareFormat();
          if (format) await shareImageResult(img, format);
        }
        return;
      }
      if (ev.target===ov) closeAssignmentPreview(); // 余白タップでも閉じる
    });
    document.body.appendChild(ov);
  } finally { exportBusy = false; }
}

/* input/select再描画時にフォーカスとカーソル位置が失われないようにするためのヘルパー
   （数値入力などで1文字入力するたびに再描画→フォーカスが外れてしまう不具合の対策） */
const FOCUS_DATA_KEYS = ['action','field','i','idx','pi','name','surname','role','from','seatkey','type','key'];
function attrNameFromDataKey(k){ return 'data-' + k.replace(/([A-Z])/g,'-$1').toLowerCase(); }
function cssAttrEscape(v){ return String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"'); }
function captureFocus(){
  const app = document.getElementById('app');
  const active = document.activeElement;
  if (!active || !app || !app.contains(active) || !active.dataset || !active.dataset.action) return null;
  const parts = [active.tagName.toLowerCase()];
  FOCUS_DATA_KEYS.forEach(k=>{
    if (active.dataset[k] !== undefined) parts.push(`[${attrNameFromDataKey(k)}="${cssAttrEscape(active.dataset[k])}"]`);
  });
  return {
    selector: parts.join(''),
    selectionStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
    selectionEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null,
  };
}
function restoreFocus(info){
  if (!info) return;
  let el;
  try{ el = document.querySelector(info.selector); }catch(e){ return; }
  if (!el) return;
  // 再描画後にフォーカスを戻す際、PCブラウザがその要素まで自動スクロール
  // してしまうのを防ぐ。特に②配車登録の参加チェックで顕著に発生する。
  try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
  if (info.selectionStart!=null && el.setSelectionRange){
    try{ el.setSelectionRange(info.selectionStart, info.selectionEnd); }catch(e){ /* 一部のinput type（numberなど）は非対応 */ }
  }
}

function parentGivenName(name, surname){
  const n = (name || '').trim().replace(/\s+/g, ' ');
  const sn = (surname || '').trim();
  if (!n) return '';
  if (sn && n === sn) return '';
  if (sn && n.startsWith(sn)) return n.slice(sn.length).trim();
  return n;
}
function formatParentName(surname, givenName){
  const sn = (surname || '').trim();
  const gn = (givenName || '').trim().replace(/\s+/g, ' ');
  if (!gn) return '';
  return sn ? `${sn} ${gn}` : gn;
}

function renderRegister(){
  if (!state.draft){
    return `
